  /merchant/finalizePayment:
    post:
      parameters:
        - $ref: '#/paths/~1merchant~1getAbout/post/parameters/0'
        - $ref: '#/paths/~1merchant~1getAbout/post/parameters/1'
      tags:
        - Payment API
      summary: Capture Payment (Two-step Payment)
      description: Finalization of two-step payment. Debits previously blocked funds from the client. The funds will be debited from the client’s account and the payment will be finalized. Pay notification will be sent to your endpoint.
      operationId: FinalizePayment
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                payment_id:
                  type: number
                  description: Payment ID in the system
                  example: 513
                key:
                  type: string
                  description: UUIDv4 like merchant public key. Please find it in the Client Cabinet -> Settings -> API keys -> Merchant Key
                  example: A1581713-FC0A-45D1-8AE6-00A4F338143F
                  format: uuid
                timestamp:
                  type: number
                  description: Unix timestamp when this request sending (in seconds)
                  example: 1697613541
                hash:
                  type: string
                  description: hmac-sha1 hash of request.
                  example: 8cc0f7e7dc65209353ff242ab1e51e71ef3dc88c
              required:
                - payment_id
                - key
                - timestamp
                - hash
        required: true
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: object
                    properties:
                      id:
                        type: number
                        description: Unique payment ID in the SYSTEM
                        example: 513
                      order:
                        type: string
                        description: Unique payment ID in the merchant system
                        example: orNo0003
                      amount:
                        type: number
                        description: Payment amount in currency of invoice
                        example: 1000
                      status:
                        type: string
                        enum:
                          - '203'
                          - '204'
                          - '205'
                          - '208'
                          - '210'
                          - '214'
                          - '999'
                        description: |
                          Payment statuses:

                          | Status | Description                   |
                          |-------|--------------------------------|
                          | 203   | Payment has been paid. Awaiting response for "Pay" callback
                          | 204   | Payment is rejected
                          | 205   | Payment has been successfully completed
                          | 208   | Disputable state. It means that payment has been paid, but merchant responded with rejection on "Pay" notification or the payer data provided by the merchant does not match the available data of the payment system
                          | 210   | Payment has been charged
                          | 214   | Payment details are being clarified at the bank. The status will be updated later.
                          | 999   | Unknown status, contact support
                        example: 203
                      date:
                        type: string
                        description: Date and time the payment was created (ISO 8601)
                        example: '2022-01-27T10:54:56.000Z'
                      ttl:
                        type: number
                        description: Time to life of a payment (in seconds)
                        example: 3600
                      dateonhold:
                        type: string
                        description: Date and time when this payment amount will be moved from the payment hold to the available balance and will be available for withdrawal (ISO 8601)
                        example: '2022-01-28T10:54:56.000Z'
                      timestamp:
                        type: number
                        description: Unix timestamp when this request sending (in seconds)
                        example: 1697613541
                  hash:
                    type: string
                    description: Sign of response
                    example: 096b3bbd2c61aafe2bdf9c1fa5ebd88a502c8666
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/paths/~1merchant~1getAbout/post/responses/400/content/application~1json/schema'
              examples:
                '4000':
