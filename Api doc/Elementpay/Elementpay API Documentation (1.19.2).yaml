paths:
  /authorizer:
    get:
      parameters:
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            example: Mozilla/5.0 (X11; Linux x86_64)
      tags:
        - Authorizer API
      summary: Get API Version
      description: Returns info about version of Authorizer API
      operationId: GetVersion
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateway:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Name of API
                        example: Authorizer API
                      version:
                        type: string
                        description: Version of API
                        example: 1.0.0
                  urls:
                    type: object
                    properties:
                      sand:
                        type: string
                        description: Sandbox URL
                        example: 'https://api-sbox.elementpay.io/authorizer'
                      prod:
                        type: string
                        description: Production URL
                        example: 'https://api.elementpay.io/authorizer'
      x-codeSamples:
        - lang: Curl
          source: |
            curl -X GET \
            -H "User-Agent: Mozilla/5.0 (X11; Linux x86_64)" \
            https://api-sbox.elementpay.io/authorizer
        - lang: PHP
          source: |
            $options = [
                CURLOPT_URL => 'https://api-sbox.elementpay.io/authorizer/',
                CURLOPT_RETURNTRANSFER => 1,
                CURLOPT_HTTPHEADER => [
                  'User-Agent: Mozilla/5.0 (X11; Linux x86_64)'
                ]
            ];

            $curl = curl_init();
            curl_setopt_array($curl, $options);

            $response = curl_exec($curl);
            curl_close($curl);

            // Put your business logic next
  /authorizer/transfers/authorize:
    post:
      parameters:
        - name: X-Api-Key
          in: header
          required: true
          schema:
            type: string
            example: b96f4c54-6082-4e05-bb58-78846e60b3cd
            description: Secret key to authenticate requests to the Authorizer API
        - name: X-Signature
          in: header
          required: true
          schema:
            type: string
            description: RSA signature created from request body with SHA-256 algo by authorizer private key.
            example: K7fQthVMHUMHHJKBTGeBJyCbqq0RZAjtbJbMgQAEtkCh6pNhWOjQAxPOOUl0eWIddCfaohpvTRblZDEb7...
        - name: X-Timestamp
          in: header
          required: true
          schema:
            type: number
            description: Number of seconds since Unix epoch(Jan 1 1970 UTC) till now
            example: 1697613541
        - name: X-Real-IP
          in: header
          required: false
          schema:
            type: string
            example: 127.0.0.1
        - name: X-Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            description: The idempotency key for safely retrying requests without accidentally performing the same operation twice.
            example: b96f4c54-6082-4e05-bb58-78846e60b3cd
        - name: Content-Type
          in: header
          required: true
          schema:
            type: string
            example: application/json
            description: Content of this parameter must match the type of request's body.
        - name: User-Agent
          in: header
          required: true
          schema:
            type: string
            example: Mozilla/5.0 (X11; Linux x86_64)
      tags:
        - Authorizer API
      summary: Authorize Transfer
      description: Use this method to authorize a transfer processing.
      operationId: AuthorizeTransfer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Id of transfer on a SYSTEM side server. Can be missed if used the order_id
                  example: 351c1bc0-b703-46a0-b618-718fe415c9ec
                  required: true
                order_id:
                  type: string
                  description: 'Order id of transfer on a merchant side server. Can be used instead of id, in that case do not put id in the request body. If you put both IDs, then the id will be used to find the transfer, and the order_id will be used for comparison during the checkout procedure.'
                  example: yk4jp8f8lj4xedgsgmrur
                  required: true
                amount:
                  type: number
                  description: Amount of transfer. If not empty then will be used for comparison during the checkout procedure.
                  example: 100
                  default: null
                currency:
                  type: string
                  description: Currency of transfer. If not empty then will be used for comparison during the checkout procedure. (ISO 4217)
                  example: THB
                  default: THB
                client_amount:
                  type: number
                  description: Amount of transfer. If not empty then will be used for comparison during the checkout procedure.
                  example: 100
                  default: null
                client_currency:
                  type: string
                  description: Currency of transfer. If not empty then will be used for comparison during the checkout procedure. (ISO 4217)
                  example: THB
                  default: THB
                recipient:
                  type: string
                  description: UUIDv4 of recipient who will receive a transfer. If not empty then will be used for comparison during the checkout procedure.
                  example: 341c1bc0-b703-46a0-b618-718fe415c9ec
                  default: null
                  format: uuid
              required:
                - id
                - order_id
        required: true
      responses:
        '202':
          description: Success response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Transfer unique identifier in the UUIDv4 format
                    example: 975f5b61-7c2e-4520-80bb-a882bbb87584
                  object:
                    type: string
                    description: Type of transaction
                    example: transfer
                  live:
                    type: boolean
                    description: True/False
                    example: false
                  order_id:
                    type: string
                    description: Order ID of the transfer on the Merchant's side
                    example: testdocapi
                  recipient:
                    type: string
                    description: Recipient unique identifier in the UUIDv4 format
                    example: 0b76d7a3-0bd9-45d9-8480-3388b9d6e36f
                  status:
                    type: string
                    description: Transfer status
                    enum:
                      - processing
                    example: processing
                  client_amount:
                    type: float
                    description: The amount that was requested for transfer and will be received by the client
                    example: 100
                  client_currency:
                    type: string
                    description: Currency specified by the client when creating the transfer
                    example: THB
                  amount:
                    type: float
                    description: 'Transfer amount, in currency of the SYSTEM'
                    example: 100
                  fee:
                    type: float
                    description: 'Fee amount of transfer, in currency of the SYSTEM'
                    example: 1.5
                  fee_vat:
                    type: float
                    description: '(**Optional**) Vat of fee of transfer, in currency of the SYSTEM'
                    example: 0
                  total_fee:
                    type: float
                    description: 'Total fee amount of transfer, in currency of the SYSTEM'
                    example: 1.5
                  gross:
                    type: float
                    description: 'The total amount of the transfer with the entire commission, in currency of the SYSTEM'
                    example: 101.5
                  currency:
                    type: string
                    description: SYSTEM currency of the transfer
                    example: THB
                  created_at:
                    type: date
                    description: 'DATETIME values in ‘YYYY-MM-DD hh:mm:ss’'
                    example: '2021-03-31 15:13:56'
                  updated_at:
                    type: date
                    description: 'DATETIME values in ‘YYYY-MM-DD hh:mm:ss’'
                    example: '2021-03-31 15:13:56'
                  authorized_at:
                    type: date
                    description: 'DATETIME values in ‘YYYY-MM-DD hh:mm:ss’'
                    example: '2021-03-31T08:14:56.000Z'
                  sent_at:
                    type: date
                    description: 'DATETIME values in ‘YYYY-MM-DD hh:mm:ss’'
                    example: '2021-03-31 15:14:57'
                  paid_at:
                    type: date
