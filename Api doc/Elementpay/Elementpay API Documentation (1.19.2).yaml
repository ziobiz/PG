openapi: 3.0.3
info:
  description: "# Introduction\nThis developer-oriented documentation describes the protocol of communication between a Merchant and Elementpay payment gateway and serves as a guide\nfor arranging acceptance of payments for goods and (or) services.\n\nThis documentation is intended for software developers on the merchant's side.\n\n# Glossary\n| Term | Description |\n|------------------------------|------------------------|\n| SYSTEM                       | Elementpay payment gateway <br/> SYSTEM is a server platform that provides processing and management of: <br/> 1. Payments (pay-ins from the merchant's client to the SYSTEM) <br/> 2. Transfers (withdrawal of funds from the merchant's account in the SYSTEM to the client's personal bank accounts). <br/> 3. Payouts (withdrawal of funds from the merchant's account in the SYSTEM to the merchant’s bank accounts by merchant’s side server requests). |\n| Merchant                     | The company (Merchant/Partner) that uses the SYSTEM to process payments on invoices and withdrawals of funds to specified bank accounts. |\n| Final response status        | The final status means that if you try to send a payment with identical parameters the response status will not change. |\n| Merchant Secret Key\t           | The merchant's secret key is used for signing requests. It is issued by the system’s staff at the time of connection. Please find it in the Client Cabinet -> Settings -> API keys -> Secret Key |\n| Merchant Key\t\t           | The key for the identification of a merchant in the system. It is issued by the system’s staff at the time of connection. Please find it in the Client Cabinet -> Settings -> API keys -> Merchant Key |\n| Type of payment method\t   | Payment methods in the system can be of two types: \"online\" and \"offline\". Please find it in the Client Cabinet -> Services -> Services and fees section -> Online or via List Payment Methods API request. |\n| Online method\t               | Online method means that payment will be made in real time through the internet banking or mobile banking applications. |\n| Offline method\t           | The offline methods include payment via ATM, cashier at a bank or at another payment station. |\n| Success URL                  | Elementpay system redirects the payer to this URL after successful payment. |\n| Reject URL\t               | Elementpay system redirects the payer to this URL after failed payment. |\n| Waiting URL\t               | Elementpay system redirects the payer to this URL, if payment status is not final. |\n| Client                     | The person who uses merchant’s services through a merchant platform. |\n| Transfer                     | The ‘transfer’ means an order of transfer an exact amount to the client’s personal bank account - recipient. Transfers are processed automatically. <br/> Each ‘transfer’ in the system has a unique id in UUIDv4 format. |\n| Payout                       | The ‘payout’ means a request of order to remittance all or part of available funds at the moment of the order, that should be settled to the merchant’s company. Payouts are processed by manual mode through a bank or agent, or any other channel that has been previously agreed with a merchant.<br/> Each ‘payout’ in the system has a unique id in UUIDv4 format. |    | Recipient                    | The ‘recipient’ is an entity that should be made by a merchant server based on the user's bank data for ability to make a transfer to this user's personal bank account. Merchant server should make a 'recipient' entity by each personal bank account of the customer in the SYSTEM and ties 'recipient’s' UUIDv4 with the customer into merchant service themselves. One customer entity in the Merchant platform can be bound to several ‘recipients’ on the SYSTEM side. By simple words an one ‘recipient’ entity it is an one bank customer bank account. Each ‘recipient’ in the system has a unique id number in UUID v4 format.<br/>For example: <br/>If the customer has 3 bank accounts and wants to install it in the merchant’s platform for making transfers – the merchant server side should create 'recipient’s' entities on the SYSTEM side for further use it for transfers. In the merchant platform, each 'recipient' UUIDv4 should be bind by each bank account entity that will be showed to the customer to make a choice. |\n| Recipient                    | The ‘recipient’ is an entity that should be made by a merchant server based on the user's bank data for ability to make a transfer to this user's personal bank account. Merchant server should make a 'recipient' entity by each personal bank account of the customer in the SYSTEM and ties 'recipient’s' UUIDv4 with the customer into merchant service themselves. One customer entity in the Merchant platform can be bound to several ‘recipients’ on the SYSTEM side. By simple words an one ‘recipient’ entity it is an one bank customer bank account. Each ‘recipient’ in the system has a unique id number in UUIDv4 format.<br/>For example: <br/>If the customer has 3 bank accounts and wants to install it in the merchant’s platform for making transfers – the merchant server side should create 'recipient’s' entities on the SYSTEM side for further use it for transfers. In the merchant platform, each 'recipient' UUIDv4 should be bind by each bank account entity that will be showed to the customer to make a choice. |\n| URL route format | All interaction with SYSTEM based on requests from merchant server to SYSTEM server and get responses from SYSTEM server. All interaction is based on the API, and all requests should be sent to the SYSTEM URL server address, which contains the following attributes in address: <br/> 1. Base URL of SYSTEM server<br/>2. API area <br/>/merchant (for Payment API) <br/>/clientAPI (for Clients API, Transfer API) <br/>/authorizer (for Authorizer API)<br/>3. model name that requested<br/>4. parameter of request (if it necessary)<br/>For example:<br/><b>api.elementpay.io/merchant/{model}/{parameter} |\n| Base URL of SYSTEM server\t       | Base path URL host that receives merchant requests to Transfer API, Client API, Payment API, Authorizer API. <br/>Example: api.elementpay.io, api-sbox.elementpay.io |\n| {model}                      | The name of the requested API model. <br/>For example: https://api-sbox.elementpay.io/clientApi/banks/|\n| {parameter}\t               | Parameter that transmit into model. <br/>For example: https://api-sbox.elementpay.io/clientApi/recipient/4e8bfc73-c039-42df-95f32a8071db0c3e |\n| Data Types & NULL\t           | All formats of data types used in JSON objects in the interaction between platforms can contain a defined type of key value in JSON object, but if a value is not defined it will be presented by \"NULL\" in value parameter. All unique id numbers of recipients, payouts, and transfers are presented by UUIDv4. All data types of JSON object parameters are defended in a document. |\n| UUID Type String\t           | In its canonical textual representation, the 16 octets of a UUID are represented as 32 hexadecimal (base-16) digits, displayed in five groups separated by hyphens, in the form 8-4-4-4-12 for a total of 36 characters (32 hexadecimal characters and 4 hyphens). <br/>For example: 123e4567-e89b-12d3-a456-426655440000 |\n\n\n\n# Basic principles of communication\nThis section describes the main principles of interaction between the merchant and the SYSTEM.\n - The communication is provided over HTTP 1.0\n - JSON format is used in response to requests.\n - Request parameters are passed by the POST method.\n\n<b>\n  <p>It is required to check for compliance of the HTTP referrer and the IP address with the received data in the request. The payee must reject all requests from servers with a different IP address and/or incorrect HTTP referrer.</p>  \n  <p>The IP addresses from which the payment system sends requests will be provided by the integration team. Please add them to the IP whitelist on your side.</p>\n</b>\n\n[//]: # \"This is a commented table\"\n[//]: # \"|                   | Sandbox                                  | Production server |\"\n[//]: # \"|-------------------|------------------------------------------|----------------------------------|\"\n[//]: # \"| IP-address\t    | 3.0.36.253           | 3.1.29.20\"\n[//]: # \"| Communication URL | https://api-sbox.elementpay.io/merchant/ | https://api.elementpay.io/merchant/\"\n[//]: # \"| Client area\t    | https://client.elementpay.io/       | https://client.elementpay.io/\"\n\nThe complete payment process is described below in the Sequence Diagram format:\n\n![](img/uml-payee-en.jpg \"Sequence diagram\")\n\n<b>Payment Data Flow Diagram:</b>\n\n![](img/Data-Flow-Diagram.jpg \"Data Flow Diagram\")\n\n### Request format\n\nTo send a request, you should create a list of parameters and send it to the relevant method of the gateway in HTTP 1.0 format.\nExample:\n```\nhttps://api-sbox.elementpay.io/merchant/<method>?param1=value1&param2=value2&paramN=valueN\n```\n\nDescription:\n`<method>` - method in the gateway, `param1` - attribute name, `value1` - attribute value\n\nRequest attributes must be passed by the POST method.\n\n### Response format\nDuring communication with the system the response always comes in JSON format and encoded in UTF-8.\n\nIf the request is successful, you will receive a response, as in the example:\n```json\n{\n\"response\": {\n    \"id\": 56810,\n    \"order\": \"orderid105213\",\n    \"service\": {\n        \"id\": 107,\n        \"alias\": \"interbank\",\n        \"name\": \"QR Code Payments\",\n        \"type\": \"online\"\n    },\n    \"amount\": \"100.00\",\n    \"fee\": \"1.50\",\n    \"currency\": \"THB\",\n    \"date\": \"2022-12-22T09:51:08.000Z\",\n    \"ttl\": 86400,\n    \"status\": 205,\n    \"dateonhold\": null,\n    \"attributes\": [],\n    \"timestamp\": 1697613541\n},\n\"hash\": \"5f9f364a9db99aa42bd817328e6ef913892f950d\"\n}\n```\nIf the request is incorrect, you will receive a response with an error object. For example, for a situation with an incorrect merchant key, you will get a following error object:\n```json\n{\n   \"error\": {\n      \"code\": 402,\n      \"message\": \"Wrong merchant key\",\n      \"timestamp\": 1697613541\n   }\n}\n```\nThe response for the request always includes the hash parameter which must be used for verification.\n\n### Algorithm for calculating of hash (From merchant to Elementpay)\n\n### Request hash calculation\n\nTo receive hash for a request you must calculate hmac using the secret key from the list of parameters with the values encoded according to RFC 3986 (spaces should be %20) in the following format:\n\n```\n<method>?param1=value1&param2=value2&paramN=valueN\n```\n\nExample, request getMethods:\n\n```\nhttps://api-sbox.elementpay.io/merchant/getMethods?key=d7197e2e-6d89-11e4-8e91-d876c67f2a53&timestamp=1697613541171&hash=22cc3b22595f98dcc36309aeef691cce0c937bd5\n```\n\nIn this case, the signature is calculated from a line:\n\n```\ngetMethods?key=d7197e2e-6d89-11e4-8e91d876c67f2a53&timestamp=1697613541171\n```\n\nCalculation of hash:\n\n```\nhmac(\"80eb8c9793949bc6682baffdb4dd5303542581ed\", \"getMethods?key=d7197e2e-6d89-11e4-8e91d876c67f2a53&timestamp=1697613541171\")\n```\n\nwhere ```80eb8c9793949bc6682baffdb4dd5303542581ed``` - webhook signing secret key\n\nHash is ```22cc3b22595f98dcc36309aeef691cce0c937bd5```\n\n### Response hash calculation\n\nExample:\n```json\n{\n \"response\": {\n    \"id\": 56810,\n    \"order\": \"orderid105213\",\n    \"service\": {\n        \"id\": 107,\n        \"alias\": \"interbank\",\n        \"name\": \"QR Code Payments\",\n        \"type\": \"online\"\n    },\n    \"amount\": \"100.00\",\n    \"fee\": \"1.50\",\n    \"currency\": \"THB\",\n    \"date\": \"2022-12-22T09:51:08.000Z\",\n    \"ttl\": 86400,\n    \"status\": 203,\n    \"timestamp\": 1697613541\n  },\n \"hash\": \"5f9f364a9db99aa42bd817328e6ef913892f950d\"\n}\n```\n\nCalculation of hash\n```\nhmac('80eb8c9793949bc6682baffdb4dd5303542581ed', '{\"id\":56810,\"order\":\"orderid105213\",\"service\":{\"id\":107,\"alias\":\"interbank\",\"name\":\"QR Code Payments\",\"type\":\"online\"},\"amount\":\"100.00\",\"fee\":\"1.50\",\"currency\":\"THB\",\"date\":\"2022-12-22T09:51:08.000Z\",\"ttl\":86400,\"status\":203,\"timestamp\":1697613541}')\n```\nwhere ```80eb8c9793949bc6682baffdb4dd5303542581ed``` - webhook signing secret key\n\nHash is ```594e08602750b499ad5c48a9b7f537156f7dca25```\n\n### Algorithm for calculating of hash (From Elementpay to merchant, callbacks)\n\n<b>NOTE! For the hash calculation please use a Signing Secret Key. Please find it in the Client Cabinet -> Settings -> Webhooks -> Your endpoint details</b>\n\n### Request hash calculation\n\nTo receive hash for a request you must calculate hmac using the secret key from the list of parameters with the values encoded according to RFC 3986 (spaces should be %20) in the following format:\n\n```\n<method>?param1=value1&param2=value2&paramN=valueN\n```\n\nExample, request getMethods:\n\n```\nhttp(s)://{merchant_endpoint_url}/?method=check&id=10932&service_id=86&amount=100.00&order=uouiuooi&timestamp=1697613541&data=customdata&hash=637aa3855c98b8220d3c2494b2e06dbb5fa66880\n```\n\nIn this case, the signature is calculated from a line:\n\n```\nmethod=check&id=10932&service_id=86&amount=100.00&order=uouiuooi&timestamp=1697613541&data=customdata\n```\n\nCalculation of hash:\n\n```\nhmac(\"80eb8c9793949bc6682baffdb4dd5303542581ed\", \"method=check&id=10932&service_id=86&amount=100.00&order=uouiuooi&timestamp=1697613541&data=customdata\")\n```\n\nwhere ```80eb8c9793949bc6682baffdb4dd5303542581ed``` - webhook signing secret key\n\nHash is ```637aa3855c98b8220d3c2494b2e06dbb5fa66880```\n\n### Response hash calculation\n\nExample:\n```json\n{\n  \"response\": {\n    \"status\": 270,\n    \"message\": \"Payment can process\",\n    \"timestamp\": 1697613541523\n  },\n  \"hash\": \"d3cc51fe8a0eaf8b2329669c1e19161977082199\"\n}\n```\n\nCalculation of hash\n```\nhmac('80eb8c9793949bc6682baffdb4dd5303542581ed', '{\"status\":270,\"message\":\"Payment can process\",\"timestamp\":1697613541523}')\n```\nwhere ```80eb8c9793949bc6682baffdb4dd5303542581ed``` - webhook signing secret key\n\nHash is ```d3cc51fe8a0eaf8b2329669c1e19161977082199```\n\n# Light API\nLight API is a powerful widget and standalone page that helps you integrate payment methods in a few clicks.\n\n<b>NOTE! To use the Light API you must first login into your client cabinet -> Settings -> API keys section and generate a secret key.</b>\n\n[***Click to try LightAPI***](https://api-sbox.elementpay.io/merchant/light/#!/?amount=100.00&key=ebf46170-6d89-11e4-8e91-d876c67f2a53&env=sandbox)\n\n<b>How to use</b>\n\nPlease find the Merchant Key used for the request in your client cabinet -> Settings -> API Keys -> Merchant Key\n\n![](img/lightApi/cabinetKeySection.jpg)\n\nFor use Light API you need to redirect customer to special url which you prepare. For example:\n\nFor sandbox:\n```\nhttps://api-sbox.elementpay.io/merchant/light/#!/?amount=100.00&key=d7187e2e-6b89-15e4-8e91-d816c67f2a53&env=sandbox\n```\nor:\n```\nhttps://api.elementpay.io/merchant/light/#!/?amount=100.00&key=d7187e2e-6b89-15e4-8e91-d816c67f2a53&env=sandbox\n```\nFor production:\n```\nhttps://api.elementpay.io/merchant/light/#!/?amount=100.00&key=d7187e2e-6b89-15e4-8e91-d816c67f2a53&env=live\n```\nAll available parameters see below.\n\nAlso, you may use this link in iframe, live\n\n```\n<iframe class=\"col-md-12\" frameborder=\"0\" allowtransparency=\"true\" src=\"https://api.elementpay.io/merchant/light/#!/?amount=100.00&key=d7187e2e-6b89-15e4-8e91-d816c67f2a53&env=sandbox\" width=\"350\" height=\"600\"></iframe>\n```\n\n![](img/lightApi/selectCategory.jpg)\n\n<b>Using link to specific page</b>\n\nLight API redirect url allow to use link to specific page, like\n\nStatus page\n\nlink\n```\nhttps://api-sbox.elementpay.io/merchant/light/#/status?order=fa014247de0472f1fb07051ae3a8a87a9ce03e7d&key=ebf46170-6d89-11e4-8e91-d876c67f2a53&env=sandbox\n```\nor iframe style\n\n```\n<iframe class=\"col-md-12\" frameborder=\"0\" allowtransparency=\"true\" src=\"https://api-sbox.elementpay.io/merchant/light/#/status?order=fa014247de0472f1fb07051ae3a8a87a9ce03e7d&key=ebf46170-6d89-11e4-8e91-d876c67f2a53&env=sandbox\" width=\"350\" height=\"600\"></iframe>\n```\n\n![](img/lightApi/category.jpg)\n\nSpecific payment method (Card payment example)\n\nlink\n```\nhttps://api-sbox.elementpay.io/merchant/light/#/services/card?amount=100.00&key=ebf46170-6d89-11e4-8e91-d876c67f2a53&env=sandbox\n```\nor iframe style\n\n```\n<iframe class=\"col-md-12\" frameborder=\"0\" allowtransparency=\"true\" src=\"https://api-sbox.elementpay.io/merchant/light/#/services/card?amount=100.00&key=ebf46170-6d89-11e4-8e91-d876c67f2a53&env=sandbox\" width=\"350\" height=\"600\"></iframe>\n```\n\n![](img/lightApi/method.jpg)\n\n### jElementpay (jQuery plugin)\njElementpay is a jQuery plugin for can help you easy integrate Light API to your website.\n\n<b>How to use</b>\n\nFirst, connect jQuery (if needed):\n```\n<script src=\"//code.jquery.com/jquery-1.11.3.min.js\"></script>\n```\nSecond, connect Elementpay jQuery plugin\n```\n<script src=\"https://api.elementpay.io/merchant/light/jquery.elementpay.js\"></script>\n```\nand add special parameters to the payment button:\n```\n<button data-elementpay-amount=\"100.00\">Buy now!</button>\n```\nAfter that, initialize Elementpay plugin:\n```\n$(document).ready(function(){\n  $().elementpay({\n    'key': '72A1FB12-B806-42C9-87DD-42A2BB13E98F',\n    'env': 'sandbox',\n    'element': '[data-elementpay-amount]'\n  });\n});\n```\nYou can use more initialize parameters. For more details read it below.\n\n<b>How to use custom order number</b>\n\nYou can use custom order number for identify payments on callbacks methods. For use custom order number you should add special data-attribute in the payment button `data-elementpay-order`\n\nFor example:\n```\n<button data-elementpay-amount=\"100.00\" data-elementpay-order=\"My special order\">Buy now!</button>\n```\nOn callbacks methods you can catch this attribute by \"data\":\n```\ncurl -i -X POST http(s)://{merchant_endpoint_url} \\\n  -d \"method=check\" \\\n  -d \"id=502\" \\\n  -d \"service_id=107\" \\\n  -d \"amount=100.00\" \\\n  -d \"order=r126\" \\\n  -d \"timestamp=1697613541\" \\\n  -d \"data=%7B%20%22merchantOrder%22%3A%20%22r126%22%7D\" \\\n  -d \"hash=16615f7112325d80e2641120c2640783a5f77206\"\n```\nHere is `data` contains url-encoded JSON string with node `merchantOrder`:\n```\n{\"merchantOrder\":\"r126\"}\n```\n\n### Available parameters\n\n|Parameter          | required             | jQuery plugin     | RedirectUrl       |         Type       | Description                                                                                   |\n|-------------------|----------------------|-------------------|-------------------|--------------------|-----------------------------------------------------------------------------------------------|\n|amount             |         •            |         •         |         •         |    Float value     |Payment amount                                                                                 |\n|key                |         •            |         •         |         •         |       UUIDv4       |Merchant key                                                                                   |\n|order              |                      |         •         |         •         |     Alphanumeric   |Merchant's order (if not set, will be use autogeneration value)                                |\n|language           |                      |         •         |         •         |       2 chars      |Form language (default use customer's browser language)                                        |\n|statusPage         |                      |         •         |         •         |        boolean     |Use LightAPI status page or redirect to customer's page                                        |\n|env                |         •            |         •         |         •         |   sandbox / live   |Which endpoint use - test or production                                                        |\n|element            |                      |         •         |                   |  css-style element |Element that will be use for listening click event                                             |\n|forceRedirect      |                      |         •         |                   |       boolean      |Forcing redirect only waiting url and only if the payment has the status of waiting            |\n"
  version: 1.19.2
  title: Elementpay API Documentation
servers:
  - url: 'https://api-sbox.elementpay.io'
    description: Sandbox server
  - url: 'https://api.elementpay.io'
    description: Production server
tags:
  - name: Callback API
    description: "Allows the merchant endpoint to respond in accordance with the protocol to SYSTEM requests to verify payment / transfer data before processing and when notifying the results of the transaction.\n\n## Payment Check\nThe system sends a request to the merchant endpoint to verify payment data. Payment Check requests are sent to the merchant at the moment before the transaction processing begins, in order to make sure that the merchant still want to proccess this transaction.\n\nSome examples when a merchant may refuse at the payment data verification stage:\n- the product is out of stock or no longer relevant\n- booking cancelled\n\n<span type=\"post\" class=\"sc-jHcXXw ewkxcg http-verb post\">POST</span>\n```\nhttp(s)://{merchant_endpoint_url}\n```\n\n**Usage example:**\n```\ncurl -i -X POST http(s)://{merchant_endpoint_url} \\\n  -d \"method=check\" \\\n  -d \"id=53\" \\\n  -d \"order=order20221221\" \\\n  -d \"service_id=5\" \\\n  -d \"amount=20.00\" \\\n  -d \"currency=USD\" \\\n  -d \"method_amount=646.56\" \\\n  -d \"method_currency=THB\" \\\n  -d \"data=additionalRef%3Dr126\" \\\n  -d \"payer_name=TXIuIFRzZCoqKnNhdCDguJkq4LiHIHNhZCoqKirjv7/sgIDjnbY=\" \\\n  -d \"timestamp=1697613541\" \\\n  -d \"hash=58f9e290c953e31ea90c89706839dc50b9a420f1\"\n```\n\n**Parameters:**\n\n| Name        | Type     | Description                      |\n|-------------|----------|----------------------------------|\n| method\t    | String   | Specifies the name of the callback method. <br/> Allowed values: `check`\n| id\t        | Number   | Payment ID in the system\n| order\t    | String   | Payment ID in the merchant’s system\n| service_id\t| Number   | Payment method ID\n| amount\t    | Number   | Payment amount in the currency of invoice\n| currency    (**optional**)| String   | Payment currency of invoice. Will be provided if the invoice currency differs from the currency of method\n| method_amount    (**optional**)| Number   | Amount in currency of payment method. Will be provided if the invoice currency differs from the currency of method\n| method_currency    (**optional**)| String   | Currency of payment method, e.g. \"THB\". Will be provided if the invoice currency differs from the currency of method\n| data\t  (**optional**)  | String   | Merchant's additional data attribute. If you are using LightApi, this parameter will have an object with your custom order in the \"merchantOrder\" node. For example: {\"merchantOrder\":\"r126\"}\n| payer_name    (**optional**)| String   | The partially masked payer name (if provided by the bank) encoded to a base64 format.\n| timestamp\t| Number   | Unix timestamp at the time of the request (in seconds)\n| hash\t    | String   | Request hash\n\n**Request example:**\n```\nmethod=check&id=53&order=order20221221&service_id=5&amount=20.00&currency=USD&method_amount=646.56&method_currency=THB&data=additionalRef%3Dr126&payer_name=TXIuIFRzZCoqKnNhdCDguJkq4LiHIHNhZCoqKirjv7/sgIDjnbY=&timestamp=1671601785&hash=58f9e290c953e31ea90c89706839dc50b9a420f1\n```\n\n**Response to callback:**\n\nThe SYSTEM expects you to respond to the callback with the following structure:\n\n| Name                    | Type     | Description                      |\n|-------------------------|----------|----------------------------------|\n| response                | Object   | Response to callback\n| &nbsp;&nbsp;status\t    | Number   | Verification status\n| &nbsp;&nbsp;message\t (**optional**)   | String   | Human readable description of the status\n| &nbsp;&nbsp;timestamp\t| Number   | Unix timestamp at the time of the response (in seconds)\n| hash\t                | String   | Response hash\n\n**Response status:**\n\n| Name | Type     | Description                      |\n|------|----------|----------------------------------|\n| 270  | Response | Payment with the specified parameters can be processed\n| 475\t | Response | Payment with the specified parameters can not be processed\n| 401\t | Error    | Invalid hash\n| 500\t | Error    | Internal Server Error\n\n**Response example:**\n```json\n HTTP/1.1 200 OK\n {\n    \"response\": {\n      \"status\": 270,\n      \"message\": \"Account exist\",\n      \"timestamp\": 1697613541171\n    },\n  \"hash\": \"d92bbcfee3be0cdad9e2b4cfe3cdf045fcc714fa\"\n }\n ```\n\n## Payment Pay\nAfter the payment is paid by the payer (user), the system sends a request to the merchant's endpoint to notify about it.\n\n**Important notice:**\n\nIf the \"Payment Pay\" request was sent for invoice that is marked as paid on the merchant side, the merchant does not need to respond with an error, they need to respond with success (status 205). <br>\nCase: when the System sends a Pay callback to the merchant -> the merchant does not respond for a long time -> the System receives a timeout -> the merchant on its end marks the payment as \"success\". <br>\nIn this case, there will be further attempts to notify the merchant by the Pay callback where the System will expect the respond with success (status 205) from the merchant side.\n\n<span type=\"post\" class=\"sc-jHcXXw ewkxcg http-verb post\">POST</span>\n```\nhttp(s)://{merchant_endpoint_url}\n```\n\n**Usage example:**\n```\ncurl -i -X POST http(s)://{merchant_endpoint_url} \\\n  -d \"method=pay\" \\\n  -d \"id=53\" \\\n  -d \"order=order20221221\" \\\n  -d \"service_id=5\" \\\n  -d \"amount=20.00\" \\\n  -d \"currency=USD\" \\\n  -d \"method_amount=646.56\" \\\n  -d \"method_currency=THB\" \\\n  -d \"data=additionalRef%3Dr126\" \\\n  -d \"payer_name=TXIuIFRzZCoqKnNhdCDguJkq4LiHIHNhZCoqKirjv7/sgIDjnbY=\" \\\n  -d \"timestamp=1697613541\" \\\n  -d \"hash=58f9e290c953e31ea90c89706839dc50b9a420f1\"\n```\n\n**Parameters:**\n\n| Name        | Type     | Description                      |\n|-------------|----------|----------------------------------|\n| method\t    | String   | Specifies the name of the callback method. <br/> Allowed values: `pay`\n| id\t        | Number   | Payment ID in the system\n| order\t    | String   | Payment ID in the merchant’s system\n| service_id\t| Number   | Payment method ID\n| amount\t    | Number   | Payment amount in the currency of invoice\n| currency    (**optional**)| String   | Payment currency of invoice. Will be provided if the invoice currency differs from the currency of method\n| method_amount    (**optional**)| Number   | Amount in currency of payment method. Will be provided if the invoice currency differs from the currency of method\n| method_currency    (**optional**)| String   | Currency of payment method, e.g. \"THB\". Will be provided if the invoice currency differs from the currency of method\n| data\t  (**optional**)  | String   | Merchant's additional data attribute. If you are using LightApi, this parameter will have an object with your custom order in the \"merchantOrder\" node. For example: {\"merchantOrder\":\"r126\"}\n| payer_name    (**optional**)| String   | The partially masked payer name (if provided by the bank) encoded to a base64 format.\n| timestamp\t| Number   | Unix timestamp at the time of the request (in seconds)\n| hash\t    | String   | Request hash\n\n**Request example:**\n```\nmethod=pay&id=53&order=order20221221&service_id=5&amount=20.00&currency=USD&method_amount=646.56&method_currency=THB&data=additionalRef%3Dr126&payer_name=TXIuIFRzZCoqKnNhdCDguJkq4LiHIHNhZCoqKirjv7/sgIDjnbY=&timestamp=1697613541&hash=fc36c2e6c67031a97d12b86acd7f1859527e0924\n```\n\n**Response to callback:**\n\nThe SYSTEM expects you to respond to the callback with the following structure:\n\n| Name                    | Type     | Description                      |\n|-------------------------|----------|----------------------------------|\n| response                | Object   | Response to callback\n| &nbsp;&nbsp;status\t    | Number   | Verification status\n| &nbsp;&nbsp;message\t    | String   | Human readable description of the status\n| &nbsp;&nbsp;timestamp\t| Number   | Unix timestamp at the time of the response (in seconds)\n| hash\t                | String   | Response hash\n\n**Response status:**\n\n| Name | Type     | Description                      |\n|------|----------|----------------------------------|\n| 204  | Response | Payment has been rejected by merchant\n| 205  | Response | Payment success. Should be sent on every request where the payment is in a success status.\n| 206  | Response | The payment is being processed. The Merchant is unable to finalize the order. The payment system will send a “Pay” notification again after a while.\n| 474\t | Response | Payment with the specified parameters is not found in the merchant's system\n| 401\t | Error    | Invalid hash\n| 500\t | Error    | Internal Server Error\n\n**Response example:**\n```json\n HTTP/1.1 200 OK\n {\n    \"response\": {\n      \"status\": 205,\n      \"message\": \"Payment success\",\n      \"timestamp\": 1697613541171\n    },\n  \"hash\": \"73f36eae3751a97522ac8639f813c37b0785dc3c\"\n }\n ```\n\n## Payout Notifications\nNotification request it is a request of any event-related to transfer that the merchant has set for notification. Notification callbacks can be established for next types of events:\n\n| Event              | Description                      |\n|--------------------|----------------------------------|\n| `payout.paid`      | Payout was successfully paid to the merchant\n| `payout.canceled` | Payout request was cancelled by the merchant\n\n> It is also possible to split events between different endpoints with their own security keys.\n\nIf the endpoint responds with HTTP status other than 200, then after a certain time interval the system will repeat the request. There will be 10 attempts in total, after which the system will stop trying to notify on this event.\n\n\n<span type=\"post\" class=\"sc-jHcXXw ewkxcg http-verb post\">POST</span>\n```\nhttp(s)://{merchant_endpoint_url}\n```\n\n**Usage example:**\n```\ncurl -i -X POST http(s)://{merchant_endpoint_url} \\\n  -d \"method=payout.paid\" \\\n  -d \"id=a7f1e342-b055-4712-8b18-23dd4a13fb0b\" \\\n  -d \"client_amount=100.00\" \\\n  -d \"client_currency=THB\" \\\n  -d \"amount=100.00\" \\\n  -d \"currency=THB\" \\\n  -d \"fee=1.50\" \\\n  -d \"created_at=2022-06-01%2014%3A20%3A11\" \\\n  -d \"paid_at=2022-06-01%2014%3A25%3A40\" \\\n  -d \"canceled_at=null\" \\\n  -d \"status=paid\" \\\n  -d \"status_message=null\" \\\n  -d \"timestamp=1697613541\" \\\n  -d \"hash=16615f7112325d80e2641120c2640783a5f77206\"\n```\n\n**Parameters:**\n\n| Name            | Type     | Description                      |\n|-----------------|----------|----------------------------------|\n| method\t        | String   | Specifies the name of event.<br/> Allowed values: `\"payout.paid\"`, `\"payout.canceled\"`\n| id\t            | String   | UUIDv4 of payout\n| client_amount\t  | Number   | Amount of payout in currency of merchant\n| client_currency\t| String   | Currency of merchant\n| amount\t        | Number   | Amount of payout in currency of payment system\n| currency\t      | String   | Currency of payment system\n| fee\t            | Number   | Amount of fee in currency of payment system\n| created_at\t    | String   | Date and time of the payout order\n| paid_at\t        | String   | Date and time of the transfer\n| canceled_at\t    | String   | Date and time of the cancelling payout order\n| status\t        | String   | Current state of payout.\n| status_message\t| String   | Payout status description\n| timestamp\t      | Number   | Unix timestamp when this request sending (in seconds)\n| hash\t          | String   | Request hash\n\n**Request example:**\n```\nmethod=payout.paid&id=a7f1e342-b055-4712-8b18-23dd4a13fb0b&client_amount=100.00&client_currency=THB&amount=100.00&currency=THB&fee=1.50&created_at=2022-06-01%2014%3A20%3A11&paid_at=2022-06-01%2014%3A25%3A40&canceled_at=null&status=paid&status_message=null&timestamp=1697613541&hash=16615f7112325d80e2641120c2640783a5f77206\n```\n\n**Response to callback:**\n\nThe SYSTEM expects you to respond to the callback with the following structure:\n\n| Name                    | Type     | Description                      |\n|-------------------------|----------|----------------------------------|\n| response                | Object   | Response to callback\n| &nbsp;&nbsp;status\t    | Number   | Verification status\n| &nbsp;&nbsp;message\t    | String   | Human readable description of the status\n| &nbsp;&nbsp;timestamp\t| Number   | Unix timestamp at the time of the response (in seconds)\n| hash\t                | String   | Response hash\n\n**Response status:**\n\n| Name | Type     | Description                      |\n|------|----------|----------------------------------|\n| 270  | Response | Notification received\n| 474\t | Response | Payout Not Found on the merchant side\n| 401\t | Error    | Invalid hash\n| 500\t | Error    | Internal Server Error\n\n**Response example:**\n```json\n HTTP/1.1 200 OK\n {\n    \"response\": {\n      \"status\": 270,\n      \"message\": \"Ok\",\n      \"timestamp\": 1697613541171\n    },\n  \"hash\": \"73f36eae3751a97522ac8639f813c37b0785dc3c\"\n }\n ```\n**Failed to process notification example:**\n```json\n HTTP/1.1 200 OK\n {\n    \"response\": {\n      \"status\": 401,\n      \"message\": \"Invalid hash\",\n      \"timestamp\": 1697613541171\n    },\n  \"hash\": \"73f36eae3751a97522ac8639f813c37b0785dc3c\"\n }\n ```\n\n## Payment Notifications\nA notification request is a request for any payment related event that the merchant has set for notification. Callback notifications for payment can be set for the following types of events:\n\n| Event                 | Description                      |\n|-----------------------|----------------------------------|\n| `payment.reversed`    | The bank canceled the previously successfully paid payment. The funds was returned to the payer\n| `payment.refunded`    | The funds for the payment were fully paid to the payer according the refund ordered by the merchant\n| `payment.rejected`    | The SYSTEM rejected the payment. E.g. payment ttl expiration\n| `payment.wrong_payer` | An attempt was made to pay by a third party, the payer data provided by the merchant does not match the available data of the payment system\n| `refund.paid`         | Refund request successfully paid\n| `refund.created`      | Refund request successfully created\n| `refund.canceled`     | Refund request canceled\n\n> It is also possible to split events between different endpoints with their own security keys.\n\nIf the endpoint responds with HTTP status other than 200, then after a certain time interval the system will repeat the request. There will be 10 attempts in total, after which the system will stop trying to notify on this event.\n\n\n<span type=\"post\" class=\"sc-jHcXXw ewkxcg http-verb post\">POST</span>\n```\nhttp(s)://{merchant_endpoint_url}\n```\n\n**Usage example:**\n```\ncurl -i -X POST http(s)://{merchant_endpoint_url} \\\n  -d \"method=payment.rejected\" \\\n  -d \"id=53\" \\\n  -d \"order=order20221221\" \\\n  -d \"service_id=5\" \\\n  -d \"amount=20.00\" \\\n  -d \"currency=USD\" \\\n  -d \"method_amount=646.56\" \\\n  -d \"method_currency=THB\" \\\n  -d \"data=additionalRef%3Dr126\" \\\n  -d \"timestamp=1697613541\" \\\n  -d \"hash=fc36c2e6c67031a97d12b86acd7f1859527e0924\"\n```\n\n**Parameters:**\n\n| Name                          | Type     | Description                      |\n|-------------------------------|----------|----------------------------------|\n| method                        | String   | Specifies the name of event.<br/> Allowed values: `\"payment.reversed\"`, `\"payment.rejected\"`, `\"payment.wrong_payer\"`, `\"refund.paid\"`, `\"refund.created\"`, `\"refund.canceled\"`\n| id                            | Number   | Payment ID in the system\n| order                         | String   | Payment ID in the merchant’s system\n| service_id                    | Number   | Payment method ID\n| amount                        | Number   | Payment amount in the currency of invoice\n| currency (**optional**)       | String   | Payment currency of invoice. Will be provided if the invoice currency differs from the currency of method\n| method_amount (**optional**)  | Number   | Amount in currency of payment method. Will be provided if the invoice currency differs from the currency of method\n| method_currency (**optional**)| String   | Currency of payment method, e.g. \"THB\". Will be provided if the invoice currency differs from the currency of method\n| data (**optional**)           | String   | Merchant's additional data attribute. If you are using LightApi, this parameter will have an object with your custom order in the \"merchantOrder\" node. For example: {\"merchantOrder\":\"r126\"}\n| timestamp                     | Number   | Unix timestamp at the time of the request (in seconds)\n| status_message (**optional**) | String   | The reason why the current payment status was set (only for `payment.wrong_payer`)\n| hash                          | String   | Request hash\n\n**Request example:**\n```\nmethod=payment.rejected&id=53&order=order20221221&service_id=5&amount=20.00&currency=USD&method_amount=646.56&method_currency=THB&data=additionalRef%3Dr126&timestamp=1697613541&hash=fc36c2e6c67031a97d12b86acd7f1859527e0924\n```\n\n**Response to callback:**\n\nThe SYSTEM expects you to respond to the callback with the following structure:\n\n| Name                    | Type     | Description                      |\n|-------------------------|----------|----------------------------------|\n| response                | Object   | Response to callback\n| &nbsp;&nbsp;status\t    | Number   | Verification status\n| &nbsp;&nbsp;message\t    | String   | Human readable description of the status\n| &nbsp;&nbsp;timestamp\t| Number   | Unix timestamp at the time of the response (in seconds)\n| hash\t                | String   | Response hash\n\n**Response status:**\n\n| Name | Type     | Description                      |\n|------|----------|----------------------------------|\n| 270  | Response | Notification received\n| 474\t | Response | Payment Not Found on the merchant side\n| 401\t | Error    | Invalid hash\n| 500\t | Error    | Internal Server Error\n\n**Response example:**\n```json\n HTTP/1.1 200 OK\n {\n    \"response\": {\n      \"status\": 270,\n      \"message\": \"Ok\",\n      \"timestamp\": 1697613541171\n    },\n  \"hash\": \"73f36eae3751a97522ac8639f813c37b0785dc3c\"\n }\n ```\n**Failed to process notification example:**\n```json\n HTTP/1.1 200 OK\n {\n    \"response\": {\n      \"status\": 401,\n      \"message\": \"Invalid hash\",\n      \"timestamp\": 1697613541171\n    },\n  \"hash\": \"73f36eae3751a97522ac8639f813c37b0785dc3c\"\n }\n ```\n\n## Transfer Notifications\nA notification request is a request for any transfer related event that the merchant has set for notification. Callback notifications for transfer can be set for the following types of events:\n\n| Event              | Description                      |\n|--------------------|----------------------------------|\n| `transfer.paid`    | Transfer has been successfully executed\n| `transfer.failed`  | Failed to execute transfer on the Bank side\n| `transfer.rejected`| System or Merchant rejected the transfer execution\n| `transfer.reversed`| Executed transfer has been cancelled and reversed. Funds has been returned to the merchant's account\n| `transfer.seized`  | Transfer has been seized on the Bank side\n\n> It is also possible to split events between different endpoints with their own security keys.\n\nIf the endpoint responds with HTTP status other than 200, then after a certain time interval the system will repeat the request. There will be 10 attempts in total, after which the system will stop trying to notify on this event.\n\n\n<span type=\"post\" class=\"sc-jHcXXw ewkxcg http-verb post\">POST</span>\n```\nhttp(s)://{merchant_endpoint_url}\n```\n\n**Usage example:**\n```\ncurl -i -X POST http(s)://{merchant_endpoint_url} \\\n  -d \"method=transfer.paid\" \\\n  -d \"id=975f5b61-7c2e-4520-80bb-a882bbb87584\" \\\n  -d \"order_id=TestOrderId\" \\\n  -d \"recipient=4d99623e-dd53-11eb-ba80-0242ac130004\" \\\n  -d \"status=paid\" \\\n  -d \"client_amount=100.00\" \\\n  -d \"client_currency=THB\" \\\n  -d \"amount=100.00\" \\\n  -d \"total_fee=1.50\" \\\n  -d \"gross=101.50\" \\\n  -d \"currency=THB\" \\\n  -d \"failure_code=\" \\\n  -d \"failure_message=\" \\\n  -d \"timestamp=1697613541\" \\\n  -d \"hash=44afe3c7e5083405627ce19a6121e984514088bd\"\n```\n\n**Parameters:**\n\n| Name            | Type     | Description                      |\n|-----------------|----------|----------------------------------|\n| method\t        | String   | Name of the event method.<br/> Allowed values: `\"transfer.paid\"`, `\"transfer.failed\"`, `\"transfer.rejected\"`, `\"transfer.reversed\"`, `\"transfer.seized\"`\n| id\t            | String   | UUIDv4 of a transfer (SYSTEM side id of a transfer)\n| order_id\t    | String   | Order Id of a transfer (Merchant side id of a transfer)\n| recipient       | String   | UUIDv4 of recipient (SYSTEM side id of recipient)\n| status\t        | String   | Transfer status\n| client_amount\t| Float    | Transfer amount in a currency of the Merchant\n| client_currency\t| String   | Currency of the Merchant\n| amount\t        | Float    | Transfer amount in a SYSTEM currency to be sent to the recipient. Without fee\n| total_fee\t            | Float    | Transaction fee\n| gross | Float | Transfer amount to be sent to the recipient + transaction fee in a SYSTEM currency\n| currency\t| String   | Currency of the SYSTEM\n| failure_code\t| String   | Code of transfer failure reason (applicable only for transfer.failed and transfer.rejected notification)\n| failure_message\t| String   | Description of transfer failure reason (applicable only for transfer.failed and transfer.rejected notification)\n| timestamp\t    | Number   | Unix timestamp at the time of the request (in seconds)\n| hash\t        | String   | Request hash\n\n**Failure codes description:**\n\n| Code            | Description                                                             |\n|-----------------|-------------------------------------------------------------------------|\n| holder_mismatch | Recipient full name does not match the actual bank account holder name. |\n| blacklist       | Prohibited due to blacklist status.                                    |\n| bank_policy     | Prohibited due to bank policy.                                          |\n\n**Request example:**\n```\nmethod=transfer.paid&id=913f58c6-1d12-4b7e-8055-63eceb16089c&order_id=yk4jp8f8lj4xedgsgmrur&recipient=ac389ee8-024c-4195-acd9-058044cab8ca&status=paid&client_amount=100.00&client_currency=THB&amount=100.00&total_fee=1.50&gross=101.50&currency=THB&failure_code=&failure_message=&timestamp=1697613541&hash=16615f7112325d80e2641120c2640783a5f77206\n```\n\n**Response to callback:**\n\nThe SYSTEM expects you to respond to the callback with the following structure:\n\n| Name                    | Type     | Description                      |\n|-------------------------|----------|----------------------------------|\n| response                | Object   | Response to callback\n| &nbsp;&nbsp;status\t    | Number   | Verification status\n| &nbsp;&nbsp;message\t    | String   | Human readable description of the status\n| &nbsp;&nbsp;timestamp\t| Number   | Unix timestamp at the time of the response (in seconds)\n| hash\t                | String   | Response hash\n\n**Response status:**\n\n| Name | Type     | Description                      |\n|------|----------|----------------------------------|\n| 270  | Response | Notification received\n| 474\t | Response | Transfer Not Found on the merchant side\n| 401\t | Error    | Invalid hash\n| 500\t | Error    | Internal Server Error\n\n**Response example:**\n```json\n HTTP/1.1 200 OK\n {\n    \"response\": {\n      \"status\": 270,\n      \"message\": \"Ok\",\n      \"timestamp\": 1697613541171\n    },\n  \"hash\": \"44afe3c7e5083405627ce19a6121e984514088bd\"\n }\n ```\n**Failed to process notification example:**\n```json\n HTTP/1.1 200 OK\n {\n    \"response\": {\n      \"status\": 401,\n      \"message\": \"Invalid hash\",\n      \"timestamp\": 1697613541171\n    },\n  \"hash\": \"73f36eae3751a97522ac8639f813c37b0785dc3c\"\n }\n ```\n\n\n\n## Transfer Verification\nVerification request for transfers is optional feature.\n\nSystem will send the verification request to the merchant endpoint in a moment when System is ready to execute the authorized transfer.\n\nVerification webhook can be used to check the transfer's data before transfer will be executed.\n\nThis can be useful for increasing security if the Maker Server or Authorizer Server has been compromised or hacked.\n\nIf you want to enable this feature for your endpoint then:\n1. login to the Merchant's Cabinet;\n2. open Settings > Webhooks;\n3. choose endpoint or create a new one;\n4. turn on the Transfers Verifier switcher.\n\n<span type=\"post\" class=\"sc-jHcXXw ewkxcg http-verb post\">POST</span>\n```\nhttp(s)://{merchant_endpoint_url}\n```\n\n**Usage example:**\n```\ncurl -i -X POST http(s)://{merchant_endpoint_url} \\\n  -d \"method=transfer.verify\" \\\n  -d \"id=975f5b61-7c2e-4520-80bb-a882bbb87584\" \\\n  -d \"order_id=TestOrderId\" \\\n  -d \"recipient=4d99623e-dd53-11eb-ba80-0242ac130004\" \\\n  -d \"status=processing\" \\\n  -d \"client_amount=100.00\" \\\n  -d \"client_currency=THB\" \\\n  -d \"amount=100.00\" \\\n  -d \"total_fee=1.50\" \\\n  -d \"gross=101.50\" \\\n  -d \"currency=THB\" \\\n  -d \"failure_code=\" \\\n  -d \"failure_message=\" \\\n  -d \"timestamp=1697613541\" \\\n  -d \"hash=44afe3c7e5083405627ce19a6121e984514088bd\"\n```\n\n**Parameters:**\n\n| Name            | Type     | Description                      |\n|-----------------|----------|----------------------------------|\n| method\t        | String   | Name of the event method.\n| id\t            | String   | UUIDv4 of a transfer (SYSTEM side id of a transfer)\n| order_id\t    | String   | Order Id of a transfer (Merchant side id of a transfer)\n| recipient       | String   | UUIDv4 of recipient (SYSTEM side id of recipient)\n| status\t        | String   | Transfer status\n| client_amount\t| Float    | Transfer amount in a currency of the Merchant\n| client_currency\t| String   | Currency of the Merchant\n| amount\t        | Float    | Transfer amount in a SYSTEM currency to be sent to the recipient. Without fee\n| total_fee\t            | Float    | Transaction fee\n| gross | Float | Transfer amount to be sent to the recipient + transaction fee in a SYSTEM currency\n| currency\t| String   | Currency of the SYSTEM\n| timestamp\t    | Number   | Unix timestamp at the time of the request (in seconds)\n| hash\t        | String   | Request hash\n\n**Request example:**\n```\nmethod=transfer.verify&id=913f58c6-1d12-4b7e-8055-63eceb16089c&order_id=yk4jp8f8lj4xedgsgmrur&recipient=ac389ee8-024c-4195-acd9-058044cab8ca&status=processing&client_amount=100.00&client_currency=THB&amount=100.00&total_fee=1.50&gross=101.50&currency=THB&failure_code=&failure_message=&timestamp=1697613541&hash=16615f7112325d80e2641120c2640783a5f77206\n```\n\n**Response to callback:**\n\nThe SYSTEM expects you to respond to the callback with the following structure:\n\n| Name                    | Type     | Description                      |\n|-------------------------|----------|----------------------------------|\n| response                | Object   | Response to callback\n| &nbsp;&nbsp;status\t    | Number   | Verification status\n| &nbsp;&nbsp;message\t    | String   | Human readable description of the status\n| &nbsp;&nbsp;timestamp\t| Number   | Unix timestamp at the time of the response (in seconds)\n| hash\t                | String   | Response hash\n\n**Response status:**\n\n| Name | Type     | Description                      |\n|------|----------|----------------------------------|\n| 270  | Response | Notification received\n| 475\t | Response | Transfer with the specified parameters can not be executed\n| 401\t | Error    | Invalid hash\n| 500\t | Error    | Internal Server Error\n\n**Response example:**\n```json\n HTTP/1.1 200 OK\n {\n    \"response\": {\n      \"status\": 270,\n      \"message\": \"Transfer can be processed\",\n      \"timestamp\": 1697613541171\n    },\n  \"hash\": \"44afe3c7e5083405627ce19a6121e984514088bd\"\n }\n ```\n**Failed to process notification example:**\n```json\n HTTP/1.1 200 OK\n {\n    \"response\": {\n      \"status\": 475,\n      \"message\": \"Invalid amount\",\n      \"timestamp\": 1697613541171\n    },\n  \"hash\": \"73f36eae3751a97522ac8639f813c37b0785dc3c\"\n }\n ```\n\n\n## Card Authorizations Notifications\nA notification request is a request for any card authorization related event that the merchant has set for notification. Callback notifications for card authorization can be set for the following types of events:\n\n| Event              | Description                      |\n|--------------------|----------------------------------|\n| `card_auth.success`  | The card authorization is successfully completed\n| `card_auth.rejected` | The card authorization was rejected on the Bank side\n\n> It is also possible to split events between different endpoints with their own security keys.\n\nIf the endpoint responds with HTTP status other than 200, then after a certain time interval the system will repeat the request. There will be 10 attempts in total, after which the system will stop trying to notify on this event.\n\n\n<span type=\"post\" class=\"sc-jHcXXw ewkxcg http-verb post\">POST</span>\n```\nhttp(s)://{merchant_endpoint_url}\n```\n\n**Usage example:**\n```\ncurl -i -X POST http(s)://{merchant_endpoint_url} \\\n  -d \"method=card_auth.success\" \\\n  -d \"id=53\" \\\n  -d \"service_id=5\" \\\n  -d \"amount=100.00\" \\\n  -d \"timestamp=1747979501\" \\\n  -d \"hash=9bdb17fbe83aae206b23eadfa5cd304a26e01d87\"\n```\n\n**Parameters:**\n\n| Name        | Type     | Description                      |\n|-------------|----------|----------------------------------|\n| method\t    | String   | Specifies the name of event.<br/> Allowed values: `\"card_auth.success\"`, `\"card_auth.rejected\"`\n| id\t        | Number   | Card authorization ID in the system\n| service_id\t| Number   | Card authorization method ID\n| amount\t    | Number   | Card authorization amount in the currency of payment method\n| timestamp\t  | Number   | Unix timestamp at the time of the request (in seconds)\n| hash\t      | String   | Request hash\n\n**Request example:**\n```\nmethod=card_auth.success&id=53&service_id=5&amount=100.00&timestamp=1747979501&hash=9bdb17fbe83aae206b23eadfa5cd304a26e01d87\n```\n\n**Response to callback:**\n\nThe SYSTEM expects you to respond to the callback with the following structure:\n\n| Name                    | Type     | Description                      |\n|-------------------------|----------|----------------------------------|\n| response                | Object   | Response to callback\n| &nbsp;&nbsp;status\t    | Number   | Verification status\n| &nbsp;&nbsp;message\t    | String   | Human readable description of the status\n| &nbsp;&nbsp;timestamp\t  | Number   | Unix timestamp at the time of the response (in seconds)\n| hash\t                  | String   | Response hash\n\n**Response status:**\n\n| Name | Type     | Description                      |\n|------|----------|----------------------------------|\n| 270  | Response | Notification received\n| 474\t | Response | Card Authorization Not Found on the merchant side\n| 401\t | Error    | Invalid hash\n| 500\t | Error    | Internal Server Error\n\n**Response example:**\n```json\n HTTP/1.1 200 OK\n {\n    \"response\": {\n      \"status\": 270,\n      \"message\": \"Ok\",\n      \"timestamp\": 1747980097\n    },\n  \"hash\": \"150ad2b74469a83e092ced063109b40d94309953\"\n }\n ```\n**Failed to process notification example:**\n```json\n HTTP/1.1 200 OK\n {\n    \"response\": {\n      \"status\": 401,\n      \"message\": \"Invalid hash\",\n      \"timestamp\": 1747980097\n    },\n  \"hash\": \"ebefe4e5e8d5e76d40697dea77605a7c40662178\"\n }\n ```\n\n\n## Code samples\n**Hash validation example:**\n```\n$params = $_POST; //getting params from payserver's POST request\n\n$hash = $params['hash'];\nunset($params['hash']);\n\n$check_hash = hash_hmac('sha1', http_build_query($params, null, '&', PHP_QUERY_RFC3986), '{CALLBACK_SECRET}');\nif ($hash != $check_hash) {\n  // Response with invalid hash error\n} else {\n  // Your business logic here\n}\n```\n\n**Response preparation example:**\n```\n$params = [\n   'status' => 401,\n   'message' => 'Invalid hash.',\n   'timestamp' => time()\n]\n\n// Combine the response object\n$response = json_encode([\n    'response' => $params,\n    'hash' => hash_hmac('sha1', json_encode($params), '{CALLBACK_SECRET}')\n]);\n// Response to the client next\n ```\n"
  - name: Authorizer API
    description: |
      On the merchant's side, up to 3 services can participate in the transfer of funds:
      <br/>
      1. <b>Maker</b> is a service for creation of transfers via Transfers API.
         This service is <b>Mandatory</b>; <br/>
      2. <b>Authorizer</b> is a service for sending a request for authorization of a previously created transfer.
         The transfer will not be accepted for processing until it is authorized by a request from the <b>Authorizer</b> service.
         This service is <b>Mandatory</b>; <br/>
      3. <b>Endpoint</b> is a service that receives notifications about various events in the process of transferring funds.
         It can also act as a verifier of the transfer. In this case the endpoint will receive a request for verification of transfer operation before the direct transfer of funds to the recipient's account.
         The endpoint must implement the standard Callback API as described earlier for payments. This service is <b>Optional</b>. <br/>

      The main purpose of dividing the transfer process on the merchant's side between several different servers is to provide a high level of security for the transfer process. The merchant side must separate the business logic of Maker, Authorizer and Endpoint services between different servers to improve the safety level.
      <br/>
      To authorize previously created transfers, the <b>Authorizer</b> service must interact with the <b>Authorizer API</b> provided by our system.
      <br/>
      <br/>
      ### Requirements of the Authorizer API
      1. All API requests must be made over HTTPS. Calls made over plain HTTP will fail;
      2. All API requests must contain the Content-Type: application/json header. Calls without this header or with non-json data will fail;
      3. All API requests must contain the User-Agent header;
      4. All API requests must contain the X-Api-Key HTTP header with your API key into it. How to get it will be described it next sections;
      5. API requests without proper authentication will fail;
      6. All requests from IP addresses not included in white list will be refused.

      ### How to request the Authorizer API
      #### Prepare API keys
      The Merchant's <b>Authorizer</b> service and the <b>Authorizer API</b> both will use the RSA keys to authenticate requests and response during the server-to-server communication.

      So first of all you need to generate RSA keys.

      RSA keys pair should be with a <b>2048 bit</b> key length. Public key must be provided in <b>PKCS8</b> format.
       - Create pair of RSA keys: `$ ssh-keygen -P "" -t rsa -b 2048 -f authorizer-keys -m pkcs8`
       - Show public key in PKCS8 format: `$ ssh-keygen -f authorizer-keys.pub -e -m pkcs8`

      The <b>private key</b> have to be <b>kept safe</b> on the <b>merchant side</b>. The public key you need to save at our side. Also you need to generate the Authorizer API Key. To do all of that please login to the Merchant's Cabinet and open the `Settings > Authorizer` section.

      Here you will find following keys to manage:
       - <b>Authorizer API Key</b> it is the secret key to authenticate requests to the Authorizer API. The Authorizer service should to put into the `X-API-KEY` header for each request. Please push the "Create" button to generate an Authorizer API Key if it has not yet been generated. You can now use it to properly authenticate requests to the Authorizer API.
       - <b>Authorizer Public Key</b> it is the Public part of RSA pair of keys. Authorizer API will use it to verify hash signature of data from request. Please put your Public key to the Authorizer Public Key;
       - <b>Public key of API Server</b> it is the Public part of RSA pair of keys for the Authorizer API Server. Please use it to verify the hash signature of data in responses from the <b>Authorizer API</b>.

      <blockquote>   
       Authorizer API Key is sensitive data, so be sure to keep it secure! Do not share any of your private keys in publicly accessible areas such as GitHub, client-side code, and so forth.
      </blockquote>

      Prepare the signature for request body
      1. Create the JSON object of transfer which you want to authorize for processing:
      ```json
       {
          "id":"yk4jp8f8lj4xedgsgmrur",
          "order_id":"1238_test_tr",
          "amount":100.00,
          "currency":"THB",
          "client_amount":100.00,
          "client_currency":"THB",
          "recipient":"341c1bc0-b703-46a0-b618-718fe415c9ec"
      }
      ```
      2. Convert it to the string view without any spaces between parameters:
      ```json
       {"id":"yk4jp8f8lj4xedgsgmrur","order_id":"1238_test_tr","amount":100,"currency":"THB","client_amount":100,"client_currency":"THB","recipient":"341c1bc0-b703-46a0-b618-718fe415c9ec"}
      ```
        <blockquote>
          <b>Attention!</b>
          Amounts without digits after the dot must be provided without extra zeros after the dot. <br>
          Example: `20.00` should be used as `20`, `10.50` as `10.5`
        </blockquote>

      3. Prepare a payload string. Payload string can be created by concatenating of next values:
         - HTTP method name in uppercase;
         - API method route;
         - Current UTC timestamp in seconds;
         - The actual JSON payload. All values must be separated by a dot character:
      ```json
       POST.transfers/authorize.1671602093.{"id":"yk4jp8f8lj4xedgsgmrur","order_id":"1238_test_tr","amount":100,"currency":"THB","client_amount":100,"client_currency":"THB","recipient":"341c1bc0-b703-46a0-b618-718fe415c9ec"}
      ```
      4. Compute an RSA Signature by using RSA SHA256 algorithm with RSA PKCS1 PADDING. Use your private part of RSA key as the key, and use the signed payload string as the message.

      Service to test creation of RSA signature https://8gwifi.org/rsasignverifyfunctions.jsp <br>
      Be sure that you have use the base64 encoding on computed signature.

      Prepare request headers
       - Put the resulting signature into <b>X-Signature</b> header,
       - Put the current timestamp in seconds to the <b>X-Timestamp</b> header,
       - Put your Authorizer API Key to the <b>X-Api-Key</b> header,
       - Put your IP address to the <b>X-Real-IP</b> header,
       - If you have the Idempotency Key then put it to the <b>X-Idempotency-Key</b> header.

      Merchant can only authorize transfers with the New status that have not expired their ttl (time-to-live). Authorization requests for other transfers will be denied.<br>
      The transfer’s ttl is 24 hours after creation (property `created_at`). Transfers with expired ttl will be automatically rejected.
  - name: Clients API
    description: |
      Clients API duplicates cabinet functionality. It allows the merchant to obtain information about its payments, payouts and finance statistics. To search information mechant have to use GET-requests with authorization token (Client API key) placed in headers. Each request should contain the reference to environment and major API version.
  - name: Payment API
    description: Payment API documentation describes the protocol of communication between the merchant and the SYSTEM and serves as a guide for arranging acceptance of payments for goods and (or) services.
  - name: Transfer API
    description: "### Introduction\n\nThis documentation describes the protocol of communication between a merchant’s server and transfer system and serves as a guide for arranging withdrawal from the merchant’s account (from the system) to customers (to personal user bank accounts) by merchant side calls.\n\nThe withdrawal action is represented by a scope of methods that includes some helper methods to get data for preparing a single transfer, methods that arrange a single transfer to the user’s bank account and checks results of transfers by a merchant side requests.\n\nPayout is an order to transfer all available (or specified amount) funds from the merchant account in the system to the merchant’s company bank account that is managed handy on the system side\n\nThe transfer service (from the merchant account to user bank accounts) is able to use by 3 modes:\n\n  <b>1.</b> Manual – manage of transfer actions (create/edit/delete/auth/status) are realizing in the cabinet by manual mode\n\n  <b>2.</b> Semi-automated – part of transfer actions makes by merchant server (create/edit/delete) and sign by authorization person of merchant in the cabinet.\n\n  <b>3.</b> Fully automated – full management of transfer actions is released by server-to-server interaction in real time mode.\n\nIn the v1 release of protocol being used for Semi-automated process transfers. Transfers should be signed by the 2fa key in the merchant cabinet personally by the merchant side, by the person who has power and responsibility to sign transfer lists for processing. After transfers have been signed they can't be updated or deleted, because it has been sent for processing on the bank side.\n\nFully automated mode has a description of automatically a server signatory for each 'transfer' from the merchant's side by special signatory key with callback checks and confirmation notifications from the SYSTEM side. The option of automatic server signatory will be available after sign the paper of understanding risks management confirmation notification and accepting responsibility, and also, merchant side must implement a callback verification gateway for 'verify' (check transfer before send to bank) and 'pay', 'reject' (status confirmation processing) requests for interact with the SYSTEM side.\n\nThis documentation is designed for the software developers of a merchant side and describes API calls for Semi-automated and Fully automated modes of managing transfers from the merchant side.\n\n\n<b>The Transfer process sequence diagram:</b>\n\n  ![](img/Transfer-workflow-sequence.jpg \"Sequence diagram\")\n\n<b>The Transfer process block scheme diagram</b>\n\n  ![](img/Block-scheme-transfer-proceessing.jpg \"Block scheme diagram\")\n\n### Transfers test accounts\n\nPlease find below the test accounts for the Sandbox environment, transfer to which will cause certain errors.\n\nPlease use them to check out the reaction of your system in case of failure.\n\n|Account number\t    | Error text\t         | Error description                                                                             |\n|-------------------|----------------------|-----------------------------------------------------------------------------------------------|\n|2692034297         |      not_found       |Account is not found                                                                           |\n|8000260785         |      inactive        |Account is blocked or inactive                                                                 |\n|2001774045         |      bank_cancel     |Bank is reject an operation                                                                    |\n|0031591764         |      error           |Service or bank doesn't work                                                                   |\n|0031591765         |      fail            |Service or bank failed an operation due to custom reason                                       |\n|0031591766         |      aml_reject      |Сancel from a sending bank due to client's account is in AML watchlist                         |\n"
