<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChillPay 결제</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 2rem; max-width: 500px; margin: 0 auto; }
    #chillpay-container { border: 1px solid #dee2e6; border-radius: 6px; padding: 1rem; margin: 1rem 0; min-height: 120px; background: #f8f9fa; }
    .result-box { padding: 1rem; border-radius: 6px; margin-top: 1rem; }
    .result-success { background: #d1e7dd; color: #0f5132; }
    .result-error { background: #f8d7da; color: #842029; }
  </style>
</head>
<body>
  <div class="container">
    <h4 class="mb-4">ChillPay 결제</h4>
    <div id="configError" class="alert alert-warning" style="display:none;">API 설정을 불러올 수 없습니다. 서버(8080)가 실행 중인지 확인하세요.</div>

    <form id="payForm">
      <div class="mb-3">
        <label class="form-label">주문번호</label>
        <input type="text" class="form-control" name="orderNo" id="orderNo" value="" placeholder="자동 생성">
      </div>
      <div class="mb-3">
        <label class="form-label">결제 금액 (JPY) *</label>
        <input type="number" class="form-control" name="amount" id="amount" required min="100" placeholder="1000">
      </div>
      <div class="mb-3">
        <label class="form-label">휴대폰 번호</label>
        <input type="text" class="form-control" name="phoneNumber" placeholder="0812345678">
      </div>
      <div class="mb-3">
        <label class="form-label">결제 설명</label>
        <input type="text" class="form-control" name="description" placeholder="주문 결제">
      </div>
      <div class="mb-3">
        <label class="form-label">ChillPay DirectCredit 토큰 *</label>
        <div id="chillpay-container">
          <p class="text-muted small mb-0">ChillPay CCD 스크립트 로드 후 카드 입력 영역이 표시됩니다. (Sandbox: ChillPay 데모에서 토큰 발급 후 입력)</p>
        </div>
        <input type="text" class="form-control mt-2" name="directCreditToken" id="directCreditToken" placeholder="DirectCreditToken (CCD 스크립트에서 발급)">
      </div>
      <button type="submit" class="btn btn-primary w-100" id="submitBtn">결제 요청</button>
    </form>

    <div id="result" class="result-box" style="display:none;"></div>
  </div>

  <script src="js/config.js?v=6"></script>
  <script>
    (function () {
      var h = (window.location && window.location.hostname) ? window.location.hostname : '';
      if (h === 'localhost' || h === '127.0.0.1') return;
      if (h === 'api.icopay.co.kr') {
        try {
          var og = (window.location.origin || '').replace(/\/$/, '');
          if (og) {
            try { localStorage.removeItem('pg_api_base'); } catch (e) {}
            window.PG_API_BASE = og;
          }
        } catch (e2) {}
        return;
      }
      var api = window.PG_PUBLIC_ICOPAY_API || 'https://api.icopay.co.kr';
      var b = (window.PG_API_BASE || '').replace(/\/$/, '');
      var bad = !b || /^https?:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/i.test(b);
      if (bad) {
        try { localStorage.removeItem('pg_api_base'); } catch (e) {}
        window.PG_API_BASE = api;
      }
    })();
  </script>
  <script>
    (function () {
      var API_BASE = (window.PG_API_BASE !== undefined && window.PG_API_BASE !== '')
        ? window.PG_API_BASE
        : (typeof window.PG_assetApiBase === 'function' ? window.PG_assetApiBase() : (window.location.origin || ''));
      API_BASE = (API_BASE + '').replace(/\/$/, '');

      document.getElementById('orderNo').value = 'ORD' + Date.now();

      function showResult(msg, isError) {
        var el = document.getElementById('result');
        el.style.display = 'block';
        el.className = 'result-box ' + (isError ? 'result-error' : 'result-success');
        el.textContent = msg;
      }

      function getMerchantId() {
        var params = new URLSearchParams(window.location.search);
        var m = params.get('m');
        return m ? parseInt(m, 10) : null;
      }

      function loadConfig() {
        var merchantId = getMerchantId();
        var url = API_BASE + '/api/pay/chillpay/config';
        if (merchantId) url += '?merchantId=' + merchantId;
        return fetch(url)
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (res.success && res.data) {
              return res.data;
            }
            throw new Error(res.message || '설정 조회 실패');
          });
      }

      function loadChillPayScript(url) {
        return new Promise(function (resolve, reject) {
          if (document.querySelector('script[src="' + url + '"]')) {
            resolve();
            return;
          }
          var s = document.createElement('script');
          s.src = url;
          s.onload = resolve;
          s.onerror = function () { reject(new Error('ChillPay 스크립트 로드 실패')); };
          document.head.appendChild(s);
        });
      }

      loadConfig().then(function (cfg) {
        return loadChillPayScript(cfg.ccdScriptUrl).then(function () { return cfg; });
      }).then(function (cfg) {
        if (window.ChillPay || window.CCDPayment) {
          var container = document.getElementById('chillpay-container');
          container.innerHTML = '<p class="text-muted small">ChillPay 결제 컴포넌트 초기화됨. 카드 정보 입력 후 결제 시 토큰이 자동 발급됩니다.</p>';
        }
      }).catch(function (e) {
        document.getElementById('configError').style.display = 'block';
        document.getElementById('configError').textContent = (e && e.message) || '설정 로드 실패';
      });

      document.getElementById('payForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        var merchantId = getMerchantId();
        var fd = {
          orderNo: document.getElementById('orderNo').value.trim() || 'ORD' + Date.now(),
          amount: parseInt(document.getElementById('amount').value, 10) || 0,
          directCreditToken: document.getElementById('directCreditToken').value.trim(),
          phoneNumber: document.querySelector('[name="phoneNumber"]').value.trim(),
          description: document.querySelector('[name="description"]').value.trim()
        };
        if (merchantId) fd.merchantId = merchantId;
        if (!fd.directCreditToken) {
          showResult('DirectCreditToken을 입력하세요. (ChillPay CCD 스크립트 또는 샌드박스 데모에서 발급)', true);
          btn.disabled = false;
          return;
        }
        if (fd.amount < 100) {
          showResult('결제 금액은 100 JPY 이상이어야 합니다.', true);
          btn.disabled = false;
          return;
        }
        fetch(API_BASE + '/api/pay/chillpay/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(fd)
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (res.success && res.data) {
            var d = res.data.data;
            if (d && d.paymentStatus === 'WaitAuthorize' && d.paymentUrl) {
              window.location.href = d.paymentUrl;
              return;
            }
            if (d && d.paymentStatus === 'Paid') {
              showResult('결제가 완료되었습니다. (Paid)');
              return;
            }
            showResult((res.data.message || res.data.status || '') + ' - ' + (d ? d.paymentStatus || '' : ''), true);
          } else {
            showResult(res.message || '결제 요청 실패', true);
          }
        }).catch(function (err) {
          showResult((err && err.message) || '네트워크 오류', true);
        }).finally(function () {
          btn.disabled = false;
        });
      });
    })();
  </script>
</body>
</html>
