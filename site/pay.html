<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
  <link href="css/pay-inline.css?v=4" rel="stylesheet">
</head>
<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand">
        <div class="pay-brand-logo" data-i18n="brandTitle">ICOPAY</div>
        <div class="pay-brand-sub" data-i18n="brandSub">Secure checkout</div>
      </div>

      <div class="pay-lang" role="group" aria-label="Language">
        <button type="button" data-lang="KOR">KOR</button>
        <button type="button" class="active" data-lang="ENG">ENG</button>
        <button type="button" data-lang="CHN">CHN</button>
        <button type="button" data-lang="JPN">JPN</button>
        <button type="button" data-lang="THA">THA</button>
      </div>

      <div id="configError" class="alert alert-warning pay-alert-config" style="display:none;"></div>
      <div id="payRedirectBanner" class="alert alert-info small pay-redirect-banner d-none" role="status" data-i18n="redirectModeNotice"></div>

      <form id="payForm" novalidate>
        <input type="hidden" id="directCreditToken" name="directCreditToken" value="">
        <input type="hidden" id="orderNo" name="orderNo" value="">

        <div class="pay-form-grid">
          <div class="pay-row pay-row-static">
            <div class="pay-row-label"><span data-i18n="merchantNameLabel">Merchant Name</span></div>
            <div class="pay-row-value"><span id="merchantNameDisplay" class="pay-merchant-readonly">—</span></div>
          </div>

          <div class="pay-row">
            <label class="pay-row-label mb-0" for="amount"><span data-i18n="totalAmount">Total Amount</span> <span class="req">*</span> <span class="pay-currency-hint text-muted fw-normal" data-i18n="currencyJpy">(JPY)</span></label>
            <div class="pay-row-value">
              <input type="number" class="form-control form-control-sm pay-input-round" id="amount" name="amount" required min="1" step="1" inputmode="numeric">
            </div>
          </div>

          <div class="pay-row">
            <label class="pay-row-label mb-0" for="item"><span data-i18n="item">Item</span> <span class="req">*</span></label>
            <div class="pay-row-value">
              <input type="text" class="form-control form-control-sm pay-input-round" id="item" name="item" required autocomplete="off" data-i18n-placeholder="phItem">
            </div>
          </div>

          <div id="payExtendedFields">
            <div class="pay-row">
              <label class="pay-row-label mb-0" for="phoneNumber"><span data-i18n="mobile">Mobile Number</span> <span class="req">*</span></label>
              <div class="pay-row-value">
                <input type="tel" class="form-control form-control-sm pay-input-round" id="phoneNumber" name="phoneNumber" required autocomplete="tel">
              </div>
            </div>
            <div id="payFullNameRow" class="pay-row">
              <div class="pay-row-label"><span data-i18n="nameOnCardPair">First / Last name</span> <span class="req">*</span></div>
              <div class="pay-row-value pay-row-split">
                <input type="text" class="form-control form-control-sm pay-input-round" id="firstName" required autocomplete="given-name" data-i18n-placeholder="phFirst" placeholder="">
                <input type="text" class="form-control form-control-sm pay-input-round" id="lastName" required autocomplete="family-name" data-i18n-placeholder="phLast" placeholder="">
              </div>
            </div>
            <div class="pay-row">
              <label class="pay-row-label mb-0" for="custEmail"><span data-i18n="email">Email Address</span> <span class="req">*</span></label>
              <div class="pay-row-value">
                <input type="email" class="form-control form-control-sm pay-input-round" id="custEmail" name="custEmail" required autocomplete="email">
              </div>
            </div>
            <div id="payBillingBlock">
              <div class="pay-row">
                <label class="pay-row-label mb-0" for="zipCode"><span data-i18n="zip">Zip / Postal Code</span> <span class="req">*</span></label>
                <div class="pay-row-value">
                  <input type="text" class="form-control form-control-sm pay-input-round" id="zipCode" name="zipCode" required autocomplete="postal-code">
                </div>
              </div>
              <div class="pay-row">
                <label class="pay-row-label mb-0" for="country"><span data-i18n="country">Country</span> <span class="req">*</span></label>
                <div class="pay-row-value">
                  <select class="form-select form-select-sm pay-input-round" id="country" name="country" required>
                    <option value="" data-i18n="countryPh">Select an option</option>
                  </select>
                </div>
              </div>
              <div class="pay-row">
                <label class="pay-row-label mb-0" for="city"><span data-i18n="city">City</span> <span class="req">*</span></label>
                <div class="pay-row-value">
                  <input type="text" class="form-control form-control-sm pay-input-round" id="city" name="city" required autocomplete="address-level2">
                </div>
              </div>
              <div class="pay-row">
                <label class="pay-row-label mb-0" for="addressLine"><span data-i18n="address">Primary Address</span> <span class="req">*</span></label>
                <div class="pay-row-value">
                  <input type="text" class="form-control form-control-sm pay-input-round" id="addressLine" name="addressLine" required autocomplete="street-address">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div id="payInlineOnly" class="pay-inline-only-block">
        <hr class="pay-divider">

        <div class="pay-label mb-1"><span data-i18n="cardSection">Card</span> <span class="req">*</span></div>
        <p class="small text-muted mb-2" data-i18n="cardNote">Card data is tokenized via ChillPay CCD. Enter the security token below in sandbox, or use the hosted input when available.</p>
        <div class="pay-cardnums mb-2" aria-hidden="true">
          <input type="text" class="form-control form-control-sm" maxlength="4" inputmode="numeric" pattern="[0-9]*" disabled placeholder="••••" title="">
          <input type="text" class="form-control form-control-sm" maxlength="4" inputmode="numeric" pattern="[0-9]*" disabled placeholder="••••">
          <input type="text" class="form-control form-control-sm" maxlength="4" inputmode="numeric" pattern="[0-9]*" disabled placeholder="••••">
          <input type="text" class="form-control form-control-sm" maxlength="4" inputmode="numeric" pattern="[0-9]*" disabled placeholder="••••">
        </div>
        <div class="pay-exp-cvv mb-2">
          <select class="form-select form-select-sm" id="expMonth" disabled aria-hidden="true"></select>
          <select class="form-select form-select-sm" id="expYear" disabled aria-hidden="true"></select>
          <div class="pay-cvv-wrap">
            <input type="text" class="form-control form-control-sm" maxlength="4" placeholder="CVV" disabled aria-hidden="true">
          </div>
        </div>

        <div class="pay-ccd-wrap">
          <div class="pay-ccd-hint" data-i18n="ccdMountHint">ChillPay secure card input (CCD)</div>
          <div id="chillpay-card-host"></div>
        </div>

        <details class="pay-sandbox-token">
          <summary data-i18n="sandboxToken">Sandbox: DirectCreditToken</summary>
          <input type="text" class="form-control form-control-sm mt-1" id="directCreditTokenManual" autocomplete="off" data-i18n-placeholder="phToken" placeholder="">
        </details>
        </div>

        <div class="pay-checks">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="agreeTerms" required>
            <label class="form-check-label" for="agreeTerms" data-i18n="agreeTerms">I agree to the Terms and Conditions</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="confirmOrder" required>
            <label class="form-check-label" for="confirmOrder" data-i18n="confirmOrder">I confirm the order details above.</label>
          </div>
        </div>

        <div class="pay-actions">
          <button type="submit" class="btn btn-primary btn-pay" id="submitBtn" data-i18n="payButton">Payment</button>
        </div>
      </form>

      <div id="payResult"></div>
    </div>
  </div>

  <script src="js/config.js?v=6"></script>
  <script>
    (function () {
      var h = (window.location && window.location.hostname) ? window.location.hostname : '';
      if (h === 'localhost' || h === '127.0.0.1') return;
      if (h === 'api.icopay.co.kr') {
        try {
          var og = (window.location.origin || '').replace(/\/$/, '');
          if (og) {
            try { localStorage.removeItem('pg_api_base'); } catch (e) {}
            window.PG_API_BASE = og;
          }
        } catch (e2) {}
        return;
      }
      var api = window.PG_PUBLIC_ICOPAY_API || 'https://api.icopay.co.kr';
      var b = (window.PG_API_BASE || '').replace(/\/$/, '');
      var bad = !b || /^https?:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/i.test(b);
      if (bad) {
        try { localStorage.removeItem('pg_api_base'); } catch (e) {}
        window.PG_API_BASE = api;
      }
    })();
  </script>

      function setReqInput(id, on) {
        var el = document.getElementById(id);
        if (!el) return;
        if (on) el.setAttribute('required', 'required');
        else el.removeAttribute('required');
      }

      function applyCheckoutPresentation() {
        var flow = urlPayFlow;
        var formMode = urlPayFormMode;
        var banner = document.getElementById('payRedirectBanner');
        var inlineOnly = document.getElementById('payInlineOnly');
        var ext = document.getElementById('payExtendedFields');
        var ids = ['phoneNumber', 'firstName', 'lastName', 'custEmail', 'zipCode', 'country', 'city', 'addressLine'];

        if (banner) {
          banner.classList.toggle('d-none', flow !== 'REDIRECT');
        }
        if (inlineOnly) {
          inlineOnly.classList.toggle('d-none', flow === 'REDIRECT');
        }

        var simple = formMode === 'SIMPLE';
        if (ext) {
          ext.classList.toggle('d-none', simple);
        }
        ids.forEach(function (id) {
          setReqInput(id, !simple);
        });
      }

      function getCompId() {
        var p = new URLSearchParams(window.location.search);
        var m = p.get('m');
        return m ? String(m).trim() : '';
      }

      function t(key) {
        var pack = I18N[LANG] || I18N.ENG;
        return pack[key] != null ? pack[key] : (I18N.ENG[key] || key);
      }

      function applyI18n() {
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var k = el.getAttribute('data-i18n');
          if (k) el.textContent = t(k);
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
          var k = el.getAttribute('data-i18n-placeholder');
          if (k) el.setAttribute('placeholder', t(k));
        });
        fillCountryOptions();
      }

      function fillCountryOptions() {
        var sel = document.getElementById('country');
        if (!sel) return;
        var keep = sel.value;
        sel.innerHTML = '';
        var ph = document.createElement('option');
        ph.value = '';
        ph.textContent = t('countryPh');
        sel.appendChild(ph);
        var labelKey = LANG === 'KOR' ? 'ko' : LANG === 'CHN' ? 'zh' : LANG === 'JPN' ? 'ja' : LANG === 'THA' ? 'th' : 'en';
        COUNTRIES.forEach(function (c) {
          var o = document.createElement('option');
          o.value = c.v;
          o.textContent = c[labelKey] || c.en;
          sel.appendChild(o);
        });
        if (keep) sel.value = keep;
      }

      function setLang(code) {
        LANG = code;
        document.querySelectorAll('.pay-lang button').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-lang') === code);
        });
        applyI18n();
      }

      document.querySelectorAll('.pay-lang button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setLang(btn.getAttribute('data-lang') || 'ENG');
        });
      });

      function showResult(msg, isErr) {
        var el = document.getElementById('payResult');
        el.style.display = 'block';
        el.className = isErr ? 'err' : 'ok';
        el.textContent = msg;
      }

      function loadExpOptions() {
        var m = document.getElementById('expMonth');
        var y = document.getElementById('expYear');
        if (!m || !y) return;
        m.innerHTML = '';
        for (var i = 1; i <= 12; i++) {
          var o = document.createElement('option');
          o.value = String(i).padStart(2, '0');
          o.textContent = o.value;
          m.appendChild(o);
        }
        y.innerHTML = '';
        var yr = new Date().getFullYear();
        for (var j = 0; j < 16; j++) {
          var yy = yr + j;
          var o2 = document.createElement('option');
          o2.value = String(yy);
          o2.textContent = String(yy);
          y.appendChild(o2);
        }
      }

      function apiUrl(path, qs) {
        var u = API_BASE + path;
        if (qs) u += (u.indexOf('?') >= 0 ? '&' : '?') + qs;
        return u;
      }

      function fetchJson(url) {
        return fetch(url).then(function (r) { return r.json(); });
      }

      function loadChillPayScript(url) {
        return new Promise(function (resolve, reject) {
          if (document.querySelector('script[data-chillpay-ccd="1"]')) {
            resolve();
            return;
          }
          var s = document.createElement('script');
          s.src = url;
          s.async = true;
          s.setAttribute('data-chillpay-ccd', '1');
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error('CCD script')); };
          document.head.appendChild(s);
        });
      }

      function tryInitCcd(cfg) {
        /* ChillPay 매뉴얼의 CCD 전역명이 환경별로 다를 수 있어, 로드 후 콜백만 준비 */
        var host = document.getElementById('chillpay-card-host');
        var tok = document.getElementById('directCreditToken');
        var manual = document.getElementById('directCreditTokenManual');
        function syncManual() {
          if (manual && manual.value && tok) tok.value = manual.value.trim();
        }
        if (manual) {
          manual.addEventListener('input', syncManual);
          manual.addEventListener('change', syncManual);
        }
        if (!host || !cfg) return;
        /* 향후 매뉴얼에 맞춰 CCDPayment / ChillPay 등 초기화 연결 */
        if (window.console && window.console.debug) {
          window.console.debug('ChillPay CCD ready', cfg.merchantCode, host);
        }
      }

      var checkoutCtx = null;
      var chillCfg = null;

      function boot() {
        loadExpOptions();
        setLang('ENG');
        var compId = getCompId();
        if (!compId) {
          document.getElementById('configError').style.display = 'block';
          document.getElementById('configError').textContent = t('needComp');
          document.getElementById('payForm').style.display = 'none';
          return;
        }

        var q = 'compId=' + encodeURIComponent(compId);
        Promise.all([
          fetchJson(apiUrl('/api/pay/chillpay/checkout-context', q)),
          fetchJson(apiUrl('/api/pay/chillpay/config', q))
        ]).then(function (arr) {
          var ctxRes = arr[0];
          var cfgRes = arr[1];
          if (!ctxRes.success || !ctxRes.data) throw new Error(ctxRes.message || t('configErr'));
          if (!cfgRes.success || !cfgRes.data) throw new Error(cfgRes.message || t('configErr'));
          checkoutCtx = ctxRes.data;
          chillCfg = cfgRes.data;
          urlPayFlow = String(checkoutCtx.urlPayFlow || 'INLINE').toUpperCase();
          urlPayFormMode = String(checkoutCtx.urlPayFormMode || 'FULL').toUpperCase();
          document.getElementById('merchantNameDisplay').textContent = checkoutCtx.merchantName || compId;
          if (checkoutCtx.defaultProductName) {
            document.getElementById('item').value = checkoutCtx.defaultProductName;
          }
          if (checkoutCtx.defaultAmountYen != null && checkoutCtx.defaultAmountYen !== '') {
            document.getElementById('amount').value = String(checkoutCtx.defaultAmountYen);
          }
          document.getElementById('orderNo').value = 'ORD-' + compId + '-' + Date.now();
          applyCheckoutPresentation();
          applyI18n();
          if (urlPayFlow === 'REDIRECT') {
            return Promise.resolve();
          }
          return loadChillPayScript(chillCfg.ccdScriptUrl).then(function () {
            tryInitCcd(chillCfg);
          });
        }).catch(function (e) {
          var el = document.getElementById('configError');
          el.style.display = 'block';
          el.textContent = (e && e.message) ? e.message : t('configErr');
        });
      }

      document.getElementById('payForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var compId = getCompId();
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        var langUi = LANG;

        if (urlPayFlow === 'REDIRECT') {
          showResult(t('redirectModeNotice'), true);
          btn.disabled = false;
          return;
        }

        var manual = document.getElementById('directCreditTokenManual');
        var hiddenTok = document.getElementById('directCreditToken');
        if (manual && manual.value.trim()) hiddenTok.value = manual.value.trim();

        var fn;
        var ln;
        var z;
        var co;
        var ci;
        var ad;
        var phoneVal;
        var emailVal;
        if (urlPayFormMode === 'SIMPLE') {
          fn = '';
          ln = '-';
          z = '';
          co = '';
          ci = '';
          ad = '';
          phoneVal = '';
          emailVal = '';
        } else {
          fn = document.getElementById('firstName').value.trim();
          ln = document.getElementById('lastName').value.trim();
          z = document.getElementById('zipCode').value.trim();
          co = document.getElementById('country').value.trim();
          ci = document.getElementById('city').value.trim();
          ad = document.getElementById('addressLine').value.trim();
          phoneVal = document.getElementById('phoneNumber').value.trim();
          emailVal = document.getElementById('custEmail').value.trim();
        }

        var fd = {
          compId: compId,
          orderNo: document.getElementById('orderNo').value.trim() || ('ORD' + Date.now()),
          amount: parseInt(document.getElementById('amount').value, 10) || 0,
          directCreditToken: hiddenTok.value.trim(),
          phoneNumber: phoneVal,
          item: document.getElementById('item').value.trim(),
          custEmail: emailVal,
          firstName: fn,
          lastName: ln,
          zipCode: z,
          country: co,
          city: ci,
          addressLine: ad,
          langCode: langUi
        };
        fd.customerId = fd.custEmail || 'guest';

        if (!fd.directCreditToken) {
          showResult(t('needToken'), true);
          btn.disabled = false;
          return;
        }
        if (!(fd.amount >= 1)) {
          showResult(t('needAmount'), true);
          btn.disabled = false;
          return;
        }

        fetch(API_BASE + '/api/pay/chillpay/request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(fd)
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (res.success && res.data) {
            var d = res.data.data;
            if (d && d.paymentStatus === 'WaitAuthorize' && d.paymentUrl) {
              window.location.href = d.paymentUrl;
              return;
            }
            if (d && d.paymentStatus === 'Paid') {
              showResult(t('payOk') + ' (Paid)', false);
              return;
            }
            showResult((res.data.message || res.data.status || '') + ' ' + (d ? (d.paymentStatus || '') : ''), true);
          } else {
            showResult(res.message || t('payFail'), true);
          }
        }).catch(function (err) {
          showResult((err && err.message) || t('payFail'), true);
        }).finally(function () {
          btn.disabled = false;
        });
      });

      boot();
    })();
  </script>
</body>
</html>
