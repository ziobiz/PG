<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>ICOPAY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/pay-inline.css?v=40" rel="stylesheet" />
  <link href="/css/icopay-crypto.css?v=16" rel="stylesheet" />
</head>
<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card ic-crypto-pay-card">
      <div class="pay-brand" id="cryptoBrand" hidden>
        <img id="cryptoBrandLogoImg" class="pay-brand-logo-img" alt="" hidden />
        <div id="cryptoBrandTextWrap">
          <div class="pay-brand-logo" id="cryptoBrandText">ICOPAY</div>
          <div class="pay-brand-sub" id="headerSubtitle"></div>
        </div>
      </div>
      <div class="pay-lang" id="langBar" role="group" aria-label="Language"></div>

      <!-- 세션 요약 (2·3단계) — 표시금액 + 송금금액 -->
      <div class="pay-form-grid mb-2" id="sessionSummary" hidden>
        <div class="pay-row pay-row-static">
          <div class="pay-row-label" id="sumAmountLabel">Amount</div>
          <div class="pay-row-value"><span id="amount" class="fw-semibold">—</span></div>
        </div>
        <div class="pay-row pay-row-static">
          <div class="pay-row-label" id="sumRemitLabel">Remittance</div>
          <div class="pay-row-value"><span id="remittance" class="fw-semibold text-primary">—</span></div>
        </div>
        <div class="pay-row pay-row-static">
          <div class="pay-row-label" id="sumOrderLabel">Order</div>
          <div class="pay-row-value"><span id="order">—</span></div>
        </div>
        <div class="pay-row pay-row-static">
          <div class="pay-row-label" id="sumProductLabel">Item</div>
          <div class="pay-row-value"><span id="product">—</span></div>
        </div>
      </div>

      <!-- 1단계: 카드 URL결제와 동일 셸 (표시통화 · 청구예상) -->
      <div id="startSection" hidden>
        <form id="cryptoStartForm" autocomplete="off" onsubmit="return false;">
          <div class="pay-form-grid mb-3">
            <div class="pay-row" id="startProductRow">
              <label class="pay-row-label mb-0" for="startProduct" id="startProductLabel">Item</label>
              <div class="pay-row-value">
                <input type="text" class="form-control form-control-sm pay-input-round" id="startProduct" autocomplete="off" />
              </div>
            </div>
            <div class="pay-row" id="startAmountRow">
              <label class="pay-row-label mb-0" for="startAmount" id="startAmountLabel">Amount</label>
              <div class="pay-row-value">
                <input type="number" class="form-control form-control-sm pay-input-round" id="startAmount" min="0.01" step="0.01" inputmode="decimal" />
              </div>
            </div>
            <div class="pay-row pay-row-static" id="startDisplayCurrencyRow">
              <div class="pay-row-label" id="startDisplayCurrencyLabel">Display currency</div>
              <div class="pay-row-value"><span id="startDisplayCurrencyText" class="fw-medium">USD</span></div>
            </div>
            <div class="pay-row pay-row-static" id="startQuoteRow">
              <div class="pay-row-label" id="startQuoteLabel">Expected charge</div>
              <div class="pay-row-value"><span id="startQuoteText" class="pay-fx-estimate-amount fw-semibold text-primary">—</span></div>
            </div>
          </div>

          <div class="row g-2 mb-2" id="startNameRow">
            <div class="col-6">
              <input type="text" class="form-control form-control-sm pay-input-round" id="startFirstName" autocomplete="given-name" lang="en" spellcheck="false" inputmode="latin" />
            </div>
            <div class="col-6">
              <input type="text" class="form-control form-control-sm pay-input-round" id="startLastName" autocomplete="family-name" lang="en" spellcheck="false" inputmode="latin" />
            </div>
          </div>

          <div class="row g-2 mb-2" id="startContactBlock">
            <div class="col-12" id="startEmailRow" hidden>
              <input type="email" class="form-control form-control-sm pay-input-round" id="startEmail" autocomplete="email" lang="en" spellcheck="false" inputmode="email" />
            </div>
            <div class="col-12" id="startCountryRow" hidden>
              <label class="pay-label mb-1 d-block" for="startCountry" id="startCountryLabel">Country code</label>
              <select class="form-select form-select-sm pay-input-round" id="startCountry"></select>
            </div>
            <div class="col-12" id="startPhoneRow" hidden>
              <label class="pay-label mb-1 d-block" for="startPhone" id="startPhoneLabel">Phone</label>
              <input type="tel" class="form-control form-control-sm pay-input-round" id="startPhone" autocomplete="tel-national" inputmode="numeric" pattern="[0-9]*" />
            </div>
          </div>

          <div id="startShipBlock" hidden>
            <div class="pay-label mb-2" id="startShipHeading">Shipping address</div>
            <div class="row g-2 mb-3">
              <div class="col-12">
                <input type="text" class="form-control form-control-sm pay-input-round" id="startShip" autocomplete="street-address" />
              </div>
            </div>
          </div>

          <button type="button" class="btn btn-primary btn-pay w-100" id="startBtn">Continue</button>
        </form>
      </div>

      <!-- 2단계: 자산·네트워크·지갑 -->
      <div class="ic-crypto-section" id="assetSection" hidden>
        <div class="pay-label mb-2" id="assetTitle"></div>
        <div class="ic-crypto-grid ic-crypto-grid-assets" id="assetGrid"></div>
      </div>
      <div class="ic-crypto-section" id="networkSection" hidden>
        <div class="pay-label mb-2" id="networkTitle"></div>
        <div id="networkGrid" class="ic-crypto-net-host"></div>
      </div>
      <div class="mt-3" id="selectGoWrap" hidden>
        <button type="button" class="btn btn-pay w-100 ic-crypto-btn-pastel-gray" id="selectGoBtn"></button>
      </div>

      <!-- 3단계: 입금 -->
      <div class="ic-crypto-section" id="depositSection" hidden>
        <div class="pay-label mb-2" id="depositTitle"></div>
        <div class="ic-crypto-addr-row">
          <div class="ic-crypto-addr" id="custodyAddr"></div>
          <button type="button" class="btn btn-outline-secondary btn-sm ic-crypto-copy-btn" id="copyBtn">COPY</button>
        </div>
        <div class="ic-crypto-qr-wrap"><canvas id="custodyQr" width="180" height="180" aria-label="QR"></canvas></div>
        <div class="mt-3">
          <button type="button" class="btn btn-primary btn-pay w-100" id="refreshBtn"></button>
        </div>
        <div class="alert alert-success small mt-3 mb-0" id="statusBox" role="status"></div>
      </div>

      <div class="alert alert-danger small mt-3 mb-0" id="err" hidden role="alert"></div>
    </div>
  </div>
  <script src="/js/qrcode.min.js"></script>
  <script src="/js/icopay-crypto-wallets.js"></script>
  <script src="/js/icopay-checkout-header.js?v=6"></script>
  <script src="/js/jpay-contact-fields.js?v=3"></script>
  <script>

      copied: 'Address copied.', errSession: 'Could not load payment session.',
      pickAsset: 'Select an asset.', pickNet: 'Select a network.',
      startProduct: 'Item', startAmount: 'Amount', startGo: 'Continue',
      firstName: 'First name', lastName: 'Last name', email: 'Email', country: 'Country code', phone: 'Phone',
      ship: 'Shipping address', shipOpt: '(optional)', selectGo: 'Get deposit address',

      needEmail: 'Enter your email.', needPhone: 'Enter your phone.', needCountry: 'Select country code.',

      emailInvalid: 'Invalid email format.', phoneDigits: 'Phone must be digits only.',
      fxFail: 'Could not calculate FX.'

    JP: {

      deposit: 'ICOPAY入金アドレス', confirm: '送金完了 · 入金確認',

      ship: '配送先住所', shipOpt: '（任意）', selectGo: '入金アドレスを表示',

      firstName: '名', lastName: '姓', email: '邮箱', country: '国家代码', phone: '电话',
      ship: '收货地址', shipOpt: '（选填）', selectGo: '获取充值地址',

      order: 'เลขคำสั่งซื้อ', product: 'สินค้า', amount: 'จำนวน', remit: 'ยอดโอน',
      displayCcy: 'สกุลแสดง', quoteEst: 'ยอดเรียกเก็บโดยประมาณ',
      waiting: 'รอฝาก… หลังโอน กด「โอนแล้ว · ตรวจยอดฝาก」',
      confirmed: 'ยืนยันการฝากแล้ว', expired: 'หมดเวลารับฝาก',
      copied: 'คัดลอกแล้ว', errSession: 'โหลดเซสชันไม่สำเร็จ',

      firstName: 'ชื่อ', lastName: 'นามสกุล', email: 'อีเมล', country: 'รหัสประเทศ', phone: 'โทรศัพท์',
      ship: 'ที่อยู่จัดส่ง', shipOpt: '(ไม่บังคับ)', selectGo: 'รับที่อยู่ฝาก',
      needAmount: 'กรอกจำนวน', needName: 'กรอกชื่อเป็นภาษาอังกฤษ',
      needEmail: 'กรอกอีเมล', needPhone: 'กรอกโทรศัพท์', needCountry: 'เลือกรหัสประเทศ',
      nameLatin: 'ชื่อต้องเป็นภาษาอังกฤษเท่านั้น', emailLatin: 'อีเมลต้องเป็น ASCII/อังกฤษเท่านั้น',
      emailInvalid: 'รูปแบบอีเมลไม่ถูกต้อง', phoneDigits: 'โทรศัพท์ต้องเป็นตัวเลขเท่านั้น',
      fxFail: 'คำนวณอัตราแลกเปลี่ยนไม่ได้'
    }
  };

  var H = window.ICOPAY_CHECKOUT_HEADER;
  var q = new URLSearchParams(location.search);
  var lang = H ? H.toUiLang(q.get('lang') || q.get('langCode') || 'KO') : 'KO';
  var pack = T[lang] || T.KO;
  var headerCtx = null;
  var fieldFlags = { product: true, email: true, country: true, phone: true, ship: false };

  var state = {
    session: (q.get('session') || '').trim(),
    compId: (q.get('m') || q.get('compId') || '').trim(),
    data: null,
    asset: '',
    network: '',
    depositReady: false,
    displayCurrency: 'USD',
    quoteCurrency: 'USD',
    estimateTimer: null
  };

  if (!state.compId) {
    var parts = (location.pathname || '').split('/');
    var last = parts[parts.length - 1] || '';
    if (/^\d+$/.test(last)) state.compId = last;
  }

  function ynY(v) {
    return String(v != null ? v : 'Y').trim().toUpperCase() === 'Y';
  }

  function applyFieldFlags(ctx) {
    ctx = ctx || {};
    fieldFlags.product = ynY(ctx.urlPayProductNameUseYn != null ? ctx.urlPayProductNameUseYn : 'Y');
    fieldFlags.email = ynY(ctx.urlPayBuyerEmailUseYn != null ? ctx.urlPayBuyerEmailUseYn : 'Y');
    fieldFlags.country = ynY(ctx.urlPayBuyerCountryUseYn != null ? ctx.urlPayBuyerCountryUseYn : 'Y');
    fieldFlags.phone = ynY(ctx.urlPayBuyerPhoneUseYn != null ? ctx.urlPayBuyerPhoneUseYn : 'Y');
    fieldFlags.ship = ynY(ctx.urlPayShippingAddressUseYn != null ? ctx.urlPayShippingAddressUseYn : 'N');
    document.getElementById('startProductRow').hidden = !fieldFlags.product;
    document.getElementById('startEmailRow').hidden = !fieldFlags.email;
    document.getElementById('startCountryRow').hidden = !fieldFlags.country;
    document.getElementById('startPhoneRow').hidden = !fieldFlags.phone;
    document.getElementById('startShipBlock').hidden = !fieldFlags.ship;
  }

  function fillCountrySelect(force) {
    var sel = document.getElementById('startCountry');
    if (!sel) return;
    if (!force && sel.options.length > 1) return;
    var payLang = H ? H.toPayLang(lang) : 'KOR';
    var html = '';
    if (window.PG_JPAY_CONTACT && typeof PG_JPAY_CONTACT.buildCountryOptionsHtml === 'function') {
      html = PG_JPAY_CONTACT.buildCountryOptionsHtml(payLang, sel.value || '', pack.country);
    }
    if (html) {
      sel.innerHTML = html;
      return;
    }
    var list = ['KR', 'JP', 'US', 'CN', 'TH', 'SG', 'HK', 'GB', 'AU', 'DE'];
    sel.innerHTML = '<option value="">—</option>' + list.map(function (c) {
      return '<option value="' + c + '">' + c + '</option>';
    }).join('');
  }

  function applyUiPack() {
    pack = T[lang] || T.KO;
    document.getElementById('assetTitle').textContent = pack.asset;
    document.getElementById('networkTitle').textContent = pack.network;
    document.getElementById('depositTitle').textContent = pack.deposit;
    document.getElementById('copyBtn').textContent = 'COPY';
    document.getElementById('refreshBtn').textContent = pack.confirm;
    document.getElementById('startProductLabel').textContent = pack.startProduct;
    var dc = state.displayCurrency || 'USD';
    document.getElementById('startAmountLabel').innerHTML = pack.startAmount + ' <span class="pay-currency-hint text-muted fw-normal">(' + dc + ')</span>';
    document.getElementById('startDisplayCurrencyLabel').textContent = pack.displayCcy;
    document.getElementById('startDisplayCurrencyText').textContent = dc;
    document.getElementById('startQuoteLabel').textContent = pack.quoteEst;
    document.getElementById('startFirstName').placeholder = pack.firstName;
    document.getElementById('startLastName').placeholder = pack.lastName;
    document.getElementById('startEmail').placeholder = pack.email;
    document.getElementById('startCountryLabel').textContent = pack.country;
    document.getElementById('startPhoneLabel').textContent = pack.phone;
    document.getElementById('startPhone').placeholder = pack.phone;
    document.getElementById('startShipHeading').textContent = pack.ship + ' ' + pack.shipOpt;
    document.getElementById('startShip').placeholder = pack.ship;
    document.getElementById('startBtn').textContent = pack.startGo;
    document.getElementById('selectGoBtn').textContent = pack.selectGo;
    document.getElementById('sumAmountLabel').textContent = pack.amount;
    document.getElementById('sumRemitLabel').textContent = pack.remit;
    document.getElementById('sumOrderLabel').textContent = pack.order;
    document.getElementById('sumProductLabel').textContent = pack.product;
    document.documentElement.lang = lang === 'JP' ? 'ja' : (lang === 'CH' ? 'zh' : (lang === 'TH' ? 'th' : (lang === 'EN' ? 'en' : 'ko')));
    if (H) H.applySubtitle(headerCtx, 'crypto', lang);
    fillCountrySelect(true);
  }

  function setLang(nextUi) {
    lang = nextUi;
    var u = new URL(location.href);
    u.searchParams.set('lang', lang);
    history.replaceState(null, '', u.toString());
    applyUiPack();
    if (H) H.paintLangBar(null, lang, setLang);
  }

  function applyHeader(ctx) {
    headerCtx = ctx || headerCtx;
    applyFieldFlags(headerCtx);
    if (H) {
      H.applyLogo(headerCtx);
      H.applySubtitle(headerCtx, 'crypto', lang);
      if (H.applyFavicon) H.applyFavicon(headerCtx);
      var langBar = document.getElementById('langBar');
      if (langBar && headerCtx && String(headerCtx.urlPayLangMenuUseYn || 'Y').toUpperCase() === 'N') {
        langBar.hidden = true;
      } else if (langBar) {
        langBar.hidden = false;
        H.paintLangBar(null, lang, setLang);
      }
    }
  }

  function loadCheckoutLogo() {
    if (!state.compId) {
      applyHeader({});
      return;
    }
    fetch('/api/pay/crypto/checkout-context?m=' + encodeURIComponent(state.compId) + '&channel=crypto', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (body) {
        if (body && body.success && body.data) {
          if (body.data.displayCurrency) state.displayCurrency = String(body.data.displayCurrency).toUpperCase();
          if (body.data.quoteCurrency) state.quoteCurrency = String(body.data.quoteCurrency).toUpperCase();
          applyHeader(body.data);
          applyUiPack();
          if (!state.session && body.data.defaultProductName) {
            var pe = document.getElementById('startProduct');
            if (pe && !pe.value) pe.value = String(body.data.defaultProductName);
          }
          scheduleEstimate();
        } else applyHeader({});
      }).catch(function () { applyHeader({}); });
  }

  applyUiPack();
  if (H) H.paintLangBar(null, lang, setLang);

  function showErr(msg) {
    var el = document.getElementById('err');
    el.hidden = !msg;
    el.textContent = msg || '';
  }

  function paintQr(address) {
    var canvas = document.getElementById('custodyQr');
    if (!canvas || !address) return;
    var QR = window.QRCode;
    if (QR && typeof QR.toCanvas === 'function') {
      QR.toCanvas(canvas, address, { width: 180, margin: 2 }, function () {});
      return;
    }
    var ctx2 = canvas.getContext('2d');
    if (ctx2) {
      ctx2.fillStyle = '#fff';
      ctx2.fillRect(0, 0, 180, 180);
      ctx2.fillStyle = '#64748b';
      ctx2.font = '12px sans-serif';
      ctx2.fillText('QR', 78, 94);
    }
  }

  function paintSummary(data) {
    document.getElementById('sessionSummary').hidden = false;
    var dispCcy = data.displayCurrency || state.displayCurrency || 'USD';
    var dispAmt = data.displayAmount != null ? data.displayAmount : data.amount;
    var quoteCcy = data.quoteCurrency || 'USD';
    var quoteAmt = data.quoteAmount != null ? data.quoteAmount : data.amount;
    var asset = data.assetCode || data.currency || '';
    var remit = data.assetAmount != null ? data.assetAmount : data.remittanceAmount;
    var amountLabel = (dispAmt != null && dispAmt !== '') ? (dispCcy + ' ' + dispAmt) : '—';
    if (dispCcy !== quoteCcy && quoteAmt != null) {
      amountLabel += ' · ' + quoteCcy + ' ' + quoteAmt;
    }
    document.getElementById('amount').textContent = amountLabel;
    var remitLabel = '—';
    if (remit != null && asset) remitLabel = asset + ' ' + remit;
    else if (quoteAmt != null && asset) remitLabel = asset + ' ' + quoteAmt;
    document.getElementById('remittance').textContent = remitLabel;
    document.getElementById('order').textContent = data.orderNo || '—';
    document.getElementById('product').textContent = data.productName || '—';
  }

  function isLatinName(s) {
    return /^[A-Za-z][A-Za-z '\-]*$/.test(String(s || '').trim());
  }
  function isLatinAscii(s) {
    return /^[\x20-\x7E]+$/.test(String(s || ''));
  }
  function isValidEmail(s) {
    return /^[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}$/.test(String(s || '').trim());
  }
  function stripNonLatinName(el) {
    if (!el) return;
    var v = String(el.value || '');
    var n = v.replace(/[^A-Za-z '\-]/g, '');
    if (n !== v) el.value = n;
  }
  function stripNonAsciiEmail(el) {
    if (!el) return;
    var v = String(el.value || '');
    var n = v.replace(/[^\x20-\x7E]/g, '');
    if (n !== v) el.value = n;
  }
  function stripNonDigits(el) {
    if (!el) return;
    var v = String(el.value || '');
    var n = v.replace(/\D/g, '');
    if (n !== v) el.value = n;
  }
  function refreshEstimate() {
    var amt = String(document.getElementById('startAmount').value || '').trim();
    var quoteEl = document.getElementById('startQuoteText');
    if (!amt || !(Number(amt) > 0) || !state.compId) {
      quoteEl.textContent = '—';
      return;
    }
    fetch('/api/pay/crypto/estimate', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        compId: state.compId,
        amount: amt,
        displayCurrency: state.displayCurrency || 'USD',
        assetCode: state.asset || 'USDC'
      })
    }).then(function (r) { return r.json(); }).then(function (body) {
      if (body && body.success && body.data && body.data.quoteAmount != null) {
        quoteEl.textContent = (body.data.quoteCurrency || 'USD') + ' ' + body.data.quoteAmount;
      } else {
        quoteEl.textContent = '—';
      }
    }).catch(function () { quoteEl.textContent = '—'; });
  }
  function scheduleEstimate() {
    if (state.estimateTimer) clearTimeout(state.estimateTimer);
    state.estimateTimer = setTimeout(refreshEstimate, 280);
  }

  function applySession(data, opts) {
    opts = opts || {};
    state.data = data || {};
    applyHeader(data);
    document.getElementById('startSection').hidden = true;
    paintSummary(data);

    state.asset = data.assetCode || state.asset || '';
    state.network = data.networkCode || state.network || '';

    var catalog = data.catalog || {};
    var assets = catalog.assets || [];
    var networks = catalog.networks || [];
    var pairs = catalog.pairs || [];

    document.getElementById('assetSection').hidden = false;
    ICOPAY_CRYPTO_UI.renderGrid(document.getElementById('assetGrid'), assets, function (code) {
      state.asset = code;
      state.depositReady = false;
      document.getElementById('depositSection').hidden = true;
      filterNetworks(networks, pairs, code);
      showErr('');
      if (state.data) {
        var preview = Object.assign({}, state.data, { assetCode: code });
        fetch('/api/pay/crypto/estimate', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            compId: state.compId,
            amount: state.data.displayAmount != null ? state.data.displayAmount : state.data.amount,
            displayCurrency: state.data.displayCurrency || state.displayCurrency || 'USD',
            assetCode: code
          })
        }).then(function (r) { return r.json(); }).then(function (body) {
          if (body && body.success && body.data) {
            preview.assetAmount = body.data.assetAmount;
            preview.remittanceAmount = body.data.assetAmount;
            paintSummary(preview);
          }
        }).catch(function () { paintSummary(preview); });
      }
    });
    if (state.asset) filterNetworks(networks, pairs, state.asset);
    document.getElementById('selectGoWrap').hidden = false;

    if (opts.showDeposit && data.custodyAddress) {
      showDeposit(data.custodyAddress, data.status);
    } else {
      document.getElementById('depositSection').hidden = true;
      state.depositReady = false;
    }
  }

  function showDeposit(address, status) {
    document.getElementById('depositSection').hidden = false;
    document.getElementById('custodyAddr').textContent = address || '';
    paintQr(address);
    updateStatus(status);
    state.depositReady = true;
  }

  function filterNetworks(networks, pairs, assetCode) {
    var allowed = {};
    (pairs || []).forEach(function (p) {
      if (String(p.assetCode).toUpperCase() === String(assetCode).toUpperCase()) {
        allowed[String(p.networkCode).toUpperCase()] = true;
      }
    });
    var list = (networks || []).filter(function (n) {
      return !Object.keys(allowed).length || allowed[String(n.code).toUpperCase()];
    });
    document.getElementById('networkSection').hidden = false;
    var netEl = document.getElementById('networkGrid');
    if (ICOPAY_CRYPTO_UI.renderNetworkList) {
      ICOPAY_CRYPTO_UI.renderNetworkList(netEl, list, state.network, function (code) {
        state.network = code;
        state.depositReady = false;
        document.getElementById('depositSection').hidden = true;
        showErr('');
      });
    } else {
      ICOPAY_CRYPTO_UI.renderGrid(netEl, list, function (code) {
        state.network = code;
        state.depositReady = false;
        document.getElementById('depositSection').hidden = true;
        showErr('');
      });
    }
  }

  function updateStatus(st) {
    var box = document.getElementById('statusBox');
    box.className = 'alert small mt-3 mb-0 ' + (st === 'CONFIRMED' ? 'alert-success' : (st === 'EXPIRED' ? 'alert-warning' : 'alert-info'));
    if (st === 'CONFIRMED') box.textContent = pack.confirmed;
    else if (st === 'EXPIRED') box.textContent = pack.expired;
    else box.textContent = pack.waiting;
  }

  function loadSession() {
    if (!state.session) {
      showStartForm();
      return;
    }
    fetch('/api/pay/crypto/session?session=' + encodeURIComponent(state.session), { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (body) {
        if (body && body.success && body.data) {
          applySession(body.data, { showDeposit: !!body.data.custodyAddress });
        } else showErr((body && body.message) || pack.errSession);
      })
      .catch(function () { showErr(pack.errSession); });
  }

  function showStartForm() {
    document.getElementById('startSection').hidden = false;
    document.getElementById('sessionSummary').hidden = true;
    document.getElementById('assetSection').hidden = true;
    document.getElementById('networkSection').hidden = true;
    document.getElementById('selectGoWrap').hidden = true;
    document.getElementById('depositSection').hidden = true;
    var defProd = (headerCtx && headerCtx.defaultProductName) || q.get('productName') || q.get('item') || 'CRYPTO PAY';
    document.getElementById('startProduct').value = defProd;
    document.getElementById('startAmount').value = q.get('amount') || '';
    fillCountrySelect(true);
  }

  document.getElementById('startAmount').addEventListener('input', scheduleEstimate);
  document.getElementById('startFirstName').addEventListener('input', function () { stripNonLatinName(this); });
  document.getElementById('startLastName').addEventListener('input', function () { stripNonLatinName(this); });
  document.getElementById('startEmail').addEventListener('input', function () { stripNonAsciiEmail(this); });
  document.getElementById('startPhone').addEventListener('input', function () { stripNonDigits(this); });

  document.getElementById('startBtn').addEventListener('click', function () {
    if (!state.compId) {
      showErr(pack.errSession);
      return;
    }
    var amt = String(document.getElementById('startAmount').value || '').trim();
    if (!amt || !(Number(amt) > 0)) {
      showErr(pack.needAmount);
      return;
    }
    var fn = String(document.getElementById('startFirstName').value || '').trim();
    var ln = String(document.getElementById('startLastName').value || '').trim();
    var name = (fn + ' ' + ln).trim();
    if (!name) {
      showErr(pack.needName);
      return;
    }
    if (!isLatinName(fn) || (ln && !isLatinName(ln)) || !isLatinName(name)) {
      showErr(pack.nameLatin);
      return;
    }
    var email = String(document.getElementById('startEmail').value || '').trim();
    if (fieldFlags.email && !email) {
      showErr(pack.needEmail);
      return;
    }
    if (email) {
      if (!isLatinAscii(email)) {
        showErr(pack.emailLatin);
        return;
      }
      if (!isValidEmail(email)) {
        showErr(pack.emailInvalid);
        return;
      }
    }
    var country = String(document.getElementById('startCountry').value || '').trim().toUpperCase();
    if (fieldFlags.country && country.length !== 2) {
      showErr(pack.needCountry);
      return;
    }
    var phone = String(document.getElementById('startPhone').value || '').trim();
    if (fieldFlags.phone && !phone) {
      showErr(pack.needPhone);
      return;
    }
    if (phone && !/^[0-9]+$/.test(phone)) {
      showErr(pack.phoneDigits);
      return;
    }
    var ship = String(document.getElementById('startShip').value || '').trim();
    var product = fieldFlags.product
      ? (String(document.getElementById('startProduct').value || '').trim() || 'CRYPTO PAY')
      : 'CRYPTO PAY';
    showErr('');
    fetch('/api/pay/crypto/prepare', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        compId: state.compId,
        amount: amt,
        displayCurrency: state.displayCurrency || 'USD',
        productName: product,
        orderNo: 'URL' + Date.now(),
        lang: lang,
        buyerName: name,
        buyerEmail: email,
        buyerPhone: phone,
        buyerCountryIso2: country,
        shippingAddress: ship
      })
    }).then(function (r) { return r.json(); }).then(function (body) {
      if (!(body && body.success && body.data)) {
        showErr((body && body.message) || pack.errSession);
        return;
      }
      state.session = body.data.sessionToken || '';
      if (body.data.displayCurrency) state.displayCurrency = String(body.data.displayCurrency).toUpperCase();
      if (state.session) {
        var u = new URL(location.href);
        u.searchParams.set('session', state.session);
        if (state.compId) u.searchParams.set('m', state.compId);
        history.replaceState(null, '', u.toString());
      }
      applySession(body.data, { showDeposit: false });
    }).catch(function () { showErr(pack.errSession); });
  });

  document.getElementById('selectGoBtn').addEventListener('click', function () {
    if (!state.asset) { showErr(pack.pickAsset); return; }
    if (!state.network) { showErr(pack.pickNet); return; }
    if (!state.session) { showErr(pack.errSession); return; }
    showErr('');
    fetch('/api/pay/crypto/bind', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        session: state.session,
        assetCode: state.asset,
        networkCode: state.network
      })
    }).then(function (r) { return r.json(); }).then(function (body) {
      if (!(body && body.success && body.data)) {
        showErr((body && body.message) || pack.errSession);
        return;
      }
      state.data = body.data;
      paintSummary(body.data);
      showDeposit(body.data.custodyAddress, body.data.status);
    }).catch(function () { showErr(pack.errSession); });
  });

  document.getElementById('copyBtn').addEventListener('click', function () {
    var addr = document.getElementById('custodyAddr').textContent || '';
    if (!addr) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(addr).then(function () {
        document.getElementById('statusBox').textContent = pack.copied;
      });
    }
  });

  function pollStatus() {
    if (!state.session) return;
    fetch('/api/pay/crypto/status?session=' + encodeURIComponent(state.session), { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (body) {
        if (body && body.success && body.data) updateStatus(body.data.status);
      }).catch(function () {});
  }

  document.getElementById('refreshBtn').addEventListener('click', function () { pollStatus(); });

  setInterval(pollStatus, 8000);
  loadCheckoutLogo();
  loadSession();
})();
  </script>
</body>
</html>
