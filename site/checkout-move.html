<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>ICOPAY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/pay-inline.css?v=38" rel="stylesheet">
  <script src="/js/url-pay-public-shell.js?v=18"></script>
</head>
<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand" id="jpayBrandBlock">
        <div class="pay-brand-logo">ICOPAY</div>
      </div>
      <div class="pay-lang" role="group" aria-label="Language">
        <button type="button" data-lang="JPN">JPN</button>
        <button type="button" data-lang="KOR">KOR</button>
        <button type="button" data-lang="ENG">ENG</button>
        <button type="button" data-lang="CHN">CHN</button>
        <button type="button" data-lang="THA">THA</button>
      </div>
      <div id="moveMsg" class="mb-3" style="white-space:pre-wrap;word-break:break-word;line-height:1.6;"></div>
      <button type="button" class="btn btn-primary btn-pay w-100" id="confirmBtn">확인</button>
    </div>
  </div>
  <script>
    (function () {
      var API_BASE = (function () {
        try {
          if (location.hostname === 'api.icopay.co.kr') return location.origin.replace(/\/$/, '');
        } catch (e0) {}
        return (window.PG_API_BASE || location.origin || '').replace(/\/$/, '');
      })();
      var q = new URLSearchParams(location.search || '');
      function mapLang(raw) {
        var u = String(raw || '').trim().toUpperCase();
        if (u === 'KO' || u === 'KR' || u.indexOf('KO') === 0) return 'KOR';
        if (u === 'JA' || u === 'JP' || u.indexOf('JA') === 0 || u.indexOf('JP') === 0) return 'JPN';
        if (u === 'ZH' || u === 'CN' || u.indexOf('CH') === 0 || u.indexOf('ZH') === 0) return 'CHN';
        if (u === 'TH' || u.indexOf('TH') === 0) return 'THA';
        if (u === 'EN' || u.indexOf('EN') === 0) return 'ENG';
        if (u === 'KOR' || u === 'ENG' || u === 'JPN' || u === 'CHN' || u === 'THA') return u;
        return '';
      }
      function detectLang() {
        var fromQ = mapLang(q.get('lang') || q.get('LANG'));
        if (fromQ) return fromQ;
        try {
          var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
          for (var i = 0; i < list.length; i++) {
            var hit = mapLang(list[i]);
            if (hit) return hit;
          }
        } catch (e1) {}
        return 'KOR';
      }
      var LANG = detectLang();
      var payload = null;
      function compIdFromPath() {
        var m = String(location.pathname || '').match(/\/checkout\/([^/?#]+)/i);
        if (m && m[1]) return decodeURIComponent(m[1]);
        return (q.get('m') || q.get('compId') || '').trim();
      }
      function pickI18n(map, fallback) {
        if (!map || typeof map !== 'object') return fallback || '';
        return String(map[LANG] || map.KOR || map.ENG || fallback || '').trim();
      }
      function applyLogo() {
        var brand = document.getElementById('jpayBrandBlock');
        var logoMode = String((payload && payload.checkoutHeaderLogoMode) || 'DEFAULT').trim().toUpperCase();
        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyCheckoutHeaderLogo) {
          PG_URL_PAY_SHELL.applyCheckoutHeaderLogo(payload, {
            brandBlockId: 'jpayBrandBlock',
            logoWrapSelector: '.pay-brand-logo'
          });
        }
        if (brand) {
          brand.style.display = (logoMode === 'DISABLED') ? 'none' : '';
        }
      }
      function render() {
        if (!payload) return;
        applyLogo();
        var msgEl = document.getElementById('moveMsg');
        var btn = document.getElementById('confirmBtn');
        var text = pickI18n(payload.messageI18n, payload.message);
        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.setLinkedText) {
          PG_URL_PAY_SHELL.setLinkedText(msgEl, text);
        } else if (msgEl) {
          msgEl.textContent = text;
        }
        if (btn) btn.textContent = pickI18n(payload.confirmI18n, '확인');
        document.querySelectorAll('.pay-lang [data-lang]').forEach(function (b) {
          b.classList.toggle('active', String(b.getAttribute('data-lang') || '').toUpperCase() === LANG);
        });
      }
      function go() {
        if (!payload || !payload.targetUrl) return;
        window.location.href = payload.targetUrl;
      }
      document.querySelectorAll('.pay-lang [data-lang]').forEach(function (b) {
        b.addEventListener('click', function () {
          LANG = mapLang(b.getAttribute('data-lang')) || LANG;
          render();
        });
      });
      var btn = document.getElementById('confirmBtn');
      if (btn) btn.addEventListener('click', go);
      var cid = compIdFromPath();
      if (!cid) return;
      fetch(API_BASE + '/api/pay/url/checkout-move?compId=' + encodeURIComponent(cid), { credentials: 'omit' })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          payload = (j && j.data) ? j.data : null;
          if (!payload || payload.active !== true || !payload.targetUrl) return;
          if (String(payload.mode || '').toUpperCase() === 'AUTO') {
            go();
            return;
          }
          render();
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
