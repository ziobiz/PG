  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand" id="eximbayBrandBlock">
        <div class="pay-brand-logo">ICOPAY</div>
        <div class="pay-brand-sub" data-i18n="brandSub">Global Payment</div>
      </div>
      <div class="pay-lang" role="group" aria-label="Language" data-i18n-aria="langGroup">
        <button type="button" data-lang="JPN">JPN</button>
        <button type="button" data-lang="KOR">KOR</button>
        <button type="button" data-lang="ENG">ENG</button>
        <button type="button" data-lang="CHN">CHN</button>
        <button type="button" data-lang="THA">THA</button>
      </div>
      <div id="configError" class="alert alert-warning pay-alert-config" style="display:none;"></div>
      <div id="payResult" class="pay-result" style="display:none;"></div>
      <form id="eximbayForm" autocomplete="off">
        <input type="hidden" id="compIdHidden" name="compId">
        <input type="hidden" id="orderNo" name="orderNo">
        <input type="hidden" id="paymentMethod" name="paymentMethod" value="CARD">
        <div class="pay-form-grid mb-3">
          <div class="pay-row pay-row-static">
            <div class="pay-row-label"><span data-i18n="merchant">Merchant</span></div>
            <div class="pay-row-value"><span id="merchantNameDisplay">—</span></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="item"><span data-i18n="item">Item</span></label>
            <div class="pay-row-value"><input type="text" class="form-control form-control-sm pay-input-round" id="item" required></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="amount"><span data-i18n="amount">Amount</span> <span class="pay-currency-hint text-muted fw-normal" id="payAmountCurrencyHint">(USD)</span></label>
            <div class="pay-row-value">
              <input type="number" class="form-control form-control-sm pay-input-round" id="amount" required min="0.01" step="0.01">
            </div>
          </div>
        </div>
        <div class="pay-label mb-1" id="eximbayMethodLabel"><span data-i18n="payMethod">Payment method</span></div>
        <div class="eximbay-method-grid mb-3" id="eximbayMethodGrid" role="group" aria-label="Payment method"></div>
        <div id="eximbayCardInline" class="d-none">
          <div class="pay-label mb-1"><span data-i18n="card">Card</span></div>
          <div class="mb-2" id="payCardBrandRow">
            <select class="form-select form-select-sm pay-input-round" id="payCardBrandSelect" data-i18n-aria="cardAutoDetectOption" aria-label="Card auto detect">
              <option value="AUTO" data-i18n="cardAutoDetectOption">Card auto detect</option>
              <option value="VISA">Visa</option>
              <option value="MASTERCARD">Mastercard</option>
              <option value="JCB">JCB</option>
              <option value="UNIONPAY">UnionPay</option>
              <option value="AMEX">American Express</option>
            </select>
          </div>
          <div id="payCardPolicyAlert" class="alert alert-danger py-2 small d-none mb-2" role="alert"></div>
          <div class="row g-2 mb-2">
            <div class="col-12"><input type="text" class="form-control form-control-sm pay-input-round" id="payCardno" inputmode="numeric" autocomplete="cc-number" data-i18n-placeholder="cardNo"></div>
          </div>
          <div class="row g-2 mb-2 pay-expiry-row" id="payCardExpiryRow">
            <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round" id="payCardmonth" maxlength="2" data-i18n-placeholder="mm"></div>
            <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round" id="payCardyear" maxlength="4" data-i18n-placeholder="yyyy"></div>
            <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round" id="payCardcvv" maxlength="4" data-i18n-placeholder="cvv"></div>
          </div>
        </div>
        <div class="row g-2 mb-2" id="nameRow">
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round" id="payFirstname" data-i18n-placeholder="firstName" required></div>
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round" id="payLastname" data-i18n-placeholder="lastName" required></div>
        </div>
        <div class="row g-2 mb-2" id="contactRow">
          <div class="col-12"><input type="email" class="form-control form-control-sm pay-input-round" id="payEmailAddress" data-i18n-placeholder="email" required></div>
          <div class="col-12"><input type="tel" class="form-control form-control-sm pay-input-round" id="payTelephone" data-i18n-placeholder="phoneOptional" inputmode="tel" autocomplete="tel"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-pay w-100" id="submitBtn" data-i18n="pay">Pay</button>
        <p class="small text-muted mt-2 mb-0 text-center" id="eximbayHostedNote" data-i18n="hostedNote"></p>
        <p class="small text-primary mt-1 mb-0 text-center" id="eximbaySandboxHint" style="display:none;"></p>
      </form>
    </div>
  </div>

        if (s.indexOf('zh') === 0) return 'CHN';

      function resolveApiErrorMessage(res) {
        res = res || {};
        var L = apiLangCode();
        if (res.messages) {
          if (res.messages[L]) return res.messages[L];
          var alt = { KOR: 'KO', ENG: 'EN', JPN: 'JP', CHN: 'CH', THA: 'TH' };
          if (alt[L] && res.messages[alt[L]]) return res.messages[alt[L]];
          if (res.messages.ENG) return res.messages.ENG;
        }
        var code = res.errorCode ? String(res.errorCode).trim() : '';
        if (code === 'ORG_DISABLED' || code === 'WEB_PAYMENT_DISABLED') return res.message || t('orgDisabled');
        if (code === 'EXIMBAY_PG_MISSING' || code === 'URL_PAYMENT_PG_MISSING' || code === 'URL_PAY_SALE_NOT_REGISTERED') return t('pgMissing');

        if (c === 'ZH' || c === 'CN') c = 'CHN';
        if (c === 'TH') c = 'THA';

      var checkoutCtx = null;

      function renderMethodButtons() {
        var grid = document.getElementById('eximbayMethodGrid');
        if (!grid) return;
        var selected = (document.getElementById('paymentMethod').value || 'CARD').toUpperCase();
        grid.innerHTML = '';
        methodList.forEach(function (m) {
          var key = String(m.key || '').toUpperCase();
          if (!key) return;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'eximbay-method-btn' + (key === selected ? ' active' : '');
          btn.setAttribute('data-method', key);
          if (window.ICOPAY_PAY_METHOD_UI && ICOPAY_PAY_METHOD_UI.fillButton) {
            ICOPAY_PAY_METHOD_UI.fillButton(btn, key, methodLabel(key));
          } else {
            btn.textContent = methodLabel(key);
          }
          btn.addEventListener('click', function () {
            document.getElementById('paymentMethod').value = key;
            renderMethodButtons();
            applySandboxHint();
          });
          grid.appendChild(btn);

      function getCompId() {
        try {
          var p = new URLSearchParams(location.search);
          var q = (p.get('m') || p.get('compId') || p.get('merchant') || '').trim();
          if (q) return q;
        } catch (e0) { /* ignore */ }
        try {
          var path = (location.pathname || '').replace(/\/+$/, '');
          var seg = path.split('/').filter(Boolean);
          var roots = {
            checkout: 1, 'checkout-subscribe': 1, pay: 1, 'pay-repay': 1,
            'eximbay-pay': 1, 'eximbay-subscribe': 1
          };
          if (seg.length >= 2 && roots[String(seg[0]).toLowerCase()] && String(seg[1]).indexOf('.') < 0) {
            return String(seg[1]).trim();
          }
        } catch (e1) { /* ignore */ }
        return '';
      }
      function apiUrl(path, qs) { return API_BASE + path + (qs ? ('?' + qs) : ''); }
      function fetchJson(url) {
        return fetch(url, { credentials: 'omit', cache: 'no-store' }).then(function (r) {
          return r.text().then(function (text) {
            if (!r.ok) throw new Error(text || ('HTTP ' + r.status));
            return text ? JSON.parse(text) : {};
          });
        });
      }
      function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

      function showErr(msg) {
        var el = document.getElementById('configError');
        el.style.display = 'block'; el.textContent = msg;
        var f = document.getElementById('eximbayForm'); if (f) f.style.display = 'none';
      }
      function showFinished(ok, msg, orderNo) {
        var f = document.getElementById('eximbayForm'); if (f) f.style.display = 'none';
        var el = document.getElementById('payResult');
        el.style.display = 'block';
        el.className = ok ? 'ok pay-result-final' : 'err pay-result-final';
        el.innerHTML = '<div class="pay-result-title">' + (ok ? t('payComplete') : t('payFailed')) + '</div><p>' + escHtml(msg) + '</p>';
      }

      function buildOrderNo(compId) {
        var ts = String(Date.now());
        var c = String(compId || 'X').replace(/[^0-9A-Za-z]/g, '');
        if (c.length > 6) c = c.slice(0, 6);
        var raw = 'EXB' + c + ts;
        return raw.length > 40 ? raw.slice(0, 40) : raw;
      }

      var sessionPayload = null;

      function lockField(id, val) {
        var el = document.getElementById(id);
        if (!el) return;
        if (val != null && String(val).trim() !== '') { el.value = String(val).trim(); }
        el.readOnly = true;
      }

      function applyBillingPrefill(prefill) {
        if (!prefill) return;
        var em = document.getElementById('payEmailAddress');
        if (em && !em.value && prefill.email) { em.value = String(prefill.email).trim(); }
        var ph = document.getElementById('payTelephone');
        if (ph && !ph.value && prefill.phone) { ph.value = String(prefill.phone).trim(); }
      }

      /* 가맹 통합 API 진입(entry=merchant_api): prepare 세션 토큰으로 주문 정보를 잠근다. */
      function validateSession() {
        if (!PAY_ENTRY_MERCHANT_API) return Promise.resolve();
        var tok = '';
        try { tok = (new URLSearchParams(location.search).get('session') || '').trim(); } catch (e) {}
        if (!tok) return Promise.reject(new Error(t('errInvalidSession')));
        return fetchJson(apiUrl('/api/middleware/v1/merchant/checkout/session', 'token=' + encodeURIComponent(tok)))
          .then(function (res) {
            if (!res.success || !res.data) throw new Error(t('errInvalidSession'));
            sessionPayload = res.data;
            var d = res.data;
            lockField('orderNo', d.orderNo);
            lockField('amount', d.amount);
            lockField('item', d.productName);
            if (d.currency) {
              var h0 = document.getElementById('payAmountCurrencyHint');
              if (h0) h0.textContent = '(' + String(d.currency).toUpperCase() + ')';
            }
            applyBillingPrefill(d.buyerPrefill || d.prefill);
            applyI18n();
          });
      }

      function assertSessionMatchesForm() {
        if (!sessionPayload) return true;
        var on = (document.getElementById('orderNo').value || '').trim();
        var amt = String(document.getElementById('amount').value || '').replace(/,/g, '').trim();
        var spOn = sessionPayload.orderNo != null ? String(sessionPayload.orderNo).trim() : '';
        var spAmt = sessionPayload.amount != null ? String(sessionPayload.amount).replace(/,/g, '').trim() : '';
        if (spOn && on && spOn !== on) return false;
        if (spAmt && amt && parseFloat(spAmt) !== parseFloat(amt)) return false;
        return true;
      }

      function applyQueryPrefills() {
        try {
          var p = new URLSearchParams(location.search);
          var item = p.get('item') || p.get('desc');
          if (item) { var it = document.getElementById('item'); if (it) { it.value = item.trim(); it.readOnly = true; } }
          var amt = p.get('amount') || p.get('amt');
          if (amt) { var am = document.getElementById('amount'); if (am) { am.value = amt.trim(); am.readOnly = true; } }
          var ord = p.get('orderNo') || p.get('OrderNo');
          if (ord) document.getElementById('orderNo').value = ord.trim();
          var email = p.get('email') || p.get('payEmailAddress');
          if (email) { var em = document.getElementById('payEmailAddress'); if (em) { em.value = email.trim(); em.readOnly = true; } }
          var cur = p.get('currency') || p.get('cur');
          if (cur) { var h = document.getElementById('payAmountCurrencyHint'); if (h) h.textContent = '(' + cur.trim().toUpperCase() + ')'; }
        } catch (e) {}
      }

      function applyCheckoutContext(ctx) {
        checkoutCtx = ctx;
        window.__payUrlCardCopy = ctx.urlPayCardCopy || null;
        if (Array.isArray(ctx.eximbayPaymentMethods) && ctx.eximbayPaymentMethods.length) {
          methodList = ctx.eximbayPaymentMethods;
        }
        setInlineCardUi(ctx.eximbayInlineCardUi === true);
        if (inlineCardUi && window.PG_JPAY_CARD_EXPIRY) {
          var expiryMount = document.getElementById('payCardExpiryRow');
          cardExpiryCtrl = PG_JPAY_CARD_EXPIRY.init(expiryMount, ctx, t);
        }
        if (inlineCardUi && window.PG_CARD_PAY_POLICY && ctx.cardPayPolicy) {
          cardPolicyCtrl = PG_CARD_PAY_POLICY.init({
            policy: ctx.cardPayPolicy,
            panInput: document.getElementById('payCardno'),
            brandSelect: document.getElementById('payCardBrandSelect'),
            alertEl: document.getElementById('payCardPolicyAlert'),
            cvvInput: document.getElementById('payCardcvv'),
            lang: LANG,
            autoDetectLabel: t('cardAutoDetectOption'),
            onLangChange: function () { return LANG; },
            getCompId: getCompId,
            apiBase: API_BASE,
            checkUrl: '/api/pay/url/card-policy-check',
            postJson: function (url, bodyStr) {
              return fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: bodyStr
              }).then(function (r) { return r.json(); });
            }
          });
        } else if (inlineCardUi && window.PG_CARD_PAY_POLICY && PG_CARD_PAY_POLICY.attachPanFormatter) {
          var panOnly = document.getElementById('payCardno');
          var brandSel = document.getElementById('payCardBrandSelect');

            PG_CARD_PAY_POLICY.attachPanFormatter(panOnly, function () {
              return brandSel && brandSel.value ? brandSel.value : 'AUTO';
            });
          }
        }
        if (ctx.merchantName) document.getElementById('merchantNameDisplay').textContent = ctx.merchantName;
        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyCheckoutHeaderLogo) {
          PG_URL_PAY_SHELL.applyCheckoutHeaderLogo(ctx, { brandBlockId: 'eximbayBrandBlock', logoWrapSelector: '.pay-brand-logo', t: t });
        }
        var itemEl = document.getElementById('item');
        if (itemEl && !itemEl.readOnly && ctx.defaultProductName) itemEl.value = String(ctx.defaultProductName).trim();

        }

          PG_URL_PAY_SHELL.applyCardCopyPresentation({ lang: LANG, cardCopy: window.__payUrlCardCopy, t: t, skipBrandSub: true });

      /* ============ 결과 복귀(return_url) 처리 ============ */
      function isReturnMode() {
        try { return String(new URLSearchParams(location.search).get('eximbayReturn') || '') === '1'; } catch (e) { return false; }
      }
      function handleReturnResult() {
        var f = document.getElementById('eximbayForm'); if (f) f.style.display = 'none';
        applyI18n();
        var p = new URLSearchParams(location.search);
        var rescode = (p.get('rescode') || '').trim();
        var resmsg = (p.get('resmsg') || '').trim();
        var orderId = (p.get('order_id') || p.get('orderNo') || '').trim();
        var ok = rescode === '0000';
        var msg = ok ? t('paid') : (localizeEximbayMsg(resmsg) || t('payFailed'));
        showFinished(ok, msg + (orderId ? (' (' + escHtml(orderId) + ')') : ''), orderId);
      }

      function openPayWindow() {
        var w = 500, h = 640;
        var left = Math.round((window.screenLeft || 0) + ((document.documentElement.clientWidth || 800) / 2) - (w / 2));
        var top = Math.round((screen.availHeight || 800) / 2 - h / 2);
        try {
          return window.open('about:blank', 'icopayPayWin', 'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top + ',toolbars=no,resizable=yes,scrollbars=yes,titlebar=yes,status=no');
        } catch (e0) { return null; }
      }
      function closePayWindow(win) {
        try { if (win && !win.closed) win.close(); } catch (e1) {}
      }
      function launchHostedPay(d, btn, orderNo, payWin) {
        var action = String(d.hostedPayUrl || '').trim();
        if (!action) return false;
        var low = action.toLowerCase();
        if (low.indexOf('icopay.co.kr') >= 0) return false;
        var fields = d.hostedPayFields || {};
        var dt = String(d.hostedDisplayType || d.displayType || 'P').toUpperCase();
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = action;
        form.acceptCharset = 'UTF-8';
        form.style.display = 'none';
        Object.keys(fields).forEach(function (k) {
          var inp = document.createElement('input');
          inp.type = 'hidden';
          inp.name = k;
          inp.value = String(fields[k] == null ? '' : fields[k]);
          form.appendChild(inp);
        });
        document.body.appendChild(form);
        if (dt === 'P') {
          if (!payWin || payWin.closed) payWin = openPayWindow();
          if (!payWin) {
            showFinished(false, t('popupBlocked'), orderNo);
            payGuardFail(btn);
            return true;
          }
          form.target = 'icopayPayWin';
        } else {
          closePayWindow(payWin);
          form.target = '_self';
        }
        form.submit();
        payGuardUnlock(btn);
        return true;
      }

      function payGuardUnlock(btn) {
        var g = window.PG_PAY_SUBMIT_GUARD;
        if (g) g.unlockForRetry({ button: btn }); else if (btn) btn.disabled = false;
      }
      function payGuardFail(btn) {
        var g = window.PG_PAY_SUBMIT_GUARD;
        if (g) g.unlockAfterFailure({ button: btn }); else if (btn) btn.disabled = false;
      }

      function boot() {
        applyI18n();
        if (window.PG_URL_PAY_SHELL) PG_URL_PAY_SHELL.wireLanguageButtons(function () { return LANG; }, setLang);
        if (isReturnMode()) { handleReturnResult(); return; }
        var compId = getCompId();
        if (!compId) { showErr(t('errMerchant')); return; }
        document.getElementById('compIdHidden').value = compId;
        applyQueryPrefills();
        validateSession()
          .then(function () {
            return fetchJson(apiUrl('/api/pay/url/checkout-context',
              'compId=' + encodeURIComponent(compId) + (PAY_ENTRY_MERCHANT_API ? '&entry=merchant_api' : '')));
          })
          .then(function (ctxRes) {
            if (!ctxRes.success || !ctxRes.data) {
              var code = ctxRes.errorCode ? String(ctxRes.errorCode).trim() : '';
              if (code === 'ORG_DISABLED' || code === 'WEB_PAYMENT_DISABLED') throw new Error(ctxRes.message || t('configErr'));
              if (code === 'URL_PAYMENT_PG_MISSING') throw new Error(t('pgMissing'));
              throw new Error(localizeEximbayMsg(ctxRes.message || '') || t('configErr'));
            }
            applyCheckoutContext(ctxRes.data);
          })
          .catch(function (e) { showErr(e.message || t('errLoad')); });
      }

      document.getElementById('eximbayForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        var guard = window.PG_PAY_SUBMIT_GUARD;
        if (guard) { if (!guard.tryLock({ lang: LANG, t: t, button: btn, onWarn: function (m) { showErr(m); } })) return; }
        else { btn.disabled = true; }

        var compId = document.getElementById('compIdHidden').value.trim();
        var fn = document.getElementById('payFirstname').value.trim();
        var ln = document.getElementById('payLastname').value.trim();
        if (!fn || !ln) { showErr(t('errName')); payGuardUnlock(btn); return; }
        var email = document.getElementById('payEmailAddress').value.trim();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showErr(t('errEmailFormat')); payGuardUnlock(btn); return; }
        var amtStr = String(document.getElementById('amount').value || '').replace(/,/g, '').trim();
        if (!(parseFloat(amtStr) > 0)) { showErr(t('needAmount')); payGuardUnlock(btn); return; }
        var cur = (checkoutCtx && checkoutCtx.checkoutCurrencyCode) ? String(checkoutCtx.checkoutCurrencyCode).trim().toUpperCase() : 'USD';
        var methodNow = (document.getElementById('paymentMethod').value || 'CARD').toUpperCase();
        if (methodNow === 'PAYPAY' || methodNow === 'JPCONVBANK') {
          var sbPay = checkoutCtx && checkoutCtx.eximbaySandbox === true;
          if (!sbPay && cur !== 'JPY') { showErr(t('errPaypayJpy')); payGuardUnlock(btn); return; }
        }
        if (!assertSessionMatchesForm()) { showErr(t('errInvalidSession')); payGuardUnlock(btn); return; }

        var panRaw = '';
        var mmRaw = '';
        var yyRaw = '';
        var cvvRaw = '';
        if (inlineCardUi) {
          panRaw = window.PG_CARD_PAY_POLICY
            ? PG_CARD_PAY_POLICY.digitsOnly(document.getElementById('payCardno').value)
            : String(document.getElementById('payCardno').value || '').replace(/\D/g, '');
          if (cardExpiryCtrl && cardExpiryCtrl.getMonth) {
            mmRaw = cardExpiryCtrl.getMonth() || '';
            yyRaw = cardExpiryCtrl.getYear4 ? (cardExpiryCtrl.getYear4() || '') : '';
          } else {
            mmRaw = String(document.getElementById('payCardmonth').value || '').replace(/\D/g, '');
            yyRaw = String(document.getElementById('payCardyear').value || '').replace(/\D/g, '');
          }
          cvvRaw = String(document.getElementById('payCardcvv').value || '').replace(/\D/g, '');
          if (panRaw.length < 13 || panRaw.length > 19 || !/^\d{3,4}$/.test(cvvRaw) || mmRaw.length < 1) {
            showErr(t('errCard')); payGuardUnlock(btn); return;
          }
          if (cardPolicyCtrl && typeof cardPolicyCtrl.validateFinal === 'function') {
            var cardChk = cardPolicyCtrl.validateFinal();
            if (!cardChk.valid) {
              showErr(cardChk.message || t('errCard'));
              payGuardUnlock(btn);
              return;
            }
          } else if (cardPolicyCtrl && cardPolicyCtrl.validate) {
            var cardLive = cardPolicyCtrl.validate();
            if (cardLive && cardLive.valid === false) {
              showErr(cardLive.message || t('errCard'));
              payGuardUnlock(btn);
              return;
            }
          }
        }

        var ordEl = document.getElementById('orderNo');
        if (!String(ordEl.value || '').trim()) ordEl.value = buildOrderNo(compId);

        var body = {
          compId: compId,
          orderNo: ordEl.value.trim(),
          amount: amtStr,
          currency: cur,
          item: document.getElementById('item').value.trim(),
          paymentMethod: (document.getElementById('paymentMethod').value || 'CARD').toUpperCase(),
          buyerName: (fn + ' ' + ln).trim(),
          payFirstname: fn,
          payLastname: ln,
          payEmailAddress: email,
          payTelephone: document.getElementById('payTelephone').value.trim(),
          langCode: LANG,
          system: 'icopay',
          txnOrigin: PAY_ENTRY_CHATBOT ? 'CHATBOT' : (PAY_ENTRY_MERCHANT_API ? 'MERCHANT_API' : 'URL')
        };
        if (inlineCardUi) {
          body.payCardno = panRaw;
          body.payCardmonth = mmRaw;
          body.payCardyear = yyRaw;
          body.payCardcvv = cvvRaw;
          body.paymentMethod = 'CARD';
        }
        var cfgErr = document.getElementById('configError');
        if (cfgErr) { cfgErr.style.display = 'none'; }
        var payWin = openPayWindow();
        if (!payWin) { showFinished(false, t('popupBlocked'), body.orderNo); payGuardFail(btn); return; }
        fetch(API_BASE + '/api/pay/url/sale', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (!res.success) {
            closePayWindow(payWin);
            showFinished(false, resolveApiErrorMessage(res), body.orderNo); payGuardFail(btn); return;
          }
          var d = res.data || {};
          if (launchHostedPay(d, btn, body.orderNo, payWin)) return;
          closePayWindow(payWin);
          showFinished(false, t('sdkLoadFail'), body.orderNo);
          payGuardFail(btn);
        }).catch(function (err) {
          closePayWindow(payWin);
          showFinished(false, (err && err.message) || t('networkErr'), body.orderNo);
          payGuardFail(btn);
        });
      });

      boot();
    })();
  </script>
</body>
</html>
