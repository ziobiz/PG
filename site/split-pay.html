<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ICOPAY Split Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/pay-inline.css?v=1" rel="stylesheet">
</head>
<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand mb-3" id="splitPayBrandBlock">
        <img id="splitPayBrandLogoImg" class="pay-brand-logo-img d-none" src="" alt="">
        <div id="splitPayBrandTextWrap">
          <div class="pay-brand-logo" data-i18n="brand">ICOPAY</div>
          <div class="pay-brand-sub" data-i18n="subtitle">Split payment</div>
        </div>
      </div>
      <div class="pay-lang mb-3" role="group">
        <button type="button" data-lang="JPN">JPN</button>
        <button type="button" data-lang="KOR">KOR</button>
        <button type="button" data-lang="ENG">ENG</button>
        <button type="button" data-lang="CHN">CHN</button>
        <button type="button" data-lang="THA">THA</button>
      </div>
      <div id="msg" class="alert d-none"></div>
      <div id="summary" class="pay-form-grid d-none mb-3">
        <div class="pay-row pay-row-static"><div class="pay-row-label" data-i18n="contractNo">Contract</div><div class="pay-row-value" id="vContractNo"></div></div>
        <div class="pay-row pay-row-static"><div class="pay-row-label" data-i18n="orderNo">Order No</div><div class="pay-row-value" id="vOrderNo"></div></div>
        <div class="pay-row pay-row-static"><div class="pay-row-label" data-i18n="totalAmount">Total</div><div class="pay-row-value" id="vTotal"></div></div>
        <div class="pay-row pay-row-static"><div class="pay-row-label" data-i18n="installments">Installments</div><div class="pay-row-value" id="vInstallments"></div></div>
        <div class="pay-row pay-row-static"><div class="pay-row-label" data-i18n="current">This payment</div><div class="pay-row-value" id="vCurrent"></div></div>
        <div class="pay-row pay-row-static"><div class="pay-row-label" data-i18n="remaining">Remaining</div><div class="pay-row-value" id="vRemaining"></div></div>
        <div class="pay-row pay-row-static"><div class="pay-row-label" data-i18n="next">Next</div><div class="pay-row-value" id="vNext"></div></div>
      </div>
      <a id="goPayBtn" class="btn btn-primary w-100 d-none" href="#" data-i18n="goPay">Proceed to payment</a>
    </div>
  </div>
  <script src="js/checkout-header-subtitle-presets.js?v=1"></script>
  <script src="js/url-pay-public-shell.js?v=13"></script>
  <script src="js/split-pay-page.js?v=2"></script>
</body>
</html>
