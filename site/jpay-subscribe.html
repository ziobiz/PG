<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>ICOPAY Easy Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/pay-inline.css?v=32" rel="stylesheet">
  <script src="js/pg-pay-submit-guard.js?v=1"></script>
  <script src="js/url-pay-input-mode.js?v=4"></script>
  <script src="js/url-pay-public-shell.js?v=11"></script>
  <script src="js/jpay-pay-msg-i18n.js?v=1"></script>
  <script>
    (function () {
      try {
        var q = new URLSearchParams(window.location.search || '');
        if (q.get('embed') === '1' || q.get('embed') === 'true') {
          document.documentElement.setAttribute('data-pay-embed', '1');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand" id="jpayBrandBlock">
        <div class="pay-brand-logo">ICOPAY</div>
        <div class="pay-brand-sub">3DS Secure Payment</div>
      </div>
      <div id="configError" class="alert alert-warning pay-alert-config" style="display:none;"></div>
      <div id="payResult" class="pay-result" style="display:none;"></div>
      <form id="jpayForm" autocomplete="off">
        <input type="hidden" id="compIdHidden" name="compId">
        <input type="hidden" id="orderNo" name="orderNo">
        <div class="pay-form-grid mb-3">
          <div class="pay-row pay-row-static">
            <div class="pay-row-label">Merchant</div>
            <div class="pay-row-value"><span id="merchantNameDisplay">—</span></div>
          </div>
          <div class="pay-row pay-row-static" id="planInfoRow" style="display:none;">
            <div class="pay-row-label">Plan</div>
            <div class="pay-row-value"><span id="planInfoDisplay">—</span></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="item">Item</label>
            <div class="pay-row-value"><input type="text" class="form-control form-control-sm pay-input-round" id="item" required></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="amount">Amount</label>
            <div class="pay-row-value">
              <input type="number" class="form-control form-control-sm pay-input-round" id="amount" required min="0.01" step="0.01">
              <span class="small text-muted ms-1" id="currencyHint">JPY</span>
            </div>
          </div>
        </div>
        <div class="pay-label mb-2">Card</div>
        <div class="row g-2 mb-2">
          <div class="col-12"><input type="text" class="form-control form-control-sm pay-input-round" id="payCardno" inputmode="numeric" autocomplete="cc-number" placeholder="Card number" required></div>
          <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round" id="payCardmonth" maxlength="2" placeholder="MM" required></div>
          <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round" id="payCardyear" maxlength="4" placeholder="YYYY" required></div>
          <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round" id="payCardcvv" maxlength="4" placeholder="CVV" required></div>
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round" id="payFirstname" placeholder="First name" required></div>
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round" id="payLastname" placeholder="Last name" required></div>
          <div class="col-12"><input type="email" class="form-control form-control-sm pay-input-round" id="payEmailAddress" placeholder="Email" required></div>
        </div>
        <div class="pay-label mb-2" id="billingLabel">Shipping address</div>
        <div class="row g-2 mb-3">
          <div class="col-6"><input type="tel" class="form-control form-control-sm pay-input-round" id="payTelephone" placeholder="Phone" required></div>
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round" id="payCountryIsoCode2" maxlength="2" placeholder="US" required style="text-transform:uppercase"></div>
          <div class="col-12"><input type="text" class="form-control form-control-sm pay-input-round" id="payStreetAddress1" placeholder="Address" required></div>
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round" id="payCity" placeholder="City" required></div>
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round" id="payPostcode" placeholder="Postcode" required></div>
        </div>
        <button type="submit" class="btn btn-primary btn-pay w-100" id="submitBtn">Subscribe</button>
      </form>
    </div>
  </div>
  <script>
    (function () {
      var PAY_ENTRY_MERCHANT_API = (function () {
        try { return String(new URLSearchParams(location.search).get('entry') || '').toLowerCase() === 'merchant_api'; } catch (e) { return false; }
      })();
      var PAY_ENTRY_CHATBOT = false;
      var PAY_EMBED_MODE = (function () {
        try { var q = new URLSearchParams(location.search); return q.get('embed') === '1' || q.get('embed') === 'true'; } catch (e) { return false; }
      })();
      var API_BASE = (function () {
        try {
          if (location.hostname === 'api.icopay.co.kr') return location.origin.replace(/\/$/, '');
        } catch (e0) {}
        return (window.PG_API_BASE || location.origin || '').replace(/\/$/, '');
      })();

      function mapBrowserLocaleToUrlPayLang(tag) {
        if (!tag) return null;
        var s = String(tag).trim().toLowerCase();
        if (s.indexOf('ko') === 0) return 'KOR';
        if (s.indexOf('ja') === 0) return 'JPN';
        if (s.indexOf('zh') === 0) return 'CHN';
        if (s.indexOf('th') === 0) return 'THA';
        if (s.indexOf('en') === 0) return 'ENG';
        return null;
      }
      function resolveInitialUrlPayLang() {
        try {
          var p = new URLSearchParams(window.location.search);
          var raw = (p.get('lang') || p.get('LANG') || '').trim().toUpperCase();
          if (raw === 'KO' || raw === 'KR') raw = 'KOR';
          if (raw === 'JA' || raw === 'JP') raw = 'JPN';
          if (raw === 'ZH' || raw === 'CN') raw = 'CHN';
          if (raw === 'TH') raw = 'THA';
          if (raw === 'EN') raw = 'ENG';
          if (raw === 'KOR' || raw === 'ENG' || raw === 'CHN' || raw === 'JPN' || raw === 'THA') return raw;
        } catch (eQ) { /* ignore */ }
        var list = [];
        try {
          if (navigator.languages && navigator.languages.length) {
            for (var li = 0; li < navigator.languages.length; li++) list.push(navigator.languages[li]);
          }
        } catch (e1) { /* ignore */ }
        try { if (navigator.language) list.push(navigator.language); } catch (e2) { /* ignore */ }
        for (var i = 0; i < list.length; i++) {
          var hit = mapBrowserLocaleToUrlPayLang(list[i]);
          if (hit) return hit;
        }
        return 'ENG';
      }
      var LANG = resolveInitialUrlPayLang();
      var I18N = {
        KOR: {
          title: 'ICOPAY 간편결제', brandSub3ds: '3DS 안전 결제', merchant: '가맹점', item: '상품명', amount: '금액', card: '카드',
          cardNo: '카드번호', firstName: '이름', lastName: '성', email: '이메일', shipping: '배송 주소',
          phone: '전화번호', country: '국가(2자)', address: '주소', city: '도시', postcode: '우편번호', pay: '구독하기',
          errMerchant: '가맹점 코드(m)가 필요합니다.', errLoad: '구독 화면을 불러오지 못했습니다.',
          errInvalidSession: '세션이 유효하지 않거나 만료되었습니다.', errSessionMismatch: '세션과 주문 정보가 일치하지 않습니다.',
          payComplete: '구독 완료', payFailed: '구독 실패', paid: '구독이 등록되었습니다.', networkErr: '네트워크 오류',
          payInProgress: '이미 결제 중입니다. 잠시만 기다려 주세요.',
          jpay3dsUrlMissing: '3DS 인증 URL을 받지 못했습니다. J-Pay 가맹 포털·채널 승인 상태를 확인하세요.',
          jpayUnknownResponse: 'J-Pay 응답을 해석하지 못했습니다. MID·ApiKey·pay_index URL을 확인하세요.',
          mm: 'MM', yyyy: 'YYYY', cvv: 'CVV'
        },
        ENG: {
          title: 'ICOPAY Easy Payment', brandSub3ds: '3DS Secure Payment', merchant: 'Merchant', item: 'Item', amount: 'Amount', card: 'Card',
          cardNo: 'Card number', firstName: 'First name', lastName: 'Last name', email: 'Email', shipping: 'Shipping address',
          phone: 'Phone', country: 'Country (ISO2)', address: 'Address', city: 'City', postcode: 'Postcode', pay: 'Subscribe',
          errMerchant: 'Merchant code (m) is required.', errLoad: 'Failed to load subscription checkout.',
          errInvalidSession: 'Session is invalid or expired.', errSessionMismatch: 'Session does not match order details.',
          payComplete: 'Subscription complete', payFailed: 'Subscription failed', paid: 'Subscribed.', networkErr: 'Network error',
          payInProgress: 'Payment is already in progress. Please wait.',
          jpay3dsUrlMissing: '3DS redirect URL was not returned. Check J-Pay merchant portal and channel approval.',
          jpayUnknownResponse: 'Could not interpret J-Pay response. Verify MID, ApiKey, and pay_index URL.',
          mm: 'MM', yyyy: 'YYYY', cvv: 'CVV'
        },
        JPN: {
          title: 'ICOPAY かんたん決済', brandSub3ds: '3DSセキュア決済', merchant: '加盟店', item: '商品名', amount: '金額', card: 'カード',
          cardNo: 'カード番号', firstName: '名', lastName: '姓', email: 'メール', shipping: '配送先',
          phone: '電話', country: '国(2字)', address: '住所', city: '市区町村', postcode: '郵便番号', pay: '定期登録',
          errMerchant: '加盟店コード(m)が必要です。', errLoad: '定期決済画面の読み込みに失敗しました。',
          errInvalidSession: 'セッションが無効または期限切れです。', errSessionMismatch: 'セッションと注文情報が一致しません。',
          payComplete: '定期登録完了', payFailed: '定期登録失敗', paid: '定期登録が完了しました。', networkErr: 'ネットワークエラー',
          payInProgress: '決済処理中です。しばらくお待ちください。',
          mm: 'MM', yyyy: 'YYYY', cvv: 'CVV'
        },
        CHN: {
          title: 'ICOPAY 便捷支付', brandSub3ds: '3DS 安全支付', merchant: '商户', item: '商品', amount: '金额', card: '银行卡',
          cardNo: '卡号', firstName: '名', lastName: '姓', email: '邮箱', shipping: '配送地址',
          phone: '电话', country: '国家(2位)', address: '地址', city: '城市', postcode: '邮编', pay: '订阅',
          errMerchant: '需要商户代码(m)。', errLoad: '无法加载订阅页面。',
          errInvalidSession: '会话无效或已过期。', errSessionMismatch: '会话与订单信息不一致。',
          payComplete: '订阅完成', payFailed: '订阅失败', paid: '订阅已注册。', networkErr: '网络错误',
          payInProgress: '支付正在进行中，请稍候。',
          mm: 'MM', yyyy: 'YYYY', cvv: 'CVV'
        },
        THA: {
          title: 'ICOPAY ชำระเงินง่าย', brandSub3ds: '3DS ชำระเงินปลอดภัย', merchant: 'ร้านค้า', item: 'สินค้า', amount: 'จำนวนเงิน', card: 'บัตร',
          cardNo: 'หมายเลขบัตร', firstName: 'ชื่อ', lastName: 'นามสกุล', email: 'อีเมล', shipping: 'ที่อยู่จัดส่ง',
          phone: 'โทรศัพท์', country: 'ประเทศ(2)', address: 'ที่อยู่', city: 'เมือง', postcode: 'รหัสไปรษณีย์', pay: 'สมัคร',
          errMerchant: 'ต้องระบุรหัสร้านค้า (m)', errLoad: 'โหลดหน้าสมัครไม่สำเร็จ',
          errInvalidSession: 'เซสชันไม่ถูกต้องหรือหมดอายุ', errSessionMismatch: 'เซสชันไม่ตรงกับข้อมูลคำสั่งซื้อ',
          payComplete: 'สมัครสำเร็จ', payFailed: 'สมัครล้มเหลว', paid: 'สมัครแล้ว', networkErr: 'ข้อผิดพลาดเครือข่าย',
          payInProgress: 'กำลังชำระเงินอยู่แล้ว กรุณารอสักครู่',
          mm: 'MM', yyyy: 'YYYY', cvv: 'CVV'
        }
      };
      function t(key) {
        var pack = I18N[LANG] || I18N.ENG;
        return pack[key] != null ? pack[key] : (I18N.ENG[key] || key);
      }
      function localizeJpayMsg(msg) {
        if (window.PG_JPAY_PAY_MSG && PG_JPAY_PAY_MSG.translate) {
          return PG_JPAY_PAY_MSG.translate(msg, LANG);
        }
        return msg;
      }
      function jpayStatusNum(st) {
        var n = Number(st);
        return isNaN(n) ? -1 : n;
      }
      function jpayResolveRedirectUrl(d) {
        d = d || {};
        var u = d.redirectUrl || d.url || '';
        if (u) return String(u).trim();
        var raw = d.rawResponse ? String(d.rawResponse).trim() : '';
        if (!raw) return '';
        try {
          var parsed = raw;
          if (parsed.charAt(0) === '"' && parsed.charAt(parsed.length - 1) === '"') {
            parsed = JSON.parse(parsed);
          }
          if (typeof parsed === 'string') parsed = JSON.parse(parsed);
          if (parsed && parsed.url) return String(parsed.url).trim();
        } catch (e) { /* ignore */ }
        var m = raw.match(/"url"\s*:\s*"([^"\\]+(?:\\.[^"\\]*)*)"/);
        return m ? m[1].replace(/\\\//g, '/') : '';
      }
      function resolveJpayFailMsg(st, msg) {
        var m = localizeJpayMsg(msg || '');
        if (m) return m;
        if (st === 1) return t('jpay3dsUrlMissing');
        if (st < 0) return t('jpayUnknownResponse');
        return t('payFailed');
      }
      function applyI18n() {
        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyUrlPayBrowserTabTitle) {
          PG_URL_PAY_SHELL.applyUrlPayBrowserTabTitle(LANG, window.__payUrlCardCopy, t);
        } else {
          document.title = t('title');
        }
        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyCheckoutHeaderSubtitle) {
          PG_URL_PAY_SHELL.applyCheckoutHeaderSubtitle(checkoutCtx, { t: t });
        } else {
          var sub = document.querySelector('#jpayBrandBlock .pay-brand-sub');
          if (sub) sub.textContent = t('brandSub3ds') || t('brandSub');
        }
        var labels = document.querySelectorAll('.pay-row-label');
        if (labels[0]) labels[0].textContent = t('merchant');
        var itemLbl = document.querySelector('label[for="item"]');
        if (itemLbl) itemLbl.textContent = t('item');
        var amtLbl = document.querySelector('label[for="amount"]');
        if (amtLbl) amtLbl.textContent = t('amount');
        var cardLbl = document.querySelector('.pay-label');
        if (cardLbl) cardLbl.textContent = t('card');
        var cardNo = document.getElementById('payCardno');
        if (cardNo) cardNo.placeholder = t('cardNo');
        var cmm = document.getElementById('payCardmonth');
        if (cmm) cmm.placeholder = t('mm');
        var cyy = document.getElementById('payCardyear');
        if (cyy) cyy.placeholder = t('yyyy');
        var ccv = document.getElementById('payCardcvv');
        if (ccv) ccv.placeholder = t('cvv');
        var fn = document.getElementById('payFirstname');
        if (fn) fn.placeholder = t('firstName');
        var ln = document.getElementById('payLastname');
        if (ln) ln.placeholder = t('lastName');
        var em = document.getElementById('payEmailAddress');
        if (em) em.placeholder = t('email');
        var bl = document.getElementById('billingLabel');
        if (bl) bl.textContent = t('shipping');
        var ph = document.getElementById('payTelephone');
        if (ph) ph.placeholder = t('phone');
        var co = document.getElementById('payCountryIsoCode2');
        if (co) co.placeholder = t('country');
        var ad = document.getElementById('payStreetAddress1');
        if (ad) ad.placeholder = t('address');
        var ci = document.getElementById('payCity');
        if (ci) ci.placeholder = t('city');
        var pc = document.getElementById('payPostcode');
        if (pc) pc.placeholder = t('postcode');
        var btn = document.getElementById('submitBtn');
        if (btn) btn.textContent = t('pay');
        try {
          var hl = { KOR: 'ko', ENG: 'en', JPN: 'ja', CHN: 'zh', THA: 'th' };
          document.documentElement.setAttribute('lang', hl[LANG] || 'en');
        } catch (eH) { /* ignore */ }
      }

      function getCompId() {
        try {
          var p = new URLSearchParams(location.search);
          return (p.get('m') || p.get('compId') || '').trim();
        } catch (e) { return ''; }
      }

      function apiUrl(path, qs) {
        return API_BASE + path + (qs ? ('?' + qs) : '');
      }

      function fetchJson(url) {
        return fetch(url, { credentials: 'omit', cache: 'no-store' }).then(function (r) {
          return r.text().then(function (text) {
            if (!r.ok) throw new Error(text || ('HTTP ' + r.status));
            return text ? JSON.parse(text) : {};
          });
        });
      }

      function notifyParent(detail) {
        if (!PAY_ENTRY_MERCHANT_API && !PAY_EMBED_MODE) return;
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'ICOPAY_INLINE_CHECKOUT', detail: detail || {} }, location.origin);
          }
        } catch (e) {}
      }

      function lockField(id, val) {
        var el = document.getElementById(id);
        if (!el || val == null || String(val).trim() === '') return;
        el.value = String(val);
        el.readOnly = true;
      }

      function showErr(msg) {
        var el = document.getElementById('configError');
        el.style.display = 'block';
        el.textContent = msg;
        document.getElementById('jpayForm').style.display = 'none';
      }

      function showPayWarn(msg) {
        var el = document.getElementById('payResult');
        if (!el) return;
        el.style.display = 'block';
        el.className = 'err';
        el.textContent = msg;
      }

      function payGuardOpts(btn) {
        return {
          lang: LANG,
          t: t,
          button: btn,
          onWarn: function (m) { showPayWarn(m); }
        };
      }

      function payGuardUnlock(btn) {
        var g = window.PG_PAY_SUBMIT_GUARD;
        if (g) g.unlockForRetry({ button: btn });
        else if (btn) btn.disabled = false;
      }

      function payGuardFail(btn) {
        var g = window.PG_PAY_SUBMIT_GUARD;
        if (g) g.unlockAfterFailure({ button: btn });
        else if (btn) btn.disabled = false;
      }

      function showFinished(ok, msg, orderNo, extra) {
        document.getElementById('jpayForm').style.display = 'none';
        var el = document.getElementById('payResult');
        el.style.display = 'block';
        el.className = ok ? 'ok pay-result-final' : 'err pay-result-final';
        el.innerHTML = '<div class="pay-result-title">' + (ok ? t('payComplete') : t('payFailed')) + '</div><p>' + msg + '</p>';
        notifyParent(Object.assign({ phase: 'finished', success: ok, orderNo: orderNo || '', message: msg, pgVendor: 'JPAY', checkoutKind: 'SUBSCRIPTION' }, extra || {}));
      }

      function buildJpayOrderNo(compId) {
        var t = String(Date.now());
        var c = String(compId || 'X').replace(/[^0-9A-Za-z]/g, '');
        if (c.length > 6) c = c.slice(0, 6);
        var raw = 'S' + c + t;
        if (raw.length > 20) raw = raw.slice(0, 20);
        return raw;
      }

      function applyQueryPrefills() {
        try {
          var p = new URLSearchParams(location.search);
          lockField('item', p.get('item') || p.get('desc'));
          lockField('amount', p.get('amount') || p.get('amt'));
          lockField('orderNo', p.get('orderNo') || p.get('OrderNo'));
          var curParam = p.get('currency') || p.get('cur');
          if (curParam) {
            document.getElementById('currencyHint').textContent = curParam.trim().toUpperCase();
          }
        } catch (e) {}
      }

      var checkoutCtx = null;
      var sessionPayload = null;

      var sessionToken = '';

      function validateSession() {
        if (!PAY_ENTRY_MERCHANT_API) return Promise.resolve();
        try { sessionToken = (new URLSearchParams(location.search).get('session') || '').trim(); } catch (e) {}
        if (!sessionToken) return Promise.resolve();
        return fetchJson(apiUrl('/api/middleware/v1/merchant/jpay/subscription/session', 'token=' + encodeURIComponent(sessionToken)))
          .then(function (res) {
            if (!res.success || !res.data) throw new Error(t('errInvalidSession'));
            sessionPayload = res.data;
            var d = res.data;
            lockField('orderNo', d.orderNo);
            lockField('amount', d.amount);
            lockField('item', d.productName);
            if (d.currency) document.getElementById('currencyHint').textContent = String(d.currency).toUpperCase();
            if (d.subscriptionPlanJson) {
              try {
                var plan = JSON.parse(d.subscriptionPlanJson);
                var info = (plan.name || 'Plan') + ' (' + (plan.plan_type || '') + ')';
                document.getElementById('planInfoDisplay').textContent = info;
                document.getElementById('planInfoRow').style.display = '';
              } catch (eP) { /* ignore */ }
            }
          });
      }

      function assertSessionMatchesForm() {
        if (!sessionPayload) return true;
        var on = (document.getElementById('orderNo').value || '').trim();
        var amt = (document.getElementById('amount').value || '').trim();
        var spOn = sessionPayload.orderNo != null ? String(sessionPayload.orderNo).trim() : '';
        var spAmt = sessionPayload.amount != null ? String(sessionPayload.amount).trim() : '';
        if (spOn && on && spOn !== on) return false;
        if (spAmt && amt && spAmt !== amt) return false;
        return true;
      }

      function jpayPayLanguageCode() {
        var m = { KOR: 'ko', ENG: 'en', JPN: 'ja', CHN: 'zh', THA: 'th' };
        return m[LANG] || 'en';
      }

      function boot() {
        applyI18n();
        var compId = getCompId();
        if (!compId) { showErr(t('errMerchant')); return; }
        document.getElementById('compIdHidden').value = compId;
        if (PAY_EMBED_MODE) {
          var brand = document.getElementById('jpayBrandBlock');
          if (brand && PAY_ENTRY_MERCHANT_API) brand.style.display = 'none';
        }
        applyQueryPrefills();
        fetchJson(apiUrl('/api/pay/jpay/subscribe-checkout-context', 'compId=' + encodeURIComponent(compId)))
          .then(function (ctxRes) {
            if (!ctxRes.success || !ctxRes.data) throw new Error(ctxRes.message || 'Config error');
            var ctx = ctxRes.data;
            checkoutCtx = ctx;
            if (ctx.merchantName) document.getElementById('merchantNameDisplay').textContent = ctx.merchantName;
            if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyCheckoutHeaderLogo) {
              PG_URL_PAY_SHELL.applyCheckoutHeaderLogo(ctx, {
                brandBlockId: 'jpayBrandBlock',
                logoWrapSelector: '.pay-brand-logo',
                t: typeof t === 'function' ? t : undefined
              });
            }
            applyI18n();
            var itemEl = document.getElementById('item');
            if (itemEl && !itemEl.readOnly && ctx.defaultProductName) itemEl.value = String(ctx.defaultProductName).trim();
            var amtEl = document.getElementById('amount');
            if (amtEl && !amtEl.readOnly && ctx.defaultAmount) amtEl.value = String(ctx.defaultAmount).trim();
            if (ctx.defaultCountryIso2) {
              var cEl = document.getElementById('payCountryIsoCode2');
              if (cEl && !cEl.value) cEl.value = String(ctx.defaultCountryIso2).trim().toUpperCase();
            }
            if (ctx.checkoutCurrencyCode) {
              var curHint = document.getElementById('currencyHint');
              var q = new URLSearchParams(location.search);
              if (!(q.get('currency') || q.get('cur'))) {
                curHint.textContent = String(ctx.checkoutCurrencyCode).trim().toUpperCase();
              }
            }
            return validateSession();
          })
          .then(function () {
            var ordEl = document.getElementById('orderNo');
            if (ordEl && !String(ordEl.value || '').trim()) {
              ordEl.value = buildJpayOrderNo(compId);
            }
          })
          .catch(function (e) { showErr(e.message || t('errLoad')); });
      }

      document.getElementById('jpayForm').addEventListener('submit', function (e) {
        e.preventDefault();
        if (!assertSessionMatchesForm()) {
          showErr(t('errSessionMismatch'));
          return;
        }
        var btn = document.getElementById('submitBtn');
        var guard = window.PG_PAY_SUBMIT_GUARD;
        if (guard) {
          if (!guard.tryLock(payGuardOpts(btn))) return;
        } else {
          btn.disabled = true;
        }
        var compId = document.getElementById('compIdHidden').value.trim();
        var cur = (checkoutCtx && checkoutCtx.checkoutCurrencyCode)
          ? String(checkoutCtx.checkoutCurrencyCode).trim().toUpperCase()
          : (document.getElementById('currencyHint').textContent.trim() || 'JPY');
        var body = {
          compId: compId,
          orderNo: document.getElementById('orderNo').value.trim(),
          amount: document.getElementById('amount').value.trim(),
          currency: cur,
          item: document.getElementById('item').value.trim(),
          payCardno: document.getElementById('payCardno').value.replace(/\s/g, ''),
          payCardmonth: document.getElementById('payCardmonth').value.trim(),
          payCardyear: document.getElementById('payCardyear').value.trim(),
          payCardcvv: document.getElementById('payCardcvv').value.trim(),
          payFirstname: document.getElementById('payFirstname').value.trim(),
          payLastname: document.getElementById('payLastname').value.trim(),
          payEmailAddress: document.getElementById('payEmailAddress').value.trim(),
          payTelephone: document.getElementById('payTelephone').value.trim(),
          payCountryIsoCode2: document.getElementById('payCountryIsoCode2').value.trim().toUpperCase(),
          payStreetAddress1: document.getElementById('payStreetAddress1').value.trim(),
          payCity: document.getElementById('payCity').value.trim(),
          payPostcode: document.getElementById('payPostcode').value.trim(),
          payLanguage: jpayPayLanguageCode(),
          langCode: LANG,
          system: 'icopay',
          txnOrigin: 'SUBSCRIPTION',
          sessionToken: sessionToken
        };
        fetch(API_BASE + '/api/pay/jpay/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (!res.success) {
            showFinished(false, localizeJpayMsg(res.message) || t('payFailed'), body.orderNo, {});
            payGuardFail(btn);
            return;
          }
          var d = res.data || {};
          var st = jpayStatusNum(d.status);
          var msg = d.msg || d.message || '';
          var redirectUrl = jpayResolveRedirectUrl(d);
          if (redirectUrl && (st === 1 || st < 0)) {
            notifyParent({ phase: 'wait_authorize', success: true, orderNo: body.orderNo, paymentUrl: redirectUrl, pgVendor: 'JPAY' });
            location.href = redirectUrl;
            return;
          }
          if (st === 0) {
            showFinished(true, localizeJpayMsg(msg) || t('paid'), body.orderNo, { jpayStatus: st, checkoutKind: 'SUBSCRIPTION' });
            return;
          }
          showFinished(false, resolveJpayFailMsg(st, msg), body.orderNo, { jpayStatus: st });
          payGuardFail(btn);
        }).catch(function (err) {
          showFinished(false, (err && err.message) || t('networkErr'), body.orderNo, {});
          payGuardFail(btn);
        });
      });

      boot();
    })();
  </script>
</body>
</html>
