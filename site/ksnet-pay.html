<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta name="referrer" content="no-referrer">
  <title>ICOPAY Easy Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/pay-inline.css?v=41" rel="stylesheet">

  <script src="/js/checkout-header-subtitle-presets.js?v=2"></script>
  <script src="/js/url-pay-copy-phrase-i18n.js?v=1"></script>
  <script src="/js/pay-dynamic-form.js?v=2"></script>

<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand" id="ksnetBrandBlock">
        <div class="pay-brand-logo">ICOPAY</div>
        <div class="pay-brand-sub" data-i18n="brandSub">Global Payment</div>
      </div>
      <div class="pay-lang" role="group" aria-label="Language" data-i18n-aria="langGroup">
        <button type="button" data-lang="JPN">JPN</button>
        <button type="button" data-lang="KOR">KOR</button>
        <button type="button" data-lang="ENG">ENG</button>
        <button type="button" data-lang="CHN">CHN</button>
        <button type="button" data-lang="THA">THA</button>
      </div>
      <div id="configError" class="alert alert-warning pay-alert-config" style="display:none;"></div>
      <div id="payResult" class="pay-result" style="display:none;"></div>
      <form id="ksnetForm" autocomplete="off">
        <input type="hidden" id="compIdHidden" name="compId">
        <input type="hidden" id="orderNo" name="orderNo">
        <p class="small text-muted mb-3 text-center" id="ksnetLead" data-i18n="lead">Confirm order and shopper details, then continue to payment.</p>
        <div class="pay-form-grid mb-3">
          <div class="pay-row pay-row-static" id="merchantRow">
            <div class="pay-row-label"><span data-i18n="merchant">Merchant</span></div>
            <div class="pay-row-value"><span id="merchantNameDisplay">—</span></div>
          </div>
          <div class="pay-row" id="itemRow">
            <label class="pay-row-label mb-0" for="item"><span data-i18n="item">Item</span></label>
            <div class="pay-row-value"><input type="text" class="form-control form-control-sm pay-input-round" id="item" required></div>
          </div>
          <div class="pay-row" id="amountRow">
            <label class="pay-row-label mb-0" for="amount"><span data-i18n="amount">Amount</span> <span class="pay-currency-hint text-muted fw-normal" id="payAmountCurrencyHint">(USD)</span></label>
            <div class="pay-row-value">
              <input type="number" class="form-control form-control-sm pay-input-round" id="amount" required min="0.01" step="0.01">
            </div>
          </div>
          <div class="pay-row d-none" id="payFxDisplayCurrencyRow">
            <label class="pay-row-label mb-0" for="payDisplayCurrencySelect"><span data-i18n="fxCur">Display currency</span></label>
            <div class="pay-row-value d-flex align-items-center gap-2 flex-wrap">
              <select class="form-select form-select-sm pay-input-round" id="payDisplayCurrencySelect" style="max-width:8rem"></select>
              <span class="small text-muted" id="payFxDisplayCurrencyStatic"></span>
            </div>
          </div>
          <div class="pay-row d-none" id="payFxQuoteRow">
            <div class="pay-row-label"><span data-i18n="fxEst">Estimated charge</span></div>
            <div class="pay-row-value"><span id="payFxThbEstimateText" class="small fw-semibold">—</span></div>
          </div>
          <div class="pay-row d-none" id="orderRow">
            <label class="pay-row-label mb-0" for="orderNoDisplay"><span data-i18n="order">Order no.</span></label>
            <div class="pay-row-value"><input type="text" class="form-control form-control-sm pay-input-round" id="orderNoDisplay" maxlength="64" autocomplete="off" readonly tabindex="-1"></div>
          </div>
        </div>
        <div id="buyerBlock">
          <div class="pay-row mb-2" id="nameRow">
            <div class="pay-row-label"><span data-i18n="name">Name</span></div>
            <div class="pay-row-value">
              <div class="row g-2">
                <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round" id="payFirstname" data-i18n-placeholder="firstName" required></div>
                <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round" id="payLastname" data-i18n-placeholder="lastName" required></div>
              </div>
            </div>
          </div>
          <div class="pay-row mb-2" id="emailRow">
            <label class="pay-row-label mb-0" for="payEmailAddress"><span data-i18n="email">Email</span></label>
            <div class="pay-row-value"><input type="email" class="form-control form-control-sm pay-input-round" id="payEmailAddress" data-i18n-placeholder="email" required></div>
          </div>
          <div class="pay-row mb-2" id="countryRow">
            <label class="pay-row-label mb-0" for="payContactCountryCode"><span data-i18n="country">Country code</span></label>
            <div class="pay-row-value">
              <select class="form-select form-select-sm pay-input-round" id="payContactCountryCode" data-i18n-aria="country" aria-label="Country code"></select>
              <input type="hidden" id="payCountryIsoCode2" />
            </div>
          </div>
          <div class="pay-row mb-2" id="phoneRow">
            <label class="pay-row-label mb-0" for="payTelephone"><span data-i18n="phone">Phone</span></label>
            <div class="pay-row-value"><input type="tel" class="form-control form-control-sm pay-input-round" id="payTelephone" data-i18n-placeholder="phoneOptional" inputmode="tel" autocomplete="tel"></div>
          </div>
          <p class="small text-muted mb-3 text-center" id="ksnetHostedNote"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-pay w-100" id="submitBtn" data-i18n="pay">Pay</button>
        <p class="small text-primary mt-2 mb-0 text-center" id="ksnetSandboxHint" style="display:none;"></p>
      </form>
    </div>
  </div>

        if (s.indexOf('zh') === 0) return 'CHN';

      function t(key) {
        var pack = I18N[LANG] || I18N.ENG;
        return pack[key] != null ? pack[key] : (I18N.ENG[key] || key);
      }
      function localizeMsg(msg) {
        if (window.PG_KSNET_PAY_MSG && PG_KSNET_PAY_MSG.translate) return PG_KSNET_PAY_MSG.translate(msg, LANG);
        return msg;
      }
      function apiLangCode() {
        var c = String(LANG || 'ENG').toUpperCase();
        return (c === 'KOR' || c === 'ENG' || c === 'CHN' || c === 'JPN' || c === 'THA') ? c : 'ENG';
      }
      function resolveApiErrorMessage(res) {
        res = res || {};
        var L = apiLangCode();
        if (res.messages) {
          if (res.messages[L]) return res.messages[L];
          var alt = { KOR: 'KO', ENG: 'EN', JPN: 'JP', CHN: 'CH', THA: 'TH' };
          if (alt[L] && res.messages[alt[L]]) return res.messages[alt[L]];
          if (res.messages.ENG) return res.messages.ENG;
        }
        var code = res.errorCode ? String(res.errorCode).trim() : '';
        if (code === 'ORG_DISABLED' || code === 'WEB_PAYMENT_DISABLED') return res.message || t('orgDisabled');
        if (code === 'URL_PAYMENT_PG_MISSING' || code === 'URL_PAY_SALE_NOT_REGISTERED' || code === 'URL_PAY_ROUTE_NOT_CONFIGURED') return t('pgMissing');
        if (code === 'KSNET_USD_ONLY') return t('usdOnly');

          .then(function (res) {

            sessionPayload = res.data;

          || PG_URL_PAY_SHELL.isApiPaymentAmountLockEnabled([sessionPayload, checkoutCtx]);
        if (amountLocked && spAmt && amt && parseFloat(spAmt) !== parseFloat(amt)) return false;

      /* ============ 결제 대기 마커(모바일 복귀 대비) ============ */
      function savePending(orderNo, compId, deviceType) {
        try { sessionStorage.setItem(PENDING_KEY, JSON.stringify({ orderNo: orderNo, compId: compId, deviceType: deviceType, at: Date.now() })); } catch (e) {}
      }
      function clearPending() {
        try { sessionStorage.removeItem(PENDING_KEY); } catch (e) {}
      }
      function readPending() {
        try { var s = sessionStorage.getItem(PENDING_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; }
      }

      /* ============ 서버 승인 (auth ≠ paid — 승인 성공 시에만 완료) ============ */
      function approveOnServer(orderNo, compId, payKey, deviceType) {
        showProcessing();
        return postJson('/api/pay/ksnet/approve', {
          orderNo: orderNo, compId: compId || '', payKey: payKey, deviceType: deviceType || 'POPUP'
        }).then(function (res) {
          clearPending();
          if (res && res.success) {
            showFinished(true, t('paid') + (orderNo ? (' (' + orderNo + ')') : ''));
          } else {
            showFinished(false, resolveApiErrorMessage(res));
          }
        }).catch(function (err) {
          showFinished(false, (err && err.message) || t('networkErr'));
        });
      }
      function pollResult(orderNo, compId, tries) {
        showProcessing();
        var n = tries || 0;
        fetchJson(apiUrl('/api/pay/ksnet/result-status',
          'orderNo=' + encodeURIComponent(orderNo) + (compId ? ('&compId=' + encodeURIComponent(compId)) : '')))
          .then(function (res) {
            var d = (res && res.data) || {};
            var st = String(d.paymentStatus || '').toUpperCase();
            if (d.paid === true || st === 'PAID') { clearPending(); showFinished(true, t('paid') + ' (' + orderNo + ')'); return; }
            if (st === 'FAILED' || st === 'CANCELED' || st === 'CANCELLED') { clearPending(); showFinished(false, t('authCancelled')); return; }
            if (n >= 20) { showFinished(false, t('payFailed')); return; }
            setTimeout(function () { pollResult(orderNo, compId, n + 1); }, 2500);
          })
          .catch(function () {
            if (n >= 20) { showFinished(false, t('networkErr')); return; }
            setTimeout(function () { pollResult(orderNo, compId, n + 1); }, 2500);
          });
      }
      function abortOnServer(orderNo, compId, reason) {
        clearPending();
        return postJson('/api/pay/ksnet/cancel', { orderNo: orderNo, compId: compId || '', reason: reason || 'USER_CLOSE' })
          .catch(function () { /* ignore */ });
      }

      /* ============ 모바일 복귀(callbackUrl) ============ */
      function isReturnMode() {
        try { return String(new URLSearchParams(location.search).get('ksnetReturn') || '') === '1'; } catch (e) { return false; }
      }
      function handleReturn() {
        var f = document.getElementById('ksnetForm'); if (f) f.style.display = 'none';
        applyI18n();
        var p = new URLSearchParams(location.search);
        var orderNo = (p.get('orderNo') || p.get('orderNumber') || '').trim();
        var payKey = (p.get('payKey') || p.get('commConId') || p.get('reCommConId') || '').trim();
        var compId = (p.get('m') || p.get('compId') || '').trim();
        var pend = readPending();
        if (!orderNo && pend) orderNo = pend.orderNo || '';
        if (!compId && pend) compId = pend.compId || '';
        if (!orderNo) { showFinished(false, t('payFailed')); return; }
        if (payKey) {
          approveOnServer(orderNo, compId, payKey, 'MOBILE');
        } else {
          pollResult(orderNo, compId, 0);
        }
      }

      /* ============ KSPAY SDK ============ */
      function loadSdk(url) {
        return new Promise(function (resolve, reject) {
          if (!url) { reject(new Error('no sdk')); return; }
          if (window.KSPAY && typeof window.KSPAY.requestPay === 'function') { resolve(); return; }
          var s = document.createElement('script');
          s.src = url;
          s.async = true;
          s.onload = function () {
            if (window.KSPAY && typeof window.KSPAY.requestPay === 'function') resolve();
            else reject(new Error('sdk missing'));
          };
          s.onerror = function () { reject(new Error('sdk load')); };
          document.head.appendChild(s);
        });
      }
      function pickPayKey(r) {
        if (!r) return '';
        return String(r.payKey || r.commConId || r.reCommConId || r.commconid || r.paykey || '').trim();
      }
      function isAuthFail(r) {
        if (!r) return true;
        var ok = String(r.authyn || r.authYn || '').toUpperCase();
        if (ok === 'X' || ok === 'N') return true;
        if (r.success === false) return true;
        var code = String(r.resCode || r.resultCode || r.code || '').trim();
        if (code && !/^(0+|0000|00|SUCCESS|OK)$/i.test(code) && !pickPayKey(r)) return true;
        return false;
      }
      function runKspay(d, body, btn) {
        var deviceType = String(d.deviceType || 'POPUP').toUpperCase();
        savePending(body.orderNo, body.compId, deviceType);
        return loadSdk(d.sdkScriptUrl).then(function () {
          var finished = false;
          function onResult(r) {
            if (finished) return;
            finished = true;
            var payKey = pickPayKey(r);
            if (!payKey || isAuthFail(r)) {
              abortOnServer(body.orderNo, body.compId, 'AUTH_FAILED').then(function () {
                showFinished(false, t('authCancelled'));
              });
              payGuardFail(btn);
              return;
            }
            approveOnServer(body.orderNo, body.compId, payKey, deviceType);
          }
          window.KSPAY.requestPay(d.requestParams || {}, onResult);
          payGuardUnlock(btn);
        });
      }

      function boot() {
        applyI18n();
        if (window.PG_URL_PAY_SHELL) PG_URL_PAY_SHELL.wireLanguageButtons(function () { return LANG; }, setLang);
        if (isReturnMode()) { handleReturn(); return; }
        var compId = getCompId();
        if (!compId) { showErr(t('errMerchant')); return; }
        document.getElementById('compIdHidden').value = compId;
        applyQueryPrefills();
        validateSession()
          .then(function () {
            return fetchJson(apiUrl('/api/pay/url/checkout-context',
              'compId=' + encodeURIComponent(compId) + (PAY_ENTRY_MERCHANT_API ? '&entry=merchant_api' : '')));
          })
          .then(function (ctxRes) {
            if (!ctxRes.success || !ctxRes.data) {
              throw new Error(resolveApiErrorMessage(ctxRes) || t('configErr'));
            }
            applyCheckoutContext(ctxRes.data);
            if (PAY_ENTRY_MERCHANT_API && window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyApiPaymentAmountField) {
              PG_URL_PAY_SHELL.applyApiPaymentAmountField('amount',
                document.getElementById('amount') && document.getElementById('amount').value,
                [sessionPayload, checkoutCtx]);
            }
          })
          .catch(function (e) {
            showErr(e.message || t('errLoad'));
            var f = document.getElementById('ksnetForm'); if (f) f.style.display = 'none';
          });
      }

      document.getElementById('ksnetForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        var guard = window.PG_PAY_SUBMIT_GUARD;
        if (guard) { if (!guard.tryLock({ lang: LANG, t: t, button: btn, onWarn: function (m) { showErr(m); } })) return; }
        else { btn.disabled = true; }

        var compId = document.getElementById('compIdHidden').value.trim();
        var fn = document.getElementById('payFirstname').value.trim();
        var ln = document.getElementById('payLastname').value.trim();
        if (!fn || !ln) { showErr(t('errName')); payGuardUnlock(btn); return; }
        var email = document.getElementById('payEmailAddress').value.trim();
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showErr(t('errEmailFormat')); payGuardUnlock(btn); return; }
        if (window.PG_JPAY_CONTACT && PG_JPAY_CONTACT.syncBeforeSubmit) {
          try { PG_JPAY_CONTACT.syncBeforeSubmit(document.getElementById('ksnetForm')); } catch (eSync) { /* ignore */ }
        }
        var countryYnRaw = checkoutCtx && checkoutCtx.urlPayBuyerCountryUseYn != null
          ? String(checkoutCtx.urlPayBuyerCountryUseYn).trim().toUpperCase() : 'Y';
        var useCountry = countryYnRaw !== 'N' && countryYnRaw !== '0' && countryYnRaw !== 'FALSE' && countryYnRaw !== 'OFF';
        var payCountryIso = '';
        if (useCountry) {
          if (window.PG_JPAY_CONTACT && PG_JPAY_CONTACT.readCountryIso2) {
            payCountryIso = PG_JPAY_CONTACT.readCountryIso2(document.getElementById('ksnetForm')) || '';
          } else {
            var ccEl = document.getElementById('payContactCountryCode');
            payCountryIso = ccEl ? String(ccEl.value || '').trim().toUpperCase() : '';
          }
          if (!payCountryIso || payCountryIso.length !== 2) {
            showErr(t('needCountry'));
            payGuardUnlock(btn);
            return;
          }
        }
        var amtStr = String(document.getElementById('amount').value || '').replace(/,/g, '').trim();
        if (!(parseFloat(amtStr) > 0)) { showErr(t('needAmount')); payGuardUnlock(btn); return; }
        var settleCur = (checkoutCtx && (checkoutCtx.urlPaySettlementCurrencyCode || checkoutCtx.checkoutCurrencyCode))
          ? String(checkoutCtx.urlPaySettlementCurrencyCode || checkoutCtx.checkoutCurrencyCode).trim().toUpperCase()
          : 'USD';
        if (!assertSessionMatchesForm()) { showErr(t('errInvalidSession')); payGuardUnlock(btn); return; }

        var ordEl = document.getElementById('orderNo');
        if (!String(ordEl.value || '').trim()) ordEl.value = buildOrderNo(compId);
        syncOrderNoDisplay();

        var body = {
          compId: compId,
          orderNo: ordEl.value.trim(),
          amount: amtStr,
          currency: settleCur,
          item: document.getElementById('item').value.trim(),
          paymentMethod: 'CARD',
          buyerName: (fn + ' ' + ln).trim(),
          payFirstname: fn,
          payLastname: ln,
          payEmailAddress: email,
          payTelephone: (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.readPhoneWithDial)
            ? PG_URL_PAY_SHELL.readPhoneWithDial()
            : document.getElementById('payTelephone').value.trim(),
          payCountryIsoCode2: useCountry ? payCountryIso : '',
          langCode: LANG,
          system: 'icopay',
          txnOrigin: PAY_ENTRY_CHATBOT ? 'CHATBOT' : (PAY_ENTRY_MERCHANT_API ? 'MERCHANT_API' : 'URL')
        };
        /* DP: 표시금액 + 견적 토큰(미전송 시 INVALID_FX_QUOTE) — PAYSO/ElementPay 와 동일 */
        if (urlPayDisplayFxActive && urlPayPricingMode === 'DISPLAY_FX_THB') {
          var fxQ = fxShellState.urlPayFxQuote;
          if (!fxQ || (!fxQ.fxQuoteToken && fxQ.oneToOneDisplaySettlement !== true)) {
            showErr(t('needFxQuote'));
            payGuardUnlock(btn);
            return;
          }
          body.urlPayPricingMode = 'DISPLAY_FX_THB';
          body.displayAmount = amtStr;
          body.amount = amtStr;
          body.displayCurrency = (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.payFxResolvedDisplayCurrency && checkoutCtx)
            ? PG_URL_PAY_SHELL.payFxResolvedDisplayCurrency(checkoutCtx)
            : String((fxQ && fxQ.displayCurrency) || (checkoutCtx && checkoutCtx.urlPayDisplayFxDefaultDisplayCurrency) || settleCur).trim().toUpperCase();
          if (fxQ.fxQuoteToken) body.fxQuoteToken = String(fxQ.fxQuoteToken);
          if (fxQ.settlementCurrency) {
            body.currency = String(fxQ.settlementCurrency).trim().toUpperCase();
          }
          if (fxShellState.operationalPgCd) {
            body.operationalPgCd = String(fxShellState.operationalPgCd).trim();
          } else if (checkoutCtx && checkoutCtx.urlPayOperationalPgCd) {
            body.operationalPgCd = String(checkoutCtx.urlPayOperationalPgCd).trim();
          }
        }
        hideErr();
        postJson('/api/pay/url/sale', body).then(function (res) {
          if (!res || !res.success) {
            showErr(resolveApiErrorMessage(res)); payGuardFail(btn); return;
          }
          var d = res.data || {};
          if (!d.sdkScriptUrl) { showErr(t('sdkLoadFail')); payGuardFail(btn); return; }
          return runKspay(d, body, btn).catch(function () {
            abortOnServer(body.orderNo, body.compId, 'SDK_LOAD_FAILED');
            showErr(t('sdkLoadFail'));
            payGuardFail(btn);
          });
        }).catch(function (err) {
          showErr((err && err.message) || t('networkErr'));
          payGuardFail(btn);
        });
      });

      boot();
    })();
  </script>
</body>
</html>
