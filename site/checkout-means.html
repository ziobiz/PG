<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>ICOPAY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/pay-inline.css?v=40" rel="stylesheet" />
  <link href="/css/icopay-crypto.css?v=15" rel="stylesheet" />
</head>
<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand" id="cryptoBrand" hidden>
        <img id="cryptoBrandLogoImg" class="pay-brand-logo-img" alt="" hidden />
        <div id="cryptoBrandTextWrap">
          <div class="pay-brand-logo" id="cryptoBrandText">ICOPAY</div>
          <div class="pay-brand-sub" id="headerSubtitle"></div>
        </div>
      </div>
      <div class="pay-lang" id="langBar" role="group" aria-label="Language"></div>
      <div class="ic-crypto-section">
        <div class="ic-crypto-grid ic-crypto-means" id="meansGrid"></div>
      </div>
      <p class="ic-means-notice mt-3 mb-0" id="notice"></p>
      <div class="alert alert-danger small mt-3 mb-0" id="err" hidden role="alert"></div>
    </div>
  </div>
  <script src="/js/icopay-crypto-wallets.js"></script>
  <script src="/js/icopay-checkout-header.js?v=6"></script>
  <script>
(function () {
  var T = {
    KO: {
      card: '카드',
      crypto: '암호화폐',
      err: '결제 수단을 선택할 수 없습니다.',
      notice: '주의: 선택한 수단으로 결제가 진행됩니다. 카드와 암호화폐는 별도 결제창에서 처리되며, 결제 완료 전까지 창을 닫지 마세요.'
    },
    EN: {
      card: 'Card',
      crypto: 'Crypto',
      err: 'Payment method is not available.',
      notice: 'Note: Payment continues with the method you select. Card and crypto open separate checkout pages. Do not close the window until payment is complete.'
    },
    JP: {
      card: 'カード',
      crypto: '暗号資産',
      err: 'お支払い方法を選べません。',
      notice: '注意: 選択した方法で決済が続きます。カードと暗号資産は別画面です。完了まで閉じないでください。'
    },
    CH: {
      card: '银行卡',
      crypto: '加密货币',
      err: '无法选择支付方式。',
      notice: '注意：将按所选方式继续支付。银行卡与加密货币为不同页面。完成前请勿关闭窗口。'
    },
    TH: {
      card: 'บัตร',
      crypto: 'คริปโต',
      err: 'เลือกวิธีชำระไม่ได้',
      notice: 'หมายเหตุ: จะชำระตามวิธีที่เลือก บัตรและคริปโตเปิดหน้าต่างคนละหน้า อย่าปิดจนกว่าจะชำระเสร็จ'
    }
  };

  var H = window.ICOPAY_CHECKOUT_HEADER;
  var q = new URLSearchParams(location.search);
  var lang = H ? H.toUiLang(q.get('lang') || q.get('langCode') || 'KO') : 'KO';
  var pack = T[lang] || T.KO;
  var headerCtx = null;
  var compId = (q.get('m') || q.get('compId') || '').trim();
  if (!compId) {
    var parts = (location.pathname || '').split('/');
    var last = parts[parts.length - 1] || '';
    if (/^\d+$/.test(last)) compId = last;
  }

  function applyTexts() {
    pack = T[lang] || T.KO;
    document.getElementById('notice').textContent = pack.notice;
    document.documentElement.lang = lang === 'JP' ? 'ja' : (lang === 'CH' ? 'zh' : (lang === 'TH' ? 'th' : (lang === 'EN' ? 'en' : 'ko')));
    if (H) H.applySubtitle(headerCtx, 'unified', lang);
  }

  function setLang(nextUi) {
    lang = nextUi;
    var u = new URL(location.href);
    u.searchParams.set('lang', lang);
    history.replaceState(null, '', u.toString());
    applyTexts();
    if (H) H.paintLangBar(null, lang, setLang);
    paintMeans();
  }

  function go(means) {
    if (!compId) {
      var err = document.getElementById('err');
      err.hidden = false;
      err.textContent = pack.err;
      return;
    }
    var path = means === 'CRYPTO'
      ? '/checkout-crypto/' + encodeURIComponent(compId)
      : '/checkout/' + encodeURIComponent(compId);
    location.href = path + '?lang=' + encodeURIComponent(lang);
  }

  function paintMeans() {
    var items = [
      { code: 'CARD', name: pack.card, pastelBg: '#EEF2FF', pastelFg: '#3730A3', accent: '#0d6efd', iconKey: 'card' },
      { code: 'CRYPTO', name: pack.crypto, pastelBg: '#ECFDF5', pastelFg: '#065F46', accent: '#0d6efd', iconKey: 'crypto' }
    ];
    var grid = document.getElementById('meansGrid');
    grid.innerHTML = '';
    if (window.ICOPAY_CRYPTO_UI && ICOPAY_CRYPTO_UI.renderGrid) {
      ICOPAY_CRYPTO_UI.renderGrid(grid, items, go);
    } else {
      var err = document.getElementById('err');
      err.hidden = false;
      err.textContent = pack.err;
    }
  }

  applyTexts();
  if (H) H.paintLangBar(null, lang, setLang);
  paintMeans();

  if (compId) {
    fetch('/api/pay/crypto/checkout-context?m=' + encodeURIComponent(compId) + '&channel=unified', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (body) {
        if (!(body && body.success && body.data)) return;
        headerCtx = body.data;
        if (H) {
          H.applyLogo(headerCtx);
          H.applySubtitle(headerCtx, 'unified', lang);
          if (H.applyFavicon) H.applyFavicon(headerCtx);
          var langBar = document.getElementById('langBar');
          if (langBar && String(headerCtx.urlPayLangMenuUseYn || 'Y').toUpperCase() === 'N') {
            langBar.hidden = true;
          }
        }
      }).catch(function () {});
  }
})();
  </script>
</body>
</html>
