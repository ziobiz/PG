<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Payment result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/pay-inline.css?v=31" rel="stylesheet">
</head>
<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand mb-2" id="payResultBrand">
        <div class="pay-brand-logo">ICOPAY</div>
        <div class="pay-brand-sub" id="payResultSub">Payment result</div>
      </div>
      <div class="pay-lang mb-2" role="group" aria-label="Language">
        <button type="button" data-lang="JPN">JPN</button>
        <button type="button" data-lang="KOR">KOR</button>
        <button type="button" data-lang="ENG">ENG</button>
        <button type="button" data-lang="CHN">CHN</button>
        <button type="button" data-lang="THA">THA</button>
      </div>
      <div id="payResultCard" class="alert mb-0" role="status">
        <h1 class="h5" id="payResultTitle">—</h1>
        <p class="mb-2" id="payResultBody"></p>
        <p class="small text-muted mb-3" id="payResultOrderRow" style="display:none;"></p>
        <div class="pay-result-btn-row">
          <button type="button" class="btn btn-primary btn-pay pay-result-confirm-btn" id="payResultBtn">OK</button>
        </div>
        <p class="small text-muted mt-3 mb-0" id="payResultFoot"></p>
      </div>
    </div>
  </div>
  <script src="/js/config.js?v=12"></script>
  <script src="/js/url-pay-public-shell.js?v=16"></script>
  <script>
    (function () {
      var h = (window.location && window.location.hostname) ? window.location.hostname : '';
      if (h === 'localhost' || h === '127.0.0.1') return;
      if (h === 'api.icopay.co.kr') {
        try {
          var og = (window.location.origin || '').replace(/\/$/, '');
          if (og) {
            try { localStorage.removeItem('pg_api_base'); } catch (e0) {}
            window.PG_API_BASE = og;
          }
        } catch (e1) {}
        return;
      }
      var api = window.PG_PUBLIC_ICOPAY_API || 'https://api.icopay.co.kr';
      var b = (window.PG_API_BASE || '').replace(/\/$/, '');
      var bad = !b || /^https?:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/i.test(b);
      if (bad) {
        try { localStorage.removeItem('pg_api_base'); } catch (e2) {}
        var adminIcopay = h && h !== 'api.icopay.co.kr' && h !== 'localhost' && h !== '127.0.0.1'
          && (h === 'icopay.co.kr' || /\.icopay\.co\.kr$/i.test(h));
        try {
          var ogBad = (window.location.origin || '').replace(/\/$/, '');
          if (adminIcopay && ogBad) {
            window.PG_API_BASE = ogBad;
            try { localStorage.setItem('pg_api_base', ogBad); } catch (eLs) {}
          } else {
            window.PG_API_BASE = api;
          }
        } catch (eFix) {
          window.PG_API_BASE = api;
        }
      }
    })();
  </script>
  <script>
    (function () {
      var API_BASE = (function () {
        try {
          var host0 = (window.location && window.location.hostname) ? window.location.hostname : '';
          if (host0 === 'api.icopay.co.kr' && window.location.origin) {
            return String(window.location.origin).replace(/\/$/, '');
          }
        } catch (e0) { /* ignore */ }
        var b = (window.PG_API_BASE !== undefined && window.PG_API_BASE !== '')
          ? window.PG_API_BASE
          : (typeof window.PG_assetApiBase === 'function' ? window.PG_assetApiBase() : (window.location.origin || ''));
        return String(b).replace(/\/$/, '');
      })();

      var LANG = 'ENG';
      var customCopy = {};
      var kind = 'fail';
      var merchantM = '';
      var orderNo = '';
      var txnId = '';

      var I18N = {
        KOR: {
          sub: '결제 결과',
          ok: '결제가 완료되었습니다.',
          fail: '결제가 완료되지 않았거나 실패했습니다.',
          cancel: '결제가 취소되었습니다.',
          waiting: '결제 결과를 확인하고 있습니다…',
          order: '주문번호',
          txn: '거래번호',
          btn: '확인 / 결제 초기화',
          foot: '팝업으로 열렸다면 이 창을 닫아 주세요. 새 탭이라면 아래 버튼으로 결제 초기화(결제 페이지)로 돌아가거나 탭을 닫아 주세요.',
          returnAlertOk: '결제가 완료되었습니다. 확인을 누르면 결제 페이지로 돌아갑니다.',
          returnAlertFail: '결제가 완료되지 않았습니다. 확인을 누르면 결제 페이지로 돌아갑니다.',
          returnAlertCancel: '결제가 취소되었습니다. 확인을 누르면 결제 페이지로 돌아갑니다.'
        },
        ENG: {
          sub: 'Payment result',
          ok: 'Your payment was completed.',
          fail: 'Payment was not completed or has failed.',
          cancel: 'Payment was cancelled.',
          waiting: 'Confirming payment result…',
          order: 'Order no.',
          txn: 'Transaction no.',
          btn: 'OK / Reset checkout',
          foot: 'If this opened in a popup, close the window. Otherwise use the button below to return to checkout or close the tab.',
          returnAlertOk: 'Payment completed. Press OK to return to checkout.',
          returnAlertFail: 'Payment was not completed. Press OK to return to checkout.',
          returnAlertCancel: 'Payment was cancelled. Press OK to return to checkout.'
        },
        CHN: {
          sub: '支付结果',
          ok: '支付已完成。',
          fail: '支付未完成或失败。',
          cancel: '支付已取消。',
          waiting: '正在确认支付结果…',
          order: '订单号',
          txn: '交易号',
          btn: '确定 / 重置结账',
          foot: '若为弹窗请关闭本窗口；否则请使用下方按钮返回结账页或关闭标签。',
          returnAlertOk: '支付已完成。点确定返回结账页。',
          returnAlertFail: '支付未完成。点确定返回结账页。',
          returnAlertCancel: '支付已取消。点确定返回结账页。'
        },
        JPN: {
          sub: '決済結果',
          ok: 'お支払いが完了しました。',
          fail: 'お支払いが完了していないか、失敗しました。',
          cancel: 'お支払いがキャンセルされました。',
          waiting: '決済結果を確認しています…',
          order: '注文番号',
          txn: '取引番号',
          btn: 'OK / 決済をやり直す',
          foot: 'ポップアップの場合はウィンドウを閉じてください。閉じられない場合は下のボタンで決済ページに戻ります。',
          returnAlertOk: 'お支払いが完了しました。OKで決済ページに戻ります。',
          returnAlertFail: 'お支払いは完了していません。OKで決済ページに戻ります。',
          returnAlertCancel: 'お支払いはキャンセルされました。OKで決済ページに戻ります。'
        },
        THA: {
          sub: 'ผลการชำระเงิน',
          ok: 'ชำระเงินเรียบร้อยแล้ว',
          fail: 'การชำระเงินไม่สำเร็จหรือล้มเหลว',
          cancel: 'ยกเลิกการชำระเงินแล้ว',
          waiting: 'กำลังยืนยันผลการชำระเงิน…',
          order: 'หมายเลขคำสั่งซื้อ',
          txn: 'หมายเลขธุรกรรม',
          btn: 'ตกลง / เริ่มชำระใหม่',
          foot: 'หากเป็นป๊อปอัป ให้ปิดหน้าต่างนี้ หากปิดไม่ได้ ให้ใช้ปุ่มด้านล่างเพื่อกลับไปหน้าเริ่มชำระเงิน',
          returnAlertOk: 'ชำระเงินเรียบร้อยแล้ว กดตกลงเพื่อกลับไปหน้าชำระเงิน',
          returnAlertFail: 'การชำระเงินยังไม่สำเร็จ กดตกลงเพื่อกลับไปหน้าชำระเงิน',
          returnAlertCancel: 'ยกเลิกการชำระเงินแล้ว กดตกลงเพื่อกลับไปหน้าชำระเงิน'
        }
      };

      function t(k) {
        var p = I18N[LANG] || I18N.ENG;
        return p[k] || I18N.ENG[k] || k;
      }
      function esc(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
      }
      function norm(s) {
        return (s == null ? '' : String(s)).trim();
      }
      /** Query 키 대소문자 불일치(PaymentStatus vs paymentstatus) 대응 */
      function getParamLoose(p, names) {
        var lower = {};
        try {
          p.forEach(function (val, key) {
            lower[String(key).toLowerCase()] = val;
          });
        } catch (eL) { /* ignore */ }
        for (var i = 0; i < names.length; i++) {
          var k = names[i];
          var direct = p.get(k);
          if (direct != null && norm(direct) !== '') return norm(direct);
          var alt = lower[String(k).toLowerCase()];
          if (alt != null && norm(alt) !== '') return norm(alt);
        }
        return '';
      }
      function pickMap(mapObj) {
        if (!mapObj || typeof mapObj !== 'object') return '';
        if (mapObj[LANG]) return String(mapObj[LANG]);
        if (mapObj.ENG) return String(mapObj.ENG);
        if (mapObj.KOR) return String(mapObj.KOR);
        var ks = Object.keys(mapObj);
        return ks.length ? String(mapObj[ks[0]]) : '';
      }
      /* ChillPay 복귀: PaymentStatus 문자열(Paid) 또는 숫자(10 성공 등) — 서버 노티 내부 코드와 동일 계열.
         ElementPay(NOTI map): PaymentStatus 0=성공·1=실패, returncode 00, paymentStatus Succeeded */
      function parseStatus(p) {
        var outcome = getParamLoose(p, ['outcome', 'elementpayReturn', 'ElementpayReturn']).toLowerCase();
        if (outcome === 'success') return 'ok';
        if (outcome === 'reject' || outcome === 'fail' || outcome === 'failed') return 'fail';
        if (outcome === 'waiting' || outcome === 'pending') return '';
        var rc = getParamLoose(p, ['returncode', 'returnCode', 'ReturnCode', 'Returncode']);
        if (rc === '00' || rc === '0') return 'ok';
        if (rc === '01' || rc === '99') return 'fail';
        var paySt = getParamLoose(p, ['paymentStatus', 'PaymentStatus', 'Paymentstatus']);
        var payU = paySt.toUpperCase();
        if (payU === 'SUCCEEDED' || payU === 'SUCCESS' || payU === 'PAID' || payU === 'SUCCESSFUL') return 'ok';
        if (payU === 'FAILED' || payU === 'FAIL' || payU === 'FAILURE' || payU === 'REJECTED') return 'fail';
        /* EP/NOTI 가맹 스키마: PaymentStatus 0=성공, 1=실패 (ChillPay 0–25 코드와 별개) */
        if (paySt === '0') return 'ok';
        if (paySt === '1') return 'fail';
        var raw = getParamLoose(p, [
          'PaymentStatus', 'paymentStatus', 'Paymentstatus',
          'Status', 'status',
          'Result', 'result',
          'PaymentState', 'paymentState'
        ]);
        var u = raw.toUpperCase();
        var succFlag = getParamLoose(p, ['success', 'Success']);
        if (succFlag === '1' || succFlag === 'Y' || succFlag === 'TRUE') return 'ok';
        /* ChillPay: Paid / Success — JPAY 3DS 복귀: succeeded (J-Pay Sync Callback) */
        if (u === 'PAID' || u === 'SUCCESS' || u === 'SUCCEEDED' || u === 'SUCCESSFUL' || u === 'S' || u === 'OK' || u === 'Y' || u === 'T') return 'ok';
        if (u === 'COMPLETE' || u === 'COMPLETED' || u === 'AUTHORIZED' || u === 'CAPTURE' || u === 'CAPTURED') return 'ok';
        /* J-Pay returncode in query (rsJpay → pay-result 폴백) */
        if (u === '00') return 'ok';
        /* ChillPay/ICOPAY 내부 숫자 코드 · EP PaymentStatus 0 */
        if (u === '10' || u === '0') return 'ok';
        if (u === '20' || u === '21' || u === '22' || u === '2') return 'cancel';
        if (u === '99' || u === 'F0' || u === '3' || u === '4' || u === '30' || u === '31' || u === '1') return 'fail';
        if (u === 'CANCEL' || u === 'CANCELLED' || u === 'VOID' || u === 'ABORT') return 'cancel';
        if (u === 'FAIL' || u === 'FAILED' || u === 'FAILURE' || u === 'ERROR' || u === 'N') return 'fail';
        if (u === 'PROCESSING' || u === 'PENDING') return 'cancel';
        return '';
      }
      function looksLikeElementPayResult(p, on) {
        var van = getParamLoose(p, ['van', 'pgKind', 'PgKind']).toLowerCase();
        if (van === 'elementpay' || van === 'ep') return true;
        if (/^EP/i.test(String(on || ''))) return true;
        var outcome = getParamLoose(p, ['outcome', 'elementpayReturn']).toLowerCase();
        return outcome === 'success' || outcome === 'reject' || outcome === 'waiting';
      }
      /** pay.html 과 동일: 브라우저 선호 언어 목록 → URL 결제 UI 코드 */
      function mapBrowserLocaleToUrlPayLang(tag) {
        if (!tag) return null;
        var s = String(tag).trim().toLowerCase();
        if (!s) return null;
        if (s.indexOf('ko') === 0) return 'KOR';
        if (s.indexOf('ja') === 0) return 'JPN';
        if (s.indexOf('zh') === 0 || s === 'zh-hant' || s.indexOf('zh-tw') === 0 || s.indexOf('zh-hk') === 0) return 'CHN';
        if (s.indexOf('th') === 0) return 'THA';
        if (s.indexOf('en') === 0) return 'ENG';
        return null;
      }
      function detectLang() {
        var list = [];
        try {
          if (navigator.languages && navigator.languages.length) {
            for (var li = 0; li < navigator.languages.length; li++) {
              list.push(navigator.languages[li]);
            }
          }
        } catch (e1) { /* ignore */ }
        try {
          if (navigator.language) list.push(navigator.language);
        } catch (e2) { /* ignore */ }
        for (var i = 0; i < list.length; i++) {
          var hit = mapBrowserLocaleToUrlPayLang(list[i]);
          if (hit) return hit;
        }
        return 'ENG';
      }
      function titleForKind() {
        if (kind === 'ok') {
          var a = pickMap(customCopy.resultSuccessMain).trim();
          return a || t('ok');
        }
        if (kind === 'waiting') {
          return t('waiting');
        }
        if (kind === 'cancel') {
          var b = pickMap(customCopy.resultFailMain).trim();
          return b || t('cancel');
        }
        var c = pickMap(customCopy.resultFailMain).trim();
        return c || t('fail');
      }
      function footForKind() {
        if (kind === 'ok') {
          return pickMap(customCopy.resultSuccessFoot).trim() || t('foot');
        }
        if (kind === 'waiting') {
          return t('foot');
        }
        return pickMap(customCopy.resultFailFoot).trim() || t('foot');
      }
      function applyResultUi() {
        var titleEl = document.getElementById('payResultTitle');
        var bodyEl = document.getElementById('payResultBody');
        var orderRow = document.getElementById('payResultOrderRow');
        var card = document.getElementById('payResultCard');
        var sub = document.getElementById('payResultSub');
        var foot = document.getElementById('payResultFoot');
        var btn = document.getElementById('payResultBtn');
        if (sub) sub.textContent = t('sub');
        if (foot) foot.textContent = footForKind();
        if (btn) {
          btn.textContent = t('btn');
          btn.style.display = kind === 'waiting' ? 'none' : '';
        }
        if (titleEl) titleEl.textContent = titleForKind();
        if (bodyEl) bodyEl.innerHTML = '';
        if (card) {
          card.classList.remove('alert-success', 'alert-danger', 'alert-warning', 'alert-info');
          if (kind === 'ok') card.classList.add('alert-success');
          else if (kind === 'waiting') card.classList.add('alert-info');
          else if (kind === 'cancel') card.classList.add('alert-warning');
          else card.classList.add('alert-danger');
        }
        if ((orderNo || txnId) && orderRow) {
          orderRow.style.display = 'block';
          var bits = [];
          if (orderNo) bits.push(esc(t('order')) + ': <strong>' + esc(orderNo) + '</strong>');
          if (txnId) bits.push(esc(t('txn')) + ': <strong>' + esc(txnId) + '</strong>');
          orderRow.innerHTML = bits.join('<br>');
        }
      }
      function setLang(code) {
        LANG = code;
        document.querySelectorAll('.pay-lang button').forEach(function (b) {
          b.classList.toggle('active', b.getAttribute('data-lang') === code);
        });
        try {
          var hl = { KOR: 'ko', ENG: 'en', CHN: 'zh', JPN: 'ja', THA: 'th' };
          document.documentElement.setAttribute('lang', hl[code] || 'en');
        } catch (eH) { /* ignore */ }
        applyResultUi();
      }

      function apiUrl(path, qs) {
        var u = API_BASE + path;
        if (qs) u += (u.indexOf('?') >= 0 ? '&' : '?') + qs;
        return u;
      }
      function fetchJson(url) {
        return fetch(url, { credentials: 'omit', cache: 'no-store' }).then(function (r) {
          return r.text().then(function (text) {
            if (!r.ok) throw new Error('HTTP ' + r.status);
            try {
              return text ? JSON.parse(text) : {};
            } catch (e1) {
              throw new Error('invalid JSON');
            }
          });
        });
      }
      function fetchJsonWithRetry(url, maxAttempts, pauseMs) {
        var n = Math.max(1, maxAttempts | 0);
        var pause = pauseMs != null ? pauseMs : 500;
        var attempt = 0;
        function tryOnce() {
          attempt++;
          return fetchJson(url).catch(function (err) {
            if (attempt >= n) return Promise.reject(err);
            return new Promise(function (resolve) { window.setTimeout(resolve, pause); }).then(tryOnce);
          });
        }
        return tryOnce();
      }

      var p = new URLSearchParams(window.location.search);
      merchantM = getParamLoose(p, ['m', 'M', 'compId', 'compid']);
      try {
        if (!merchantM) {
          var smM = sessionStorage.getItem('pg_pay_return_m');
          if (smM) merchantM = norm(smM);
        }
      } catch (eSmM) { /* ignore */ }
      orderNo = getParamLoose(p, ['OrderNo', 'orderNo', 'orderno']);
      txnId = getParamLoose(p, ['TransactionId', 'transactionId', 'TransId', 'transId']);
      try {
        if (!orderNo) orderNo = norm(sessionStorage.getItem('pg_pay_pending_order'));
      } catch (e3) {}
      try {
        if (!txnId) txnId = norm(sessionStorage.getItem('pg_pay_pending_txn'));
      } catch (e3b) {}
      kind = parseStatus(p);
      var epResult = looksLikeElementPayResult(p, orderNo);
      if (!kind && !epResult) kind = 'fail';
      if (!kind && epResult) kind = 'waiting';

      var qLang = norm(p.get('lang')).toUpperCase();
      if (qLang === 'KO' || qLang === 'KR') qLang = 'KOR';
      if (qLang === 'JA' || qLang === 'JP') qLang = 'JPN';
      if (qLang === 'ZH' || qLang === 'CN') qLang = 'CHN';
      if (qLang === 'TH') qLang = 'THA';
      if (qLang === 'EN') qLang = 'ENG';
      if (qLang === 'KOR' || qLang === 'ENG' || qLang === 'CHN' || qLang === 'JPN' || qLang === 'THA') {
        LANG = qLang;
      } else {
        LANG = detectLang();
      }

      document.querySelectorAll('.pay-lang button').forEach(function (btn) {
        btn.addEventListener('click', function () {
          setLang(btn.getAttribute('data-lang') || 'ENG');
        });
      });

      function resolveResetMerchantM() {
        if (merchantM) return merchantM;
        try {
          var sm = sessionStorage.getItem('pg_pay_return_m');
          return sm ? norm(sm) : '';
        } catch (e) {
          return '';
        }
      }
      function resolveReturnPageKind() {
        try {
          var qp = new URLSearchParams(window.location.search || '');
          var ck = norm(qp.get('checkout') || qp.get('from') || '').toLowerCase();
          if (ck === 'jpay-pay' || ck === 'jpay') return 'jpay-pay';
          if (ck === 'elementpay-pay' || ck === 'elementpay' || ck === 'ep') return 'elementpay-pay';
        } catch (eQ) { /* ignore */ }
        try {
          var kindStored = sessionStorage.getItem('pg_pay_return_page');
          if (kindStored) return String(kindStored).trim().toLowerCase();
        } catch (eS) { /* ignore */ }
        if (epResult) return 'elementpay-pay';
        return 'pay';
      }
      function readStoredReturnQuery() {
        try {
          var raw = sessionStorage.getItem('pg_pay_return_qs');
          return raw ? String(raw) : '';
        } catch (e) {
          return '';
        }
      }
      function goPayReset() {
        var mid = resolveResetMerchantM();
        var pageKind = resolveReturnPageKind();
        var extraQs = readStoredReturnQuery();
        if (pageKind === 'jpay-pay' && mid) {
          try {
            var u = new URL('/jpay-pay/' + encodeURIComponent(mid), window.location.origin);
            u.searchParams.set('lang', LANG);
            if (extraQs) {
              var extra = new URLSearchParams(extraQs);
              extra.forEach(function (v, k) {
                var kl = String(k || '').toLowerCase();
                if (kl === 'm' || kl === 'compid' || kl === 'lang') return;
                u.searchParams.set(k, v);
              });
            }
            window.location.href = u.pathname + (u.search ? u.search : '');
            return;
          } catch (eJ) {
            window.location.href = 'jpay-pay.html?m=' + encodeURIComponent(mid)
              + '&lang=' + encodeURIComponent(LANG)
              + (extraQs ? ('&' + extraQs) : '');
            return;
          }
        }
        if (pageKind === 'elementpay-pay' && mid) {
          try {
            var uEp = new URL('/checkout/' + encodeURIComponent(mid), window.location.origin);
            uEp.searchParams.set('lang', LANG);
            window.location.href = uEp.pathname + (uEp.search ? uEp.search : '');
            return;
          } catch (eEp) {
            window.location.href = 'elementpay-pay.html?m=' + encodeURIComponent(mid)
              + '&lang=' + encodeURIComponent(LANG);
            return;
          }
        }
        try {
          var qs = mid ? ('m=' + encodeURIComponent(mid) + '&lang=' + encodeURIComponent(LANG)) : ('lang=' + encodeURIComponent(LANG));
          var uPay = new URL('pay.html?' + qs, window.location.href).href;
          window.location.href = uPay;
        } catch (eU) {
          window.location.href = mid
            ? ('pay.html?m=' + encodeURIComponent(mid) + '&lang=' + encodeURIComponent(LANG))
            : ('pay.html?lang=' + encodeURIComponent(LANG));
        }
      }
      function returnAlertMessage() {
        if (kind === 'ok') return t('returnAlertOk');
        if (kind === 'cancel') return t('returnAlertCancel');
        return t('returnAlertFail');
      }
      function runAfterReturnNotice(alertMsg, fn) {
        if (fn == null) return;
        try {
          window.alert(alertMsg);
          fn();
          return;
        } catch (eA) { /* ignore */ }
        try {
          window.confirm(alertMsg);
          fn();
          return;
        } catch (eC) { /* ignore */ }
        var toast = document.createElement('div');
        toast.className = 'alert alert-info position-fixed bottom-0 start-50 translate-middle-x mb-3 px-4 py-3 shadow';
        toast.style.zIndex = '20000';
        toast.style.maxWidth = '92vw';
        toast.setAttribute('role', 'status');
        toast.textContent = alertMsg;
        document.body.appendChild(toast);
        window.setTimeout(function () {
          try { toast.remove(); } catch (eR) { /* ignore */ }
          fn();
        }, 2600);
      }
      function onConfirm() {
        if (kind === 'waiting') return;
        var msg = returnAlertMessage();
        runAfterReturnNotice(msg, function () {
          try {
            sessionStorage.removeItem('pg_pay_pending_txn');
          } catch (eTx) { /* ignore */ }
          try {
            sessionStorage.removeItem('pg_pay_pending_order');
          } catch (eOr) { /* ignore */ }
          /* 1) 팝업 등에서는 창 닫기 시도 → 2) 닫히지 않으면 결제 초기화(동일 호스트 pay.html?m=) */
          try {
            window.close();
          } catch (e4) { /* ignore */ }
          setTimeout(function () {
            goPayReset();
          }, 120);
        });
      }

      /** ElementPay: getStatus 로 화면·로컬(요청→성공)을 맞춘다. 웹훅 지연 시에도 복구. */
      function pollElementPayStatusThenFinish(done) {
        var paymentId = getParamLoose(p, ['paymentId', 'PaymentId', 'pid', 'id', 'TransactionId', 'transactionId']);
        if (!paymentId) {
          try { paymentId = norm(sessionStorage.getItem('pg_ep_pending_payment')); } catch (eP) { /* ignore */ }
        }
        if (!txnId && paymentId) txnId = paymentId;
        var attempts = 0;
        var max = kind === 'ok' ? 8 : 30;
        function tick() {
          attempts += 1;
          var last = attempts >= max;
          var q = 'compId=' + encodeURIComponent(merchantM || '')
            + (orderNo ? '&orderNo=' + encodeURIComponent(orderNo) : '')
            + (paymentId ? '&paymentId=' + encodeURIComponent(paymentId) : '')
            + (last ? '&finalize=1' : '');
          fetchJson(apiUrl('/api/pay/url/elementpay-status', q))
            .then(function (res) {
              var d = res && res.data ? res.data : {};
              var st = String(d.paymentStatus || '').toUpperCase();
              if (d.paymentId && !txnId) txnId = String(d.paymentId);
              if (st === 'PAID') {
                kind = 'ok';
                done();
                return;
              }
              if (st === 'FAILED' || st === 'REFUNDED' || st === 'DISPUTED' || st === 'REVERSED') {
                kind = 'fail';
                done();
                return;
              }
              if (last) {
                if (kind === 'waiting') kind = 'fail';
                done();
                return;
              }
              setTimeout(tick, 2000);
            })
            .catch(function () {
              if (attempts >= max) {
                if (kind === 'waiting') kind = 'fail';
                done();
                return;
              }
              setTimeout(tick, 2000);
            });
        }
        setTimeout(tick, kind === 'ok' ? 400 : 800);
      }

      function applyResultBrandLogo(ctx) {
        ctx = ctx || {};
        var mode = String(ctx.checkoutHeaderLogoMode || '').trim().toUpperCase();
        /* 미활성: 결제창은 로고 숨김이지만 결과 페이지는 요청대로 ICOPAY 텍스트 유지 */
        if (mode === 'DISABLED') {
          var brand0 = document.getElementById('payResultBrand');
          if (brand0) {
            brand0.style.display = '';
            var wrap0 = brand0.querySelector('.pay-brand-logo');
            if (wrap0) {
              wrap0.classList.remove('d-none');
              wrap0.innerHTML = '';
              wrap0.className = 'pay-brand-logo';
              wrap0.textContent = 'ICOPAY';
            }
          }
          return;
        }
        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyCheckoutHeaderLogo) {
          PG_URL_PAY_SHELL.applyCheckoutHeaderLogo(ctx, {
            brandBlockId: 'payResultBrand',
            logoWrapSelector: '.pay-brand-logo',
            t: function () { return 'ICOPAY'; }
          });
        }
        /* DEFAULT/ACTIVE 인데 URL 없으면 결제창과 같이 숨김 → 결과도 ICOPAY 텍스트로 폴백하지 않고 동일 동작 */
      }

      function finishBootWithCopy() {
        if (!merchantM) {
          applyResultBrandLogo({ checkoutHeaderLogoMode: 'DISABLED' });
          applyResultUi();
          return;
        }
        var q = 'compId=' + encodeURIComponent(merchantM);
        fetchJsonWithRetry(apiUrl('/api/pay/chillpay/url-result-copy', q), 4, 500).then(function (root) {
          var payload = root && root.data !== undefined ? root.data : root;
          if (payload && typeof payload === 'object') {
            customCopy = payload;
            applyResultBrandLogo(payload);
          } else {
            applyResultBrandLogo({ checkoutHeaderLogoMode: 'DISABLED' });
          }
          applyResultUi();
        }).catch(function () {
          applyResultBrandLogo({ checkoutHeaderLogoMode: 'DISABLED' });
          applyResultUi();
        });
      }

      function boot() {
        setLang(LANG);
        var btn0 = document.getElementById('payResultBtn');
        if (btn0) btn0.addEventListener('click', onConfirm);
        var needEpPoll = epResult && merchantM && orderNo;
        if (needEpPoll) {
          if (kind !== 'ok') {
            kind = 'waiting';
          }
          applyResultUi();
          pollElementPayStatusThenFinish(finishBootWithCopy);
          return;
        }
        if (!kind) kind = 'fail';
        finishBootWithCopy();
      }
      boot();
    })();
  </script>
</body>
</html>
