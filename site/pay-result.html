<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>Payment result</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/pay-inline.css?v=23" rel="stylesheet">
</head>
<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand mb-3">
        <div class="pay-brand-logo">ICOPAY</div>
        <div class="pay-brand-sub" id="payResultSub">Payment result</div>
      </div>
      <div id="payResultCard" class="alert mb-0" role="status">
        <h1 class="h5" id="payResultTitle">—</h1>
        <p class="mb-2" id="payResultBody"></p>
        <p class="small text-muted mb-3" id="payResultOrderRow" style="display:none;"></p>
        <button type="button" class="btn btn-primary btn-pay" id="payResultBtn">OK</button>
        <p class="small text-muted mt-3 mb-0" id="payResultFoot"></p>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var LANG = 'ENG';
      var I18N = {
        KOR: {
          sub: '결제 결과',
          ok: '결제가 완료되었습니다.',
          fail: '결제가 완료되지 않았거나 취소되었습니다.',
          cancel: '결제가 취소되었습니다.',
          order: '주문번호',
          btn: '확인',
          foot: '팝업으로 열렸다면 이 창을 닫아 주세요. 새 탭이라면 아래 버튼으로 결제 페이지로 돌아가거나 탭을 닫아 주세요.'
        },
        ENG: {
          sub: 'Payment result',
          ok: 'Your payment was completed.',
          fail: 'Payment was not completed or was cancelled.',
          cancel: 'Payment was cancelled.',
          order: 'Order no.',
          btn: 'OK',
          foot: 'If this opened in a popup, close the window. If it is a new tab, use the button below to return to checkout or close the tab.'
        }
      };
      function t(k) {
        var p = I18N[LANG] || I18N.ENG;
        return p[k] || I18N.ENG[k] || k;
      }
      function esc(s) {
        var d = document.createElement('div');
        d.textContent = s == null ? '' : String(s);
        return d.innerHTML;
      }
      function norm(s) {
        return (s == null ? '' : String(s)).trim();
      }
      function detectLang() {
        var nav = (navigator.language || 'en').toLowerCase();
        if (nav.indexOf('ko') === 0) return 'KOR';
        return 'ENG';
      }
      function parseStatus(p) {
        var raw = norm(p.get('PaymentStatus') || p.get('paymentStatus') || p.get('status') || p.get('Result') || p.get('result'));
        var u = raw.toUpperCase();
        if (u === 'PAID' || u === 'SUCCESS' || u === 'S' || u === 'OK' || u === 'Y' || p.get('success') === '1') return 'ok';
        if (u === 'CANCEL' || u === 'CANCELLED' || u === 'VOID' || u === 'ABORT') return 'cancel';
        if (u === 'FAIL' || u === 'FAILED' || u === 'ERROR' || u === 'N') return 'fail';
        return '';
      }
      LANG = detectLang();
      var p = new URLSearchParams(window.location.search);
      var m = norm(p.get('m'));
      var orderNo = norm(p.get('OrderNo') || p.get('orderNo') || p.get('orderno'));
        try {
          if (!orderNo) orderNo = norm(sessionStorage.getItem('pg_pay_pending_order'));
        } catch (e) {}
      var kind = parseStatus(p);
      if (!kind) kind = 'fail';

      var titleEl = document.getElementById('payResultTitle');
      var bodyEl = document.getElementById('payResultBody');
      var orderRow = document.getElementById('payResultOrderRow');
      var card = document.getElementById('payResultCard');
      var sub = document.getElementById('payResultSub');
      var foot = document.getElementById('payResultFoot');
      var btn = document.getElementById('payResultBtn');

      if (sub) sub.textContent = t('sub');
      if (foot) foot.textContent = t('foot');
      if (btn) btn.textContent = t('btn');

      var title = kind === 'ok' ? t('ok') : (kind === 'cancel' ? t('cancel') : t('fail'));
      if (titleEl) titleEl.textContent = title;
      if (bodyEl) bodyEl.innerHTML = '';
      if (card) {
        card.classList.remove('alert-success', 'alert-danger', 'alert-warning');
        if (kind === 'ok') card.classList.add('alert-success');
        else if (kind === 'cancel') card.classList.add('alert-warning');
        else card.classList.add('alert-danger');
      }
      if (orderNo && orderRow) {
        orderRow.style.display = 'block';
        orderRow.innerHTML = esc(t('order')) + ': <strong>' + esc(orderNo) + '</strong>';
      }

      function onConfirm() {
        try {
          window.close();
        } catch (e) {}
        setTimeout(function () {
          if (m) {
            window.location.href = 'pay.html?m=' + encodeURIComponent(m);
            return;
          }
          if (window.history.length > 1) {
            window.history.back();
            return;
          }
          window.location.href = 'pay.html';
        }, 120);
      }
      if (btn) btn.addEventListener('click', onConfirm);
    })();
  </script>
</body>
</html>
