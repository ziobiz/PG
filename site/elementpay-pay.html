<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="/js/jpay-contact-fields.js?v=3"></script>

  <style>
    .ep-qr-wrap { text-align: center; margin: 12px 0; }
    .ep-qr-wrap img { max-width: 220px; height: auto; }
    .ep-iframe-wrap iframe { width: 100%; min-height: 520px; border: 0; border-radius: 8px; }
  </style>

<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand" id="epBrandBlock">
        <div class="pay-brand-logo">ICOPAY</div>
        <div class="pay-brand-sub" data-i18n="brandSub3ds">3DS Secure Payment</div>
      </div>
      <div class="pay-lang" role="group" aria-label="Language" data-i18n-aria="langGroup">
        <button type="button" data-lang="JPN">JPN</button>
        <button type="button" data-lang="KOR">KOR</button>
        <button type="button" data-lang="ENG">ENG</button>
        <button type="button" data-lang="CHN">CHN</button>
        <button type="button" data-lang="THA">THA</button>
      </div>
      <div id="configError" class="alert alert-warning pay-alert-config" style="display:none;"></div>
      <div id="payResult" class="pay-result" style="display:none;"></div>
      <div id="epPaymentPanel" style="display:none;">
        <div id="epQrPanel" class="ep-qr-wrap" style="display:none;"></div>
        <div id="epIframePanel" class="ep-iframe-wrap" style="display:none;"></div>
      </div>
      <form id="epForm" autocomplete="off">
        <input type="hidden" id="compIdHidden" name="compId">
        <input type="hidden" id="orderNo" name="orderNo">
        <input type="hidden" id="paymentMethod" name="paymentMethod" value="CARD">
        <div class="pay-form-grid mb-3">
          <div class="pay-row pay-row-static">
            <div class="pay-row-label"><span data-i18n="merchant">Merchant</span></div>
            <div class="pay-row-value"><span id="merchantNameDisplay">—</span></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="item"><span data-i18n="item">Item</span></label>
            <div class="pay-row-value"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="item" required></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="amount"><span data-i18n="amount">Amount</span> <span class="pay-currency-hint text-muted fw-normal" id="payAmountCurrencyHint">(THB)</span></label>
            <div class="pay-row-value">
              <input type="number" class="form-control form-control-sm pay-input-round jpay-field-input" id="amount" required min="0.01" step="0.01">
              <p class="small text-muted mb-0 mt-1 d-none" id="payAmountScaleNotice"></p>
            </div>
          </div>
          <div class="pay-row d-none" id="payFxDisplayCurrencyRow">
            <label class="pay-row-label mb-0" for="payDisplayCurrencySelect"><span data-i18n="fxDisplayCurrency">Display currency</span></label>
            <div class="pay-row-value d-flex align-items-center gap-2 flex-wrap">
              <select class="form-select form-select-sm pay-input-round jpay-field-input" id="payDisplayCurrencySelect" style="max-width:8rem"></select>
              <span class="small text-muted" id="payFxDisplayCurrencyStatic"></span>
            </div>
          </div>
          <div class="pay-row d-none" id="payFxQuoteRow">
            <div class="pay-row-label"><span data-i18n="fxThbEstimate">Estimated charge</span></div>
            <div class="pay-row-value"><span id="payFxThbEstimateText" class="small fw-semibold">—</span></div>
          </div>
        </div>
        <div class="pay-label mb-1"><span id="payCardSectionLabel" data-i18n="card">Card</span></div>
        <p class="small text-muted mb-2 d-none" id="payCardNoteText"></p>
        <div class="mb-2" id="payCardBrandRow">
          <select class="form-select form-select-sm pay-input-round jpay-field-input" id="payCardBrandSelect" data-i18n-aria="cardAutoDetectOption" aria-label="Card auto detect">
            <option value="AUTO" data-i18n="cardAutoDetectOption">Card auto detect</option>
            <option value="VISA">Visa</option>
            <option value="MASTERCARD">Mastercard</option>
            <option value="JCB">JCB</option>
            <option value="UNIONPAY">UnionPay (62…)</option>
            <option value="AMEX">American Express</option>
          </select>
        </div>
        <div id="payCardPolicyAlert" class="alert alert-danger py-2 small d-none mb-2" role="alert"></div>
        <div class="row g-2 mb-2">
          <div class="col-12"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payCardno" inputmode="numeric" autocomplete="cc-number" data-i18n-placeholder="cardNo" required></div>
        </div>
        <div class="row g-2 mb-2 pay-expiry-row" id="payCardExpiryRow">
          <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payCardmonth" maxlength="2" data-i18n-placeholder="mm" required></div>
          <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payCardyear" maxlength="4" data-i18n-placeholder="yyyy" required></div>
          <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payCardcvv" maxlength="4" data-i18n-placeholder="cvv" required></div>
        </div>
        <div class="row g-2 mb-2" id="nameRow">
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payFirstname" data-i18n-placeholder="firstName" required></div>
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payLastname" data-i18n-placeholder="lastName" required></div>
        </div>
        <div class="row g-2 mb-2" id="contactRow">
          <div class="col-12"><input type="email" class="form-control form-control-sm pay-input-round jpay-field-input" id="payEmailAddress" data-i18n-placeholder="email" required></div>
          <div class="col-12">
            <label class="pay-label mb-1 d-block" for="payContactCountryCode" data-i18n="countryCode">Country code</label>
            <select class="form-select form-select-sm pay-input-round jpay-field-input" id="payContactCountryCode" required data-i18n-aria="countryCode" aria-label="Country code"></select>
          </div>
          <div class="col-12">
            <label class="pay-label mb-1 d-block" for="payTelephone" data-i18n="phone">Phone</label>
            <input type="tel" class="form-control form-control-sm pay-input-round jpay-field-input" id="payTelephone" data-i18n-placeholder="phoneHint" required inputmode="tel" autocomplete="tel-national">
          </div>
          <input type="hidden" id="payCountryIsoCode2">
        </div>
        <div class="pay-label mb-2" id="billingLabel" data-i18n="shipping">Shipping address</div>
        <div class="row g-2 mb-3" id="billingAddressRow">
          <div class="col-12"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payStreetAddress1" data-i18n-placeholder="address" required></div>
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payCity" data-i18n-placeholder="city" required></div>
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payPostcode" data-i18n-placeholder="postcode" required></div>
        </div>
        <button type="submit" class="btn btn-primary btn-pay w-100" id="submitBtn" data-i18n="pay">Pay</button>
        <p class="small text-primary mt-2 mb-0 text-center" id="elementPaySandboxHint" style="display:none;"></p>
      </form>
    </div>
  </div>

        if (!tag) return null;

        if (s.indexOf('ko') === 0) return 'KOR';
        if (s.indexOf('ja') === 0) return 'JPN';
        if (s.indexOf('zh') === 0) return 'CHN';
        if (s.indexOf('th') === 0) return 'THA';
        if (s.indexOf('en') === 0) return 'ENG';
        return null;
      }

          if (raw === 'JA' || raw === 'JP') raw = 'JPN';
          if (raw === 'ZH' || raw === 'CN') raw = 'CHN';
          if (raw === 'TH') raw = 'THA';
          if (raw === 'EN') raw = 'ENG';
          if (raw === 'KOR' || raw === 'ENG' || raw === 'CHN' || raw === 'JPN' || raw === 'THA') return raw;
        } catch (eQ) { /* ignore */ }

          try {
            var shellLang = PG_URL_PAY_SHELL.resolveInitialLang();
            if (shellLang) return shellLang;
          } catch (eS) { /* ignore */ }
        }
        var list = [];
        try {
          if (navigator.languages && navigator.languages.length) {
            for (var li = 0; li < navigator.languages.length; li++) list.push(navigator.languages[li]);
          }
        } catch (e1) { /* ignore */ }
        try { if (navigator.language) list.push(navigator.language); } catch (e2) { /* ignore */ }
        for (var i = 0; i < list.length; i++) {
          var hit = mapBrowserLocaleToUrlPayLang(list[i]);
          if (hit) return hit;
        }
        return 'ENG';
      }

        var list = [];

          if (navigator.languages && navigator.languages.length) {

          var hit = mapBrowserLocaleToUrlPayLang(list[i]);
          if (hit) return hit;
        }
        return 'ENG';

      function t(key) {
        var pack = I18N[LANG] || I18N.ENG;
        return pack[key] != null ? pack[key] : (I18N.ENG[key] || key);
      }
      function localizeEpStatusDetail(detail) {
        var raw = String(detail || '').trim();
        if (!raw) return '';
        var low = raw.toLowerCase();
        if (low.indexOf('rejected by bank') >= 0) return t('statusRejectedByBank');
        return raw;
      }
      function localizeMsg(msg, code) {
        if (window.PG_ELEMENTPAY_PAY_MSG && PG_ELEMENTPAY_PAY_MSG.translate && code) {
          var tr = PG_ELEMENTPAY_PAY_MSG.translate(code, LANG);
          if (tr && tr !== code) return tr;
        }
        return msg || t('payFailed');
      }
      function resolveApiErrorMessage(res) {
        res = res || {};
        var code = res.errorCode ? String(res.errorCode).trim() : '';
        if (code === 'ORG_DISABLED' || code === 'WEB_PAYMENT_DISABLED') return res.message || t('orgDisabled');
        if (code === 'ORDER_DUP' || code === 'ORDER_ALREADY_ATTEMPTED') return t('errOrderDup');
        if (code === 'ORDER_PENDING') return t('errOrderPending');
        if (code === 'PRESALE_RISK_FILTER') return t('errPresaleRiskFilter');
        if (code === 'BELOW_MIN_AMOUNT') return t('errBelowMinAmount');
        if (code === 'INACTIVE_CARD') return t('errInactiveCard');
        if (code === 'BLACKLIST') return t('errBlacklistCard');
        if (code.indexOf('CARD_COOLDOWN') === 0) return t('errCardCooldown');
        return localizeMsg(res.message || '', code) || t('payFailed');
      }

        if (c === 'ZH' || c === 'CN') c = 'CHN';
        if (c === 'TH') c = 'THA';
        if (c === 'EN') c = 'ENG';
        if (['KOR', 'ENG', 'CHN', 'JPN', 'THA'].indexOf(c) < 0) return;

      function applyI18n() {

          var k = el.getAttribute('data-i18n');
          if (k) el.textContent = t(k);
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {

      function getCompId() {
        try {
          var p = new URLSearchParams(location.search);
          var q = (p.get('m') || p.get('compId') || p.get('merchant') || '').trim();
          if (q) return q;
        } catch (e0) { /* ignore */ }
        try {
          var path = (location.pathname || '').replace(/\/+$/, '');
          var seg = path.split('/').filter(Boolean);
          var roots = {
            checkout: 1, pay: 1, 'pay-repay': 1,
            'jpay-pay': 1, 'elementpay-pay': 1, 'eximbay-pay': 1, 'ilk-pay': 1
          };
          if (seg.length >= 2 && roots[String(seg[0]).toLowerCase()] && String(seg[1]).indexOf('.') < 0) {
            return String(seg[1]).trim();
          }
        } catch (e1) { /* ignore */ }
        return '';
      }

      function apiUrl(path, qs) {
        return API_BASE + path + (qs ? ('?' + qs) : '');
      }
      function fetchJson(url, opts) {
        return fetch(url, opts || { credentials: 'omit', cache: 'no-store' }).then(function (r) {
          return r.text().then(function (text) {
            var j = text ? JSON.parse(text) : {};
            if (!r.ok) throw new Error((j && j.message) || text || ('HTTP ' + r.status));
            return j;
          });
        });
      }

          return path;
        }
        if (cid) return '/checkout/' + encodeURIComponent(cid);

      /** URL 결제: 닫기 시도 후(팝업이 아니면) 결제 초기 화면으로 복귀. API 연동에는 사용하지 않음. */

          if (orderNo) dest.searchParams.set('orderNo', orderNo);
          dest.searchParams.set('icopay_status', 'paid');
          setTimeout(function () { location.href = dest.toString(); }, 600);

          var sep = ru.indexOf('?') >= 0 ? '&' : '?';

      function buildOrderNo(compId) {
        var c = String(compId || 'X').replace(/[^0-9A-Za-z]/g, '').slice(0, 6);
        return ('EP' + c + Date.now()).slice(0, 40);

      /**
       * JPAY/ChillPay 형 INLINE:
       * - 카드는 ICOPAY 폼에서 1회만 입력
       * - BKB/3DS 는 자동 제출·전체창 이동 후 ICOPAY 결과 페이지로 복귀
       * - Light 카테고리/이중 카드입력 UI 미사용
       */
      function showPaymentUi(data) {
        data = data || {};
        document.getElementById('epForm').style.display = 'none';
        document.getElementById('epPaymentPanel').style.display = 'none';
        var qr = document.getElementById('epQrPanel');
        var iframePanel = document.getElementById('epIframePanel');
        if (qr) qr.style.display = 'none';
        if (iframePanel) iframePanel.style.display = 'none';
        if (data.qrCodeDataUri) {
          document.getElementById('epPaymentPanel').style.display = 'block';
          qr.style.display = 'block';
          qr.innerHTML = '<p>' + t('scanQr') + '</p><img src="' + data.qrCodeDataUri + '" alt="QR">';
          return;
        }
        var bkb = data.bkbInlineCheckout;
        if (bkb && bkb.actionUrl) {
          startBkbInlineCheckout(bkb, data);
          return;
        }
        var acs = data.redirectUrl || data.epCardFormUrl || '';
        if (acs && (data.needs3ds || data.inlineAcs) && !isLightCategoryUrl(acs) && !isIcopayCheckoutUrl(acs)) {
          try {
            sessionStorage.setItem('pg_ep_pending_order', data.orderNo || '');
            sessionStorage.setItem('pg_ep_pending_payment', data.paymentId || '');
          } catch (eS) {}
          if (window.IcopayCheckout3ds && IcopayCheckout3ds.navigateToPaymentUrl) {
            IcopayCheckout3ds.navigateToPaymentUrl(acs, { embed: false, waitMessage: t('waitInlinePay') });
          } else {
            location.href = acs;
          }
          return;
        }
        showErr(t('errInlinePay') || t('errNoHostedPay') || 'Inline payment path missing.');
      }

      function isLightCategoryUrl(url) {
        var u = String(url || '').toLowerCase();
        return u.indexOf('/merchant/light') >= 0
          && (u.indexOf('/services/') >= 0 || u.indexOf('/categories') >= 0 || u.indexOf('#/services') >= 0);
      }

      function isIcopayCheckoutUrl(url) {
        var u = String(url || '').toLowerCase();
        return u.indexOf('icopay.co.kr/checkout/') >= 0 || (u.indexOf('/checkout/') >= 0 && u.indexOf('elementpayreturn') >= 0);
      }

      /** 카드 필드 포함 숨은 폼을 같은 탭(_top)으로 자동 POST — 별도 팝업 없음. */
      function startBkbInlineCheckout(bkb, data) {
        var action = String((bkb && bkb.actionUrl) || '').trim();
        if (!action || isIcopayCheckoutUrl(action) || isLightCategoryUrl(action)) {
          var fallback = (data && (data.redirectUrl || data.epCardFormUrl)) || '';
          if (fallback && !isIcopayCheckoutUrl(fallback) && !isLightCategoryUrl(fallback)) {
            try {
              sessionStorage.setItem('pg_ep_pending_order', (data && data.orderNo) || '');
              sessionStorage.setItem('pg_ep_pending_payment', (data && data.paymentId) || '');
            } catch (eF) {}
            if (window.IcopayCheckout3ds && IcopayCheckout3ds.navigateToPaymentUrl) {
              IcopayCheckout3ds.navigateToPaymentUrl(fallback, { embed: false, waitMessage: t('waitInlinePay') });
            } else {
              location.href = fallback;
            }
            return;
          }
          showResult(false, t('errInlinePay'));
          return;
        }
        if (window.IcopayCheckout3ds && IcopayCheckout3ds.showWaitOverlay) {
          IcopayCheckout3ds.showWaitOverlay(t('waitInlinePay'));
        }
        try {
          sessionStorage.setItem('pg_ep_pending_order', (data && data.orderNo) || '');
          sessionStorage.setItem('pg_ep_pending_payment', (data && data.paymentId) || '');
        } catch (eS) {}
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = action;
        form.target = '_top';
        form.acceptCharset = 'UTF-8';
        form.style.display = 'none';
        var skip = { actionUrl: 1, cardFormSource: 1, needsBkbForm: 1 };
        Object.keys(bkb).forEach(function (k) {
          if (skip[k]) return;
          var inp = document.createElement('input');
          inp.type = 'hidden';
          inp.name = k;
          inp.value = bkb[k] != null ? String(bkb[k]) : '';
          form.appendChild(inp);
        });
        document.body.appendChild(form);
        try { form.submit(); } catch (eSub) {
          showResult(false, (eSub && eSub.message) || t('payFailed'));
        }
      }

      function resolveEpReturnKindFromLocation() {
        try {
          var qs = new URLSearchParams(location.search);
          var v = (qs.get('elementpayReturn') || '').trim().toLowerCase();
          if (v === 'success' || v === 'reject' || v === 'waiting') return v;
          /* EP/은행이 `elementpayReturn=waiting` 을 `elementpayReturn-waiting` 으로 깨뜨리는 경우 */
          var raw = String(location.search || '');
          if (/[?&]elementpayReturn-success(?:&|$)/i.test(raw) || /[?&]elementpayReturn=success(?:&|$)/i.test(raw)) return 'success';
          if (/[?&]elementpayReturn-reject(?:&|$)/i.test(raw) || /[?&]elementpayReturn=reject(?:&|$)/i.test(raw)) return 'reject';
          if (/[?&]elementpayReturn-waiting(?:&|$)/i.test(raw) || /[?&]elementpayReturn=waiting(?:&|$)/i.test(raw)) return 'waiting';
        } catch (e) {}
        return '';
      }

      function resolveEpReturnIdsFromLocation() {
        var out = { orderNo: '', paymentId: '' };
        try {
          var qs = new URLSearchParams(location.search);
          out.orderNo = (qs.get('orderNo') || qs.get('order') || '').trim();
          out.paymentId = (qs.get('paymentId') || qs.get('pid') || qs.get('id') || '').trim();
        } catch (e2) {}
        return out;
      }

      function startInlineStatusPoll(data) {
        var orderNo = (data && data.orderNo) || '';
        var paymentId = (data && data.paymentId) || '';
        try {
          if (!orderNo) orderNo = sessionStorage.getItem('pg_ep_pending_order') || '';
          if (!paymentId) paymentId = sessionStorage.getItem('pg_ep_pending_payment') || '';
          var fromUrl = resolveEpReturnIdsFromLocation();
          if (!orderNo) orderNo = fromUrl.orderNo;
          if (!paymentId) paymentId = fromUrl.paymentId;
        } catch (e0) {}
        var compId = getCompId() || document.getElementById('compIdHidden').value;
        var attempts = 0;
        var max = 60;
        function tick() {
          attempts += 1;
          if (!orderNo && !paymentId) {
            if (window.IcopayCheckout3ds && IcopayCheckout3ds.hideWaitOverlay) IcopayCheckout3ds.hideWaitOverlay();
            showResult(false, t('errPayIncomplete'));
            return;
          }
          var q = 'compId=' + encodeURIComponent(compId || '')
            + (orderNo ? '&orderNo=' + encodeURIComponent(orderNo) : '')
            + (paymentId ? '&paymentId=' + encodeURIComponent(paymentId) : '');
          fetchJson(apiUrl('/api/pay/url/elementpay-status', q))
            .then(function (res) {
              var st = res && res.data ? String(res.data.paymentStatus || '').toUpperCase() : '';
              if (st === 'PAID') {
                if (window.IcopayCheckout3ds && IcopayCheckout3ds.hideWaitOverlay) IcopayCheckout3ds.hideWaitOverlay();
                showResult(true, '');
                return;
              }
              if (st === 'FAILED') {
                if (window.IcopayCheckout3ds && IcopayCheckout3ds.hideWaitOverlay) IcopayCheckout3ds.hideWaitOverlay();
                var detail = res && res.data && res.data.statusMessage ? String(res.data.statusMessage).trim() : '';
                showResult(false, detail);
                return;
              }
              if (attempts >= max) {
                if (window.IcopayCheckout3ds && IcopayCheckout3ds.hideWaitOverlay) IcopayCheckout3ds.hideWaitOverlay();
                showResult(false, t('errPayIncomplete'));
                return;
              }
              setTimeout(tick, 2000);
            })
            .catch(function () {
              if (attempts >= max) {
                if (window.IcopayCheckout3ds && IcopayCheckout3ds.hideWaitOverlay) IcopayCheckout3ds.hideWaitOverlay();
                showResult(false, t('errPayIncomplete'));
                return;
              }
              setTimeout(tick, 2000);
            });
        }
        setTimeout(tick, 800);
      }

        if (!tok) return Promise.reject(new Error(t('errInvalidSession')));
        return fetchJson(apiUrl('/api/middleware/v1/merchant/checkout/session', 'token=' + encodeURIComponent(tok)))
          .then(function (res) {

            sessionPayload = res.data;

            applyBillingPrefill(res.data.buyerPrefill || res.data.prefill);

            }
          });
        } else if (window.PG_CARD_PAY_POLICY && typeof PG_CARD_PAY_POLICY.attachPanFormatter === 'function') {
          var panOnly = document.getElementById('payCardno');
          var brandSel = document.getElementById('payCardBrandSelect');
          if (panOnly) {
            PG_CARD_PAY_POLICY.attachPanFormatter(panOnly, function () {
              return brandSel && brandSel.value ? brandSel.value : 'AUTO';
            });
          }
        }

        if (checkoutCtx.merchantName) {
          document.getElementById('merchantNameDisplay').textContent = checkoutCtx.merchantName;
        }
        var itemEl = document.getElementById('item');
        if (itemEl && !itemEl.readOnly && checkoutCtx.defaultProductName) {
          itemEl.value = String(checkoutCtx.defaultProductName).trim();
        }
        var curHint = document.getElementById('payAmountCurrencyHint');
        if (curHint && !urlPayDisplayFxActive && (checkoutCtx.checkoutCurrencyCode || checkoutCtx.defaultCurrency)) {
          curHint.textContent = '(' + String(checkoutCtx.checkoutCurrencyCode || checkoutCtx.defaultCurrency).trim().toUpperCase() + ')';
        }

        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyCheckoutHeaderLogo) {
          PG_URL_PAY_SHELL.applyCheckoutHeaderLogo(checkoutCtx, {
            brandBlockId: 'epBrandBlock',
            logoWrapSelector: '.pay-brand-logo',
            t: t
          });
        }
        applyI18n();
        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyUrlPayInputMode) {
          PG_URL_PAY_SHELL.applyUrlPayInputMode(checkoutCtx, {
            getLang: function () { return LANG; },
            setLang: setLang,
            detectBrowserLang: detectBrowserUrlPayLang
          });
        } else if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyUrlPayPresentationOptions) {
          PG_URL_PAY_SHELL.applyUrlPayPresentationOptions(checkoutCtx, {
            getLang: function () { return LANG; },
            setLang: setLang,
            detectBrowserLang: detectBrowserUrlPayLang
          });
        }
        if (window.PG_URL_PAY_SHELL) {
          if (PG_URL_PAY_SHELL.applyCardCopyPresentation) {
            PG_URL_PAY_SHELL.applyCardCopyPresentation({
              lang: LANG, cardCopy: window.__payUrlCardCopy, t: t, skipBrandSub: true
            });
          }
          if (PG_URL_PAY_SHELL.applyAmountScaleNotice) {
            PG_URL_PAY_SHELL.applyAmountScaleNotice({ lang: LANG, cardCopy: window.__payUrlCardCopy, scaleMode: urlPayAmountScaleMode });
          }
          if (PG_URL_PAY_SHELL.applyCheckoutHeaderSubtitle) {
            PG_URL_PAY_SHELL.applyCheckoutHeaderSubtitle(checkoutCtx, { t: t });
          }
          if (PG_URL_PAY_SHELL.applyUrlPayBrowserTabTitle) {
            PG_URL_PAY_SHELL.applyUrlPayBrowserTabTitle(LANG, window.__payUrlCardCopy, t);
          }
        }
        initContactFields(checkoutCtx);
        if (window.PG_PAY_FORM_INPUT_GUARD) {
          PG_PAY_FORM_INPUT_GUARD.initJpayForm(document.getElementById('epForm'), { t: t });
        }
        if (window.PG_JPAY_CONTACT_REMEMBER) {
          var contactRow = document.getElementById('contactRow');
          PG_JPAY_CONTACT_REMEMBER.ensureCheckbox(contactRow, checkoutCtx, t);
          PG_JPAY_CONTACT_REMEMBER.applyRemembered(document.getElementById('epForm'), getCompId(), checkoutCtx, {});
        }
        if (PAY_ENTRY_MERCHANT_API) {
          var brand = document.getElementById('epBrandBlock');
          if (brand) brand.style.display = 'none';
        }
      }

      if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.wireLanguageButtons) {
        PG_URL_PAY_SHELL.wireLanguageButtons(function () { return LANG; }, setLang);
      } else {
      document.querySelectorAll('.pay-lang button[data-lang]').forEach(function (b) {
        b.addEventListener('click', function () { setLang(b.getAttribute('data-lang')); });
      });
      }

      document.getElementById('epForm').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var btn = document.getElementById('submitBtn');
        if (!assertSessionMatchesForm()) {
          showErr(t('errSessionMismatch'));
          return;
        }
        if (!assertPrefillReadyForSubmit()) {
          showErr(t('errPrefillRequired'));
          return;
        }
        if (window.PG_PAY_SUBMIT_GUARD && PG_PAY_SUBMIT_GUARD.lock) {
          if (PG_PAY_SUBMIT_GUARD.lock(btn)) return;
        } else if (window.PG_PAY_SUBMIT_GUARD && PG_PAY_SUBMIT_GUARD.tryLock) {
          if (!PG_PAY_SUBMIT_GUARD.tryLock({ lang: LANG, t: t, button: btn, onWarn: showPayWarn })) return;
        } else {
          btn.disabled = true;
        }

        function unlockBtn() {
          if (window.PG_PAY_SUBMIT_GUARD) {
            if (PG_PAY_SUBMIT_GUARD.unlock) PG_PAY_SUBMIT_GUARD.unlock(btn);
            else if (PG_PAY_SUBMIT_GUARD.unlockAfterFailure) PG_PAY_SUBMIT_GUARD.unlockAfterFailure({ button: btn });
          } else {
            btn.disabled = false;
          }
        }

        function submitAfterCardPolicy() {
          if (cardPolicyCtrl && typeof cardPolicyCtrl.validateFinal === 'function') {
            var cardChk = cardPolicyCtrl.validateFinal();
            if (!cardChk.valid) {
              showErr(cardChk.message || t('errLoad'));
              unlockBtn();
              return;
            }
          }
          var formEl = document.getElementById('epForm');
          if (window.PG_JPAY_CONTACT) PG_JPAY_CONTACT.syncBeforeSubmit(formEl);
          if (window.PG_JPAY_CONTACT_REMEMBER) {
            PG_JPAY_CONTACT_REMEMBER.saveIfChecked(formEl, getCompId(), document.getElementById('jpayContactRemember'));
          }
          var ccVal = window.PG_JPAY_CONTACT
            ? PG_JPAY_CONTACT.readCountryIso2(formEl)
            : (document.getElementById('payCountryIsoCode2').value || '').trim().toUpperCase();
          if (ccVal.length !== 2) {
            showErr(t('errCountryCode'));
            unlockBtn();
            return;
          }
          var cvvRaw = (document.getElementById('payCardcvv').value || '').trim();
          if (!/^\d{3,4}$/.test(cvvRaw)) {
            showErr(t('errCvvFormat'));
            unlockBtn();
            return;
          }
          var pfg = window.PG_PAY_FORM_INPUT_GUARD;
          if (pfg) {
            var fnVal = document.getElementById('payFirstname').value.trim();
            var lnVal = document.getElementById('payLastname').value.trim();
            if (!pfg.validateEnglishName(fnVal) || !pfg.validateEnglishName(lnVal)) {
              showErr(t('errEnglishName'));
              unlockBtn();
              return;
            }
            var emVal = document.getElementById('payEmailAddress').value.trim();
            if (!pfg.validateEmail(emVal)) {
              showErr(t('errEmailFormat'));
              unlockBtn();
              return;
            }
            var telVal = document.getElementById('payTelephone').value.trim();
            if (!pfg.validatePhoneDigits(telVal)) {
              showErr(t('errPhoneDigits'));
              unlockBtn();
              return;
            }
          }
        var compId = getCompId() || document.getElementById('compIdHidden').value;
          var amtStr = String(document.getElementById('amount').value || '').replace(/,/g, '').trim();
          if (!(parseFloat(amtStr) > 0)) {
            showResult(false, t('needAmount'));
            unlockBtn();
            return;
          }
          var itemVal = (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.resolveUrlPayItemValue)
            ? PG_URL_PAY_SHELL.resolveUrlPayItemValue(checkoutCtx)
            : document.getElementById('item').value;
        var body = {
          compId: compId,
          orderNo: document.getElementById('orderNo').value.trim() || buildOrderNo(compId),
            amount: amtStr,
          currency: 'THB',
            item: itemVal,
            paymentMethod: 'CARD',
            payCardno: window.PG_CARD_PAY_POLICY
              ? PG_CARD_PAY_POLICY.digitsOnly(document.getElementById('payCardno').value)
              : document.getElementById('payCardno').value.replace(/\D/g, ''),
            payCardBrand: (function () {
              var sel = document.getElementById('payCardBrandSelect');
              var v = sel && sel.value ? String(sel.value).trim() : 'AUTO';
              return v === 'AUTO' && window.PG_CARD_PAY_POLICY
                ? PG_CARD_PAY_POLICY.detectBrand(PG_CARD_PAY_POLICY.digitsOnly(document.getElementById('payCardno').value))
                : v;
            })(),
            payCardmonth: cardExpiryCtrl && cardExpiryCtrl.getMonth
              ? cardExpiryCtrl.getMonth()
              : document.getElementById('payCardmonth').value.trim(),
            payCardyear: cardExpiryCtrl && cardExpiryCtrl.getYear4
              ? cardExpiryCtrl.getYear4()
              : document.getElementById('payCardyear').value.trim(),
            payCardcvv: cvvRaw,
            payFirstname: document.getElementById('payFirstname').value.trim(),
            payLastname: document.getElementById('payLastname').value.trim(),
            payEmailAddress: document.getElementById('payEmailAddress').value.trim(),
            payTelephone: document.getElementById('payTelephone').value.trim(),
            payCountryIsoCode2: ccVal,
            payStreetAddress1: document.getElementById('payStreetAddress1').value.trim(),
            payCity: document.getElementById('payCity').value.trim(),
            payPostcode: document.getElementById('payPostcode').value.trim(),
          lang: LANG,
          entry: PAY_ENTRY_MERCHANT_API ? 'merchant_api' : 'url'
        };
        fetchJson(apiUrl('/api/pay/url/sale'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
          credentials: 'omit',
          cache: 'no-store'
        }).then(function (res) {
            if (!res.success) throw new Error(resolveApiErrorMessage(res));
          showPaymentUi(res.data || res);
        }).catch(function (err) {
            showResult(false, (err && err.message) || t('payFailed'));
        }).finally(function () {
            unlockBtn();
          });
        }

        if (cardPolicyCtrl && typeof cardPolicyCtrl.checkServerNow === 'function') {
          cardPolicyCtrl.checkServerNow().then(function (data) {
            if (data && data.valid === false) {
              showErr(data.message || t('errLoad'));
              unlockBtn();
              return;
            }
            submitAfterCardPolicy();
          }).catch(function () { submitAfterCardPolicy(); });
          return;
        }
        submitAfterCardPolicy();
      });

      var compId = getCompId();
      document.getElementById('compIdHidden').value = compId;
      var epReturnResult = '';
      try {
        epReturnResult = resolveEpReturnKindFromLocation();
        if (epReturnResult === 'success') {
          showResult(true, '');
        } else if (epReturnResult === 'reject') {
          showResult(false, '');
        } else if (epReturnResult === 'waiting') {
          document.getElementById('epForm').style.display = 'none';
          if (window.IcopayCheckout3ds && IcopayCheckout3ds.showWaitOverlay) {
            IcopayCheckout3ds.showWaitOverlay(t('payWaiting'));
          } else {
            showPayWarn(t('payWaiting'));
          }
          var ids = resolveEpReturnIdsFromLocation();
          startInlineStatusPoll({ orderNo: ids.orderNo, paymentId: ids.paymentId });
        }
      } catch (eR) {}

      applyI18n();

      /** 결과/대기 복귀 시에도 상단 로고·부제(총판 브랜딩)는 checkout-context 로 적용 */
      function applyHeaderBrandingFromContext(data) {
        if (!data) return;
        checkoutCtx = data;
        window.__payUrlCardCopy = data.urlPayCardCopy || null;
        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyCheckoutHeaderLogo) {
          PG_URL_PAY_SHELL.applyCheckoutHeaderLogo(data, {
            brandBlockId: 'epBrandBlock',
            logoWrapSelector: '.pay-brand-logo',
            t: t
          });
        }
        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyCardCopyPresentation) {
          PG_URL_PAY_SHELL.applyCardCopyPresentation({
            lang: LANG, cardCopy: window.__payUrlCardCopy, t: t, skipBrandSub: true
          });
        }
        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyCheckoutHeaderSubtitle) {
          PG_URL_PAY_SHELL.applyCheckoutHeaderSubtitle(data, { t: t });
        }
        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyUrlPayBrowserTabTitle) {
          PG_URL_PAY_SHELL.applyUrlPayBrowserTabTitle(LANG, window.__payUrlCardCopy, t);
        }
      }

      if (epReturnResult === 'success' || epReturnResult === 'reject' || epReturnResult === 'waiting') {
        if (!compId) {
          /* 브랜드만 기본값 유지 */
        } else {
          fetchJson(apiUrl('/api/pay/url/checkout-context',
            'compId=' + encodeURIComponent(compId) + (PAY_ENTRY_MERCHANT_API ? '&entry=merchant_api' : '')))
            .then(function (ctxRes) {
              if (ctxRes && ctxRes.success && ctxRes.data) {
                applyHeaderBrandingFromContext(ctxRes.data);
              }
            })
            .catch(function () { /* 결과 표시는 유지, 로고만 기본 문구 */ });
        }
      } else {
      validateSession().then(function () {
        if (!compId) { showErr(t('errMerchant')); return; }
        return fetchJson(apiUrl('/api/pay/url/checkout-context',
          'compId=' + encodeURIComponent(compId) + (PAY_ENTRY_MERCHANT_API ? '&entry=merchant_api' : '')));
      }).then(function (ctxRes) {
        if (!ctxRes) return;
        if (!ctxRes.success || !ctxRes.data) {
          var code = ctxRes.errorCode ? String(ctxRes.errorCode).trim() : '';
          var msg = (code === 'WEB_PAYMENT_DISABLED' || code === 'ORG_DISABLED')
            ? (ctxRes.message || t('webPaymentDisabled'))
            : (ctxRes.message || t('pgMissing'));
          showErr(msg);
          return;
        }
        applyCheckoutContext(ctxRes.data);
        fxShellState.checkoutCtx = checkoutCtx;
        fxShellState.compId = compId;
        fxShellState.apiUrl = apiUrl;
        fxShellState.t = t;
        fxShellState.urlPayDisplayFxActive = urlPayDisplayFxActive;
        if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.initDisplayFx) {
          return PG_URL_PAY_SHELL.initDisplayFx(fxShellState);
        }
      }).then(function () {
        var ordEl = document.getElementById('orderNo');
        if (ordEl && !String(ordEl.value || '').trim()) {
          if (PAY_ENTRY_MERCHANT_API) {
            showErr(t('errInvalidSession'));
            return;
          }
          ordEl.value = buildOrderNo(compId);
        }
      }).catch(function (err) {
        if (err && err.message) showErr(err.message);
      });
      }
    })();
  </script>
</body>
</html>
