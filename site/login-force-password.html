<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-pg-ui-t="비밀번호 재설정 — PG 통합관리자">비밀번호 재설정 — PG 통합관리자</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/site.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f0f4f8; padding: 16px; }
    .card { max-width: 400px; width: 100%; }
  </style>
</head>
<body>
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h5 class="card-title mb-3" data-pg-ui-t="새 비밀번호 설정">새 비밀번호 설정</h5>
      <p class="small text-danger mb-3" data-pg-ui-t="관리자에 의해 비밀번호가 아이디+1! 로 초기화된 상태입니다. 기존·새 비밀번호를 입력한 뒤 입장합니다.">관리자에 의해 비밀번호가 <strong>아이디+1!</strong> 로 초기화된 상태입니다. 기존·새 비밀번호를 입력한 뒤 입장합니다.</p>
      <div id="errBox" class="alert alert-danger py-2 small d-none"></div>
      <div class="mb-2">
        <label for="opOld" class="form-label" data-pg-ui-t="기존 비밀번호">기존 비밀번호</label>
        <input type="password" class="form-control" id="opOld" autocomplete="current-password">
      </div>
      <div class="mb-2">
        <label for="np1" class="form-label" data-pg-ui-t="새 비밀번호">새 비밀번호</label>
        <input type="password" class="form-control" id="np1" autocomplete="new-password">
      </div>
      <div class="mb-3">
        <label for="np2" class="form-label" data-pg-ui-t="새 비밀번호 확인">새 비밀번호 확인</label>
        <input type="password" class="form-control" id="np2" autocomplete="new-password">
      </div>
      <button type="button" class="btn btn-primary w-100 mb-2" id="btnSubmit" data-pg-ui-t="설정 후 입장">설정 후 입장</button>
      <button type="button" class="btn btn-outline-secondary btn-sm w-100" id="btnClose" data-pg-ui-t="닫기">닫기</button>
    </div>
  </div>
  <script src="js/config.js?v=12"></script>
  <script src="js/pg-ui-string-map.js?v=13"></script>
  <script src="js/pg-ui-i18n.js?v=30"></script>
  <script>
    (function () {
      var h = (window.location && window.location.hostname) ? window.location.hostname : '';
      if (h === 'localhost' || h === '127.0.0.1') return;
      if (h === 'api.icopay.co.kr') {
        try {
          var og = (window.location.origin || '').replace(/\/$/, '');
          if (og) { try { localStorage.removeItem('pg_api_base'); } catch (e) {} window.PG_API_BASE = og; }
        } catch (e2) {}
        return;
      }
      var api = window.PG_PUBLIC_ICOPAY_API || 'https://api.icopay.co.kr';
      var b = (window.PG_API_BASE || '').replace(/\/$/, '');
      var bad = !b || /^https?:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/i.test(b);
      if (bad) {
        try { localStorage.removeItem('pg_api_base'); } catch (e) {}
        var adminIcopay = h && h !== 'api.icopay.co.kr' && h !== 'localhost' && h !== '127.0.0.1'
          && (h === 'icopay.co.kr' || /\.icopay\.co\.kr$/i.test(h));
        try {
          var ogBad = (window.location.origin || '').replace(/\/$/, '');
          if (adminIcopay && ogBad) {
            window.PG_API_BASE = ogBad;
            try { localStorage.setItem('pg_api_base', ogBad); } catch (eLs) {}
          } else {
            window.PG_API_BASE = api;
          }
        } catch (eFix) {
          window.PG_API_BASE = api;
        }
      }
    })();
  </script>
  <script src="js/api.js?v=14"></script>
  <script src="js/pg-login-tablet-shell.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      var host = (window.location && window.location.host) ? window.location.host : '';
      if (host && window.PG_API && window.PG_API.orgPortalByHost) {
        window.PG_API.orgPortalByHost(host).then(function (res) {
          var payload = res && res.data !== undefined ? res.data : res;
          if (!payload || !payload.matched) return;
          var b0 = payload.branding;
          if (b0 && b0.siteName) {
            try { document.title = String(b0.siteName) + ' · 비밀번호 설정'; } catch (e0) {}
          }
          if (b0 && b0.theme) {
            document.body.classList.add('theme-' + String(b0.theme).toLowerCase());
          }
          var cid = payload.compId ? String(payload.compId) : '';
          if (cid && window.PG_API.orgBrandingPublic) {
            return window.PG_API.orgBrandingPublic(cid).then(function (b) {
              if (b && b.theme) document.body.classList.add('theme-' + String(b.theme).toLowerCase());
            });
          }
        }).catch(function () {});
      }
    })();
  </script>
  <script>
    (function () {
      try {
        if (window.PG_UI_I18N && typeof window.PG_UI_I18N.applyDom === 'function') {
          window.PG_UI_I18N.applyDom(document.body);
        }
      } catch (e) {}
    })();
  </script>
  <script>
    (function () {
      var origin = window.location.origin || '';
      var errBox = document.getElementById('errBox');
      function trKo(ko, en) {
        try {
          if (window.PG_UI_I18N && typeof window.PG_UI_I18N.t === 'function') return String(window.PG_UI_I18N.t(String(ko)));
        } catch (e) {}
        return en != null ? String(en) : String(ko);
      }

      function showErr(msg) {
        errBox.textContent = msg || '';
        errBox.classList.toggle('d-none', !msg);
      }

      function getPending() {
        try {
          var o = window.opener;
          if (!o || !o.__pgLoginPending) return null;
          return o.__pgLoginPending;
        } catch (e) {
          return null;
        }
      }

      var pending = getPending();
      if (!pending || !pending.data || !pending.data.token) {
        showErr(trKo('로그인 창에서 다시 시도해 주세요. 이 창은 로그인 후에만 사용할 수 있습니다.', 'Please retry from the login screen. This page is available only after login.'));
        document.getElementById('btnSubmit').disabled = true;
        var opOldEl = document.getElementById('opOld');
        if (opOldEl) opOldEl.disabled = true;
        document.getElementById('np1').disabled = true;
        document.getElementById('np2').disabled = true;
      }

      function copyAuthToOpener() {
        var o = window.opener;
        if (!o || !o.sessionStorage) return false;
        try {
          ['pg_admin_token', 'pg_admin_user', 'pg_admin_auth', 'pg_admin_tablet_shell'].forEach(function (k) {
            var v = sessionStorage.getItem(k);
            if (v != null) o.sessionStorage.setItem(k, v);
          });
          try { o.__pgLoginPending = null; } catch (e1) {}
          o.location.replace(origin ? (origin + '/index.html') : 'index.html');
          return true;
        } catch (e) {
          return false;
        }
      }

      document.getElementById('btnSubmit').addEventListener('click', function () {
        var p = getPending();
        if (!p || !p.data || !p.data.token) return;
        var oldP = (document.getElementById('opOld') || {}).value || '';
        var n1 = document.getElementById('np1').value;
        var n2 = document.getElementById('np2').value;
        showErr('');
        if (!oldP) { showErr(trKo('기존 비밀번호를 입력하세요.', 'Enter your current password.')); return; }
        if (oldP !== p.userPwd) { showErr(trKo('기존 비밀번호가 로그인 시 입력한 값과 일치하지 않습니다.', 'Current password does not match the password used at login.')); return; }
        if (!n1 || n1.length < 8) { showErr(trKo('새 비밀번호는 8자 이상 입력하세요.', 'New password must be at least 8 characters.')); return; }
        if (n1 !== n2) { showErr(trKo('새 비밀번호 확인이 일치하지 않습니다.', 'New password confirmation does not match.')); return; }
        var api = window.PG_API;
        if (!api || !api.setAuth || !api.authChangePassword) {
          showErr(trKo('API를 불러올 수 없습니다.', 'Cannot load API.'));
          return;
        }
        var d = p.data;
        var u0 = {
          loginId: d.userId,
          userId: d.userId,
          userNm: d.userNm || p.userId,
          orgUnitId: d.orgUnitId,
          compId: d.compId,
          orgLevel: d.orgLevel,
          role: d.role,
          pagePermissions: d.pagePermissions,
          canWriteNotice: !!d.canWriteNotice
        };
        if (d.brandingCompId) u0.brandingCompId = d.brandingCompId;
        if (d.mustSetupOtp !== undefined) u0.mustSetupOtp = !!d.mustSetupOtp;
        if (d.otpRegisteredYn !== undefined) u0.otpRegisteredYn = String(d.otpRegisteredYn);
        if (d.chatbotPaymentUseYn !== undefined) u0.chatbotPaymentUseYn = String(d.chatbotPaymentUseYn);
        if (d.webPaymentUseYn !== undefined) u0.webPaymentUseYn = String(d.webPaymentUseYn);
        if (d.merchantApiDeployedYn !== undefined) u0.merchantApiDeployedYn = String(d.merchantApiDeployedYn);
        if (Array.isArray(d.tabletMenuUrls)) u0.tabletMenuUrls = d.tabletMenuUrls;
        if (d.tabletFeatureUseYn !== undefined) u0.tabletFeatureUseYn = String(d.tabletFeatureUseYn);
        api.setAuth(d.token, u0);
        try {
          if (window.PG_LOGIN_TABLET_SHELL && typeof window.PG_LOGIN_TABLET_SHELL.captureLoginUiChoice === 'function') {
            window.PG_LOGIN_TABLET_SHELL.captureLoginUiChoice();
          }
          if (window.PG_LOGIN_TABLET_SHELL && typeof window.PG_LOGIN_TABLET_SHELL.applyShellAfterAuth === 'function') {
            window.PG_LOGIN_TABLET_SHELL.applyShellAfterAuth(d);
          }
        } catch (eShFp) { /* ignore */ }
        api.authChangePassword(oldP, n1, n2).then(function () {
          if (copyAuthToOpener()) {
            window.close();
          } else {
            window.location.replace(origin ? (origin + '/index.html') : 'index.html');
          }
        }).catch(function (err) {
          showErr(err && err.message ? err.message : trKo('비밀번호 변경에 실패했습니다.', 'Failed to change password.'));
          try { api.clearAuth(); } catch (e) {}
        });
      });

      document.getElementById('btnClose').addEventListener('click', function () {
        try { window.close(); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
