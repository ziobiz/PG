<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <title>ICOPAY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/pay-inline.css?v=40" rel="stylesheet" />
  <script src="/js/url-pay-copy-phrase-i18n.js?v=1"></script>
  <script src="/js/url-pay-public-shell.js?v=20"></script>
  <script src="/js/qrcode.min.js"></script>
</head>
<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand" id="qbBrand">
        <div class="pay-brand-logo">ICOPAY</div>
        <div class="pay-brand-sub" id="qbBrandSub"></div>
      </div>
      <div class="pay-lang" role="group" aria-label="Language" id="qbLangGroup">
        <button type="button" data-lang="KOR">KOR</button>
        <button type="button" data-lang="ENG">ENG</button>
        <button type="button" data-lang="JPN">JPN</button>
        <button type="button" data-lang="CHN">CHN</button>
        <button type="button" data-lang="THA">THA</button>
      </div>
      <div id="configError" class="alert alert-warning" style="display:none;"></div>
      <div id="payResult" class="pay-result" style="display:none;"></div>

      <form id="qbForm" autocomplete="on">
        <input type="hidden" id="compIdHidden" />
        <div class="pay-form-grid mb-3">
          <div class="pay-row pay-row-static">
            <div class="pay-row-label"><span id="lblMerchant"></span></div>
            <div class="pay-row-value"><span id="merchantNameDisplay">—</span></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="item"><span id="lblItem"></span></label>
            <div class="pay-row-value"><input type="text" class="form-control form-control-sm pay-input-round" id="item" maxlength="200" required /></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="amount"><span id="lblAmount"></span> <span class="pay-currency-hint text-muted" id="payAmountCurrencyHint"></span></label>
            <div class="pay-row-value"><input type="number" class="form-control form-control-sm pay-input-round" id="amount" min="0.01" step="0.01" inputmode="decimal" required /></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="orderNo"><span id="lblOrder"></span></label>
            <div class="pay-row-value"><input type="text" class="form-control form-control-sm pay-input-round" id="orderNo" maxlength="64" autocomplete="off" required /></div>
          </div>
        </div>
        <div class="mb-2">
          <input type="text" class="form-control form-control-sm pay-input-round" id="buyerName" maxlength="100" autocomplete="name" />
        </div>
        <div class="mb-2">
          <input type="email" class="form-control form-control-sm pay-input-round" id="buyerEmail" maxlength="100" autocomplete="email" />
        </div>
        <div class="mb-3">
          <input type="tel" class="form-control form-control-sm pay-input-round" id="buyerTel" maxlength="40" autocomplete="tel" />
        </div>
        <button type="submit" class="btn btn-primary w-100" id="submitBtn"></button>
      </form>

      <div id="qrSection" class="text-center mt-3" style="display:none;">
        <p class="mb-2 fw-semibold" id="qrHint"></p>
        <div id="qrCanvasWrap" class="d-inline-block p-2 bg-white border rounded mb-2"></div>
        <p class="small text-muted mb-1" id="qrRemain"></p>
        <p class="small text-muted mb-0" id="qrStatus"></p>
        <button type="button" class="btn btn-outline-secondary btn-sm mt-3" id="cancelQrBtn" style="display:none;"></button>
      </div>
    </div>
  </div>
  <script>
(function () {
  var T = {
    KOR: {
      brandSub: 'QR 결제', merchant: '가맹점', item: '상품', amount: '금액', order: '주문번호',
      name: '성명', email: '이메일', phone: '전화(선택)', pay: 'QR 생성',
      scan: '스마트폰으로 QR을 스캔해 결제해 주세요.', remain: '남은 시간', status: '상태',
      pending: '결제 대기 중…', paid: '결제가 완료되었습니다.', failed: '결제가 실패·만료되었습니다.',
      cancel: '닫기', errCfg: '결제 설정을 불러올 수 없습니다.', errStart: 'QR을 시작할 수 없습니다.',
      notConfigured: 'QR 결제가 설정되지 않았습니다.'
    },
    ENG: {
      brandSub: 'QR Payment', merchant: 'Merchant', item: 'Item', amount: 'Amount', order: 'Order No.',
      name: 'Name', email: 'Email', phone: 'Phone (optional)', pay: 'Show QR',
      scan: 'Scan the QR code with your phone to pay.', remain: 'Time left', status: 'Status',
      pending: 'Waiting for payment…', paid: 'Payment completed.', failed: 'Payment failed or expired.',
      cancel: 'Close', errCfg: 'Unable to load checkout settings.', errStart: 'Unable to start QR.',
      notConfigured: 'QR payment is not configured.'
    },
    JPN: {
      brandSub: 'QR決済', merchant: '加盟店', item: '商品', amount: '金額', order: '注文番号',
      name: '氏名', email: 'メール', phone: '電話（任意）', pay: 'QR表示',
      scan: 'スマホでQRを読み取り、お支払いください。', remain: '残り時間', status: '状態',
      pending: 'お支払い待ち…', paid: 'お支払いが完了しました。', failed: '失敗または期限切れです。',
      cancel: '閉じる', errCfg: '設定を読み込めません。', errStart: 'QRを開始できません。',
      notConfigured: 'QR決済が設定されていません。'
    },
    CHN: {
      brandSub: 'QR 支付', merchant: '商户', item: '商品', amount: '金额', order: '订单号',
      name: '姓名', email: '邮箱', phone: '电话（可选）', pay: '显示二维码',
      scan: '请用手机扫描二维码完成支付。', remain: '剩余时间', status: '状态',
      pending: '等待支付…', paid: '支付已完成。', failed: '支付失败或已过期。',
      cancel: '关闭', errCfg: '无法加载支付设置。', errStart: '无法开始二维码支付。',
      notConfigured: '未配置二维码支付。'
    },
    THA: {
      brandSub: 'ชำระด้วย QR', merchant: 'ร้านค้า', item: 'สินค้า', amount: 'จำนวนเงิน', order: 'เลขคำสั่ง',
      name: 'ชื่อ', email: 'อีเมล', phone: 'โทร (ไม่บังคับ)', pay: 'แสดง QR',
      scan: 'สแกน QR ด้วยมือถือเพื่อชำระ', remain: 'เวลาที่เหลือ', status: 'สถานะ',
      pending: 'รอการชำระ…', paid: 'ชำระเงินสำเร็จ', failed: 'ล้มเหลวหรือหมดเวลา',
      cancel: 'ปิด', errCfg: 'โหลดการตั้งค่าไม่ได้', errStart: 'เริ่ม QR ไม่ได้',
      notConfigured: 'ยังไม่ได้ตั้งค่าชำระ QR'
    }
  };

  var q = new URLSearchParams(location.search || '');
  var lang = (q.get('lang') || q.get('langCode') || 'KOR').toUpperCase();
  if (lang === 'KO' || lang === 'KR') lang = 'KOR';
  if (lang === 'EN') lang = 'ENG';
  if (lang === 'JP' || lang === 'JA') lang = 'JPN';
  if (lang === 'CH' || lang === 'ZH') lang = 'CHN';
  if (lang === 'TH') lang = 'THA';
  if (!T[lang]) lang = 'KOR';
  var pack = T[lang];
  var compId = (q.get('m') || q.get('compId') || q.get('merchant') || '').trim();
  var ctx = {};
  var pollTimer = null;
  var txnNo = '';
  var orderNoLive = '';

  function $(id) { return document.getElementById(id); }
  function applyTexts() {
    pack = T[lang] || T.KOR;
    $('qbBrandSub').textContent = pack.brandSub;
    $('lblMerchant').textContent = pack.merchant;
    $('lblItem').textContent = pack.item;
    $('lblAmount').textContent = pack.amount;
    $('lblOrder').textContent = pack.order;
    $('buyerName').placeholder = pack.name;
    $('buyerEmail').placeholder = pack.email;
    $('buyerTel').placeholder = pack.phone;
    $('submitBtn').textContent = pack.pay;
    $('qrHint').textContent = pack.scan;
    $('cancelQrBtn').textContent = pack.cancel;
    document.querySelectorAll('#qbLangGroup [data-lang]').forEach(function (btn) {
      btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
    });
  }

  document.querySelectorAll('#qbLangGroup [data-lang]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      lang = btn.getAttribute('data-lang');
      var u = new URL(location.href);
      u.searchParams.set('lang', lang);
      history.replaceState(null, '', u.toString());
      applyTexts();
    });
  });

  function showErr(msg) {
    var el = $('configError');
    el.style.display = '';
    el.textContent = msg || pack.errCfg;
  }

  function loadContext() {
    if (!compId) {
      showErr(pack.errCfg);
      return Promise.resolve();
    }
    $('compIdHidden').value = compId;
    return fetch('/api/pay/qbang/checkout-context?compId=' + encodeURIComponent(compId) + '&m=' + encodeURIComponent(compId), { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (body) {
        if (!(body && body.success && body.data)) {
          showErr((body && body.message) || pack.errCfg);
          return;
        }
        ctx = body.data;
        if (ctx.qbangConfigured === false) {
          showErr(pack.notConfigured);
        }
        $('merchantNameDisplay').textContent = ctx.merchantName || ctx.compNm || ctx.compId || compId || '—';
        if (ctx.defaultProductName) $('item').value = ctx.defaultProductName;
        if (ctx.currency) $('payAmountCurrencyHint').textContent = '(' + ctx.currency + ')';
        if (ctx.amount != null && ctx.amount !== '') $('amount').value = ctx.amount;
        if (ctx.orderNo) $('orderNo').value = ctx.orderNo;
        if (ctx.buyerPrefill) {
          var bp = ctx.buyerPrefill;
          if (bp.name) $('buyerName').value = bp.name;
          if (bp.email) $('buyerEmail').value = bp.email;
          if (bp.phone) $('buyerTel').value = bp.phone;
        }
        if (window.UrlPayPublicShell && UrlPayPublicShell.applyCheckoutContext) {
          try { UrlPayPublicShell.applyCheckoutContext(ctx, { lang: lang }); } catch (e0) {}
        }
      })
      .catch(function () { showErr(pack.errCfg); });
  }

  function stopPoll() {
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  }

  function paintQr(text) {
    var wrap = $('qrCanvasWrap');
    wrap.innerHTML = '';
    var QR = window.QRCode;
    if (QR && typeof QR.toCanvas === 'function') {
      var canvas = document.createElement('canvas');
      wrap.appendChild(canvas);
      QR.toCanvas(canvas, text, { width: 220, margin: 1 }, function () {});
    } else if (QR && QR.CorrectLevel) {
      new QR(wrap, { text: text, width: 220, height: 220 });
    } else {
      wrap.textContent = text;
    }
  }

  function startPoll() {
    stopPoll();
    pollTimer = setInterval(function () {
      if (!txnNo || !compId) return;
      var url = '/api/pay/qbang/status?compId=' + encodeURIComponent(compId)
        + '&transactionNo=' + encodeURIComponent(txnNo)
        + '&orderNo=' + encodeURIComponent(orderNoLive || '');
      fetch(url, { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (body) {
          if (!(body && body.success && body.data)) return;
          var d = body.data;
          var rem = d.remainingTime != null ? d.remainingTime : '';
          $('qrRemain').textContent = pack.remain + ': ' + rem + 's';
          var st = String(d.paymentStatus || '').toUpperCase();
          if (st === 'PAID') {
            stopPoll();
            $('qrStatus').textContent = pack.paid;
            $('payResult').style.display = '';
            $('payResult').className = 'pay-result alert alert-success';
            $('payResult').textContent = pack.paid;
            $('cancelQrBtn').style.display = '';
          } else if (st === 'FAILED') {
            stopPoll();
            $('qrStatus').textContent = pack.failed;
            $('payResult').style.display = '';
            $('payResult').className = 'pay-result alert alert-danger';
            $('payResult').textContent = pack.failed;
            $('cancelQrBtn').style.display = '';
          } else {
            $('qrStatus').textContent = pack.pending;
          }
        })
        .catch(function () {});
    }, 2000);
  }

  $('qbForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('configError').style.display = 'none';
    var body = {
      compId: compId,
      orderNo: ($('orderNo').value || '').trim(),
      productName: ($('item').value || '').trim(),
      item: ($('item').value || '').trim(),
      amount: ($('amount').value || '').trim(),
      currency: (ctx && ctx.currency) || '',
      buyerName: ($('buyerName').value || '').trim(),
      buyerEmail: ($('buyerEmail').value || '').trim(),
      buyerTel: ($('buyerTel').value || '').trim(),
      payMeans: 'QR',
      qrWallet: 'QBANG'
    };
    if (ctx && ctx.sessionToken) body.sessionToken = ctx.sessionToken;
    $('submitBtn').disabled = true;
    fetch('/api/pay/qbang/start', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        $('submitBtn').disabled = false;
        if (!(res && res.success && res.data)) {
          showErr((res && res.message) || pack.errStart);
          return;
        }
        var d = res.data;
        txnNo = d.transactionNo || '';
        orderNoLive = d.orderNo || body.orderNo;
        $('qbForm').style.display = 'none';
        $('qrSection').style.display = '';
        paintQr(d.qrCode || '');
        $('qrRemain').textContent = pack.remain + ': ' + (d.remainingTimeHint != null ? d.remainingTimeHint : '66') + 's';
        $('qrStatus').textContent = pack.pending;
        startPoll();
      })
      .catch(function () {
        $('submitBtn').disabled = false;
        showErr(pack.errStart);
      });
  });

  $('cancelQrBtn').addEventListener('click', function () {
    stopPoll();
    location.reload();
  });

  applyTexts();
  loadContext();
})();
  </script>
</body>
</html>
