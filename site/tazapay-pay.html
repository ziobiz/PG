<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="referrer" content="no-referrer">
  <title>ICOPAY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/pay-inline.css?v=41" rel="stylesheet">
  <script src="/js/url-pay-public-shell.js?v=27"></script>
  <script src="/js/jpay-contact-fields.js?v=8"></script>
  <script src="/js/tazapay-pay-msg-i18n.js?v=2"></script>
</head>
<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand"><div class="pay-brand-logo">ICOPAY</div><div class="pay-brand-sub" id="brandSub">Easy Pay</div></div>
      <div id="payResult" class="pay-result" style="display:none;"></div>
      <div id="card-embed" style="min-height:120px;margin:12px 0;"></div>
      <button type="button" class="btn btn-primary btn-pay w-100" id="submitBtn">Pay</button>
      <p class="small text-muted mt-2 text-center" id="lead"></p>
      <p class="small text-danger text-center" id="errMsg" style="display:none;"></p>
    </div>
  </div>
  <script>
  (function () {
    var LANG = 'ENG';
    try {
      var p = new URLSearchParams(location.search);
      var raw = (p.get('lang') || p.get('langCode') || 'ENG').toUpperCase();
      if (raw === 'KO' || raw === 'KR') raw = 'KOR';
      if (raw === 'JA' || raw === 'JP') raw = 'JPN';
      if (raw === 'ZH' || raw === 'CN') raw = 'CHN';
      if (raw === 'TH') raw = 'THA';
      LANG = raw;
    } catch (e) {}
    var pack = (window.TAZAPAY_PAY_I18N && window.TAZAPAY_PAY_I18N[LANG]) || (window.TAZAPAY_PAY_I18N && window.TAZAPAY_PAY_I18N.ENG) || {};
    document.getElementById('lead').textContent = pack.lead || '';
    document.getElementById('submitBtn').textContent = pack.pay || 'Pay';
    document.getElementById('brandSub').textContent = pack.brandSub || 'Easy Pay';

    var API_BASE = (function () {
      try { if (location.hostname === 'api.icopay.co.kr') return location.origin; } catch (e) {}
      return (window.PG_API_BASE || location.origin || '').replace(/\/$/, '');
    })();

    if (location.search.indexOf('tazapayReturn=1') >= 0 || location.search.indexOf('done=1') >= 0) {
      document.getElementById('payResult').style.display = 'block';
      document.getElementById('payResult').textContent = pack.ok || 'OK';
      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('card-embed').style.display = 'none';
      return;
    }
    if (location.search.indexOf('tazapayCancel=1') >= 0) {
      document.getElementById('errMsg').style.display = 'block';
      document.getElementById('errMsg').textContent = pack.fail || 'Cancelled';
      document.getElementById('submitBtn').style.display = 'none';
      document.getElementById('card-embed').style.display = 'none';
      return;
    }

    function showErr(msg) {
      var el = document.getElementById('errMsg');
      el.style.display = 'block';
      el.textContent = msg || pack.fail || 'Error';
    }

    function loadScript(url) {
      return new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = url;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    function waitTazapayReady(timeoutMs) {
      return new Promise(function (resolve, reject) {
        if (typeof window.tazapay === 'function') {
          resolve();
          return;
        }
        var done = false;
        var t = setTimeout(function () {
          if (done) return;
          done = true;
          reject(new Error('sdk timeout'));
        }, timeoutMs || 15000);
        window.addEventListener('tazapaySDKReady', function () {
          if (done) return;
          done = true;
          clearTimeout(t);
          resolve();
        });
      });
    }

    function startPay() {
      var q = new URLSearchParams(location.search);
      var compId = (q.get('m') || q.get('compId') || '').trim();
      var body = {
        compId: compId,
        orderNo: (q.get('orderNo') || '').trim(),
        amount: q.get('amount') || '',
        currency: q.get('currency') || '',
        payFirstname: (q.get('payFirstname') || '').trim(),
        payLastname: (q.get('payLastname') || '').trim(),
        payEmailAddress: (q.get('payEmailAddress') || '').trim(),
        payTelephone: (q.get('payTelephone') || '').trim(),
        country: (q.get('country') || q.get('payCountry') || '').trim(),
        langCode: LANG
      };
      if (window.ICOPAY_URL_PAY_SHELL && typeof window.ICOPAY_URL_PAY_SHELL.collectSaleBody === 'function') {
        Object.assign(body, window.ICOPAY_URL_PAY_SHELL.collectSaleBody() || {});
      }
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('lead').textContent = pack.wait || '';
      fetch(API_BASE + '/api/pay/url/sale', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify(body)
      }).then(function (r) { return r.json(); }).then(function (res) {
        var data = res && res.data ? res.data : res;
        if (data && data.redirectUrl) {
          location.href = data.redirectUrl;
          return;
        }
        if (!res || !res.success || !data || !data.clientToken) {
          showErr(res && res.message ? res.message : pack.fail);
          document.getElementById('submitBtn').disabled = false;
          return;
        }
        var jsUrl = data.tazapayJsUrl || 'https://js.tazapay.com/v3.js';
        var successUrl = data.successUrl || (location.href.split('#')[0]);
        var cancelUrl = data.cancelUrl || successUrl;
        return loadScript(jsUrl).then(function () { return waitTazapayReady(12000); }).then(function () {
          document.getElementById('lead').textContent = pack.embedWait || '';
          var pk = data.publicKey;
          var clientToken = data.clientToken;
          return Promise.resolve(window.tazapay(pk)).then(function (tz) {
            var embeds = tz.embeds();
            var card = embeds.create('card', {
              layout: 'two-rows',
              cvvMask: true,
              customPayButton: true,
              showLabels: true
            });
            card.mount('card-embed');
            document.getElementById('submitBtn').onclick = function () {
              document.getElementById('submitBtn').disabled = true;
              var details = {
                payment_method_details: {
                  type: 'card',
                  card: { card: card }
                },
                success_url: successUrl,
                cancel_url: cancelUrl
              };
              tz.confirmPayment(clientToken, details).then(function (result) {
                if (result && result.error) {
                  showErr((result.error && (result.error.message || result.error.error)) || pack.fail);
                  document.getElementById('submitBtn').disabled = false;
                  return;
                }
                document.getElementById('payResult').style.display = 'block';
                document.getElementById('payResult').textContent = pack.ok || 'OK';
                document.getElementById('card-embed').style.display = 'none';
                document.getElementById('submitBtn').style.display = 'none';
              }).catch(function (err) {
                showErr((err && err.message) || pack.fail);
                document.getElementById('submitBtn').disabled = false;
              });
            };
            document.getElementById('submitBtn').disabled = false;
          });
        });
      }).catch(function () {
        showErr(pack.fail);
        document.getElementById('submitBtn').disabled = false;
      });
    }

    document.getElementById('submitBtn').addEventListener('click', startPay);
    if (typeof window.ICOPAY_URL_PAY_SHELL !== 'undefined' && window.ICOPAY_URL_PAY_SHELL.bootFromQuery) {
      window.ICOPAY_URL_PAY_SHELL.bootFromQuery({ apiBase: API_BASE, lang: LANG });
    }
  })();
  </script>
</body>
</html>
