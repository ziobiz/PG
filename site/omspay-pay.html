<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <title>ICOPAY</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/css/pay-inline.css?v=38" rel="stylesheet" />
  <script src="/js/url-pay-input-mode.js?v=4"></script>
  <script src="/js/checkout-header-subtitle-presets.js?v=2"></script>
  <script src="/js/url-pay-copy-phrase-i18n.js?v=1"></script>
  <script src="/js/url-pay-public-shell.js?v=20"></script>
  <script src="/js/pay-form-input-guard.js?v=3"></script>
</head>
<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand" id="omsBrandBlock">
        <div class="pay-brand-logo">ICOPAY</div>
        <div class="pay-brand-sub" id="omsBrandSub"></div>
      </div>
      <div class="pay-lang" role="group" aria-label="Language" id="omsLangGroup">
        <button type="button" data-lang="JPN">JPN</button>
        <button type="button" data-lang="KOR">KOR</button>
        <button type="button" data-lang="ENG">ENG</button>
        <button type="button" data-lang="CHN">CHN</button>
        <button type="button" data-lang="THA">THA</button>
      </div>
      <div id="configError" class="alert alert-warning pay-alert-config" style="display:none;"></div>
      <div id="payResult" class="pay-result" style="display:none;"></div>
      <form id="omsForm" autocomplete="on">
        <input type="hidden" id="compIdHidden" />
        <input type="hidden" id="sessionTokenHidden" />
        <p class="small text-muted mb-3" id="omsLead"></p>
        <div class="pay-form-grid mb-3">
          <div class="pay-row pay-row-static" id="merchantRow">
            <div class="pay-row-label"><span id="lblMerchant"></span></div>
            <div class="pay-row-value"><span id="merchantNameDisplay">—</span></div>
          </div>
          <div class="pay-row" id="itemRow">
            <label class="pay-row-label mb-0" for="item"><span id="lblItem"></span></label>
            <div class="pay-row-value"><input type="text" class="form-control form-control-sm pay-input-round" id="item" maxlength="200" /></div>
          </div>
          <div class="pay-row" id="amountRow">
            <label class="pay-row-label mb-0" for="amount"><span id="lblAmount"></span> <span class="pay-currency-hint text-muted fw-normal" id="payAmountCurrencyHint"></span></label>
            <div class="pay-row-value">
              <input type="number" class="form-control form-control-sm pay-input-round" id="amount" min="0.01" step="0.01" inputmode="decimal" />
              <p class="small text-muted mb-0 mt-1 d-none" id="payAmountScaleNotice"></p>
            </div>
          </div>
          <div class="pay-row d-none" id="payFxDisplayCurrencyRow">
            <label class="pay-row-label mb-0" for="payDisplayCurrencySelect"><span id="lblFxCur"></span></label>
            <div class="pay-row-value d-flex align-items-center gap-2 flex-wrap">
              <select class="form-select form-select-sm pay-input-round" id="payDisplayCurrencySelect" style="max-width:8rem"></select>
              <span class="small text-muted" id="payFxDisplayCurrencyStatic"></span>
            </div>
          </div>
          <div class="pay-row d-none" id="payFxQuoteRow">
            <div class="pay-row-label"><span id="lblFxEst"></span></div>
            <div class="pay-row-value"><span id="payFxThbEstimateText" class="small fw-semibold">—</span></div>
          </div>
          <div class="pay-row" id="orderRow">
            <label class="pay-row-label mb-0" for="orderNo"><span id="lblOrder"></span></label>
            <div class="pay-row-value"><input type="text" class="form-control form-control-sm pay-input-round" id="orderNo" maxlength="64" autocomplete="off" readonly tabindex="-1" /></div>
          </div>
        </div>
        <div id="buyerBlock">
          <div class="pay-row mb-2" id="nameRow">
            <label class="pay-row-label mb-0" for="buyerName"><span id="lblName"></span></label>
            <div class="pay-row-value"><input type="text" class="form-control form-control-sm pay-input-round" id="buyerName" maxlength="100" autocomplete="name" required /></div>
          </div>
          <div class="pay-row mb-2" id="emailRow">
            <label class="pay-row-label mb-0" for="buyerEmail"><span id="lblEmail"></span></label>
            <div class="pay-row-value"><input type="email" class="form-control form-control-sm pay-input-round" id="buyerEmail" maxlength="100" autocomplete="email" /></div>
          </div>
          <div class="pay-row mb-2" id="phoneRow">
            <label class="pay-row-label mb-0" for="buyerTel"><span id="lblPhone"></span></label>
            <div class="pay-row-value"><input type="tel" class="form-control form-control-sm pay-input-round" id="buyerTel" maxlength="40" autocomplete="tel" /></div>
          </div>
          <p class="small text-muted mb-3" id="buyerHint"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-pay w-100" id="submitBtn"></button>
      </form>
    </div>
  </div>

  var LANG = (function () {

    if (raw === 'KO' || raw === 'KR' || raw === 'KOR') return 'KOR';
    if (raw === 'EN' || raw === 'ENG') return 'ENG';
    if (raw === 'JA' || raw === 'JP' || raw === 'JPN') return 'JPN';
    if (raw === 'ZH' || raw === 'CN' || raw === 'CHN') return 'CHN';
    if (raw === 'TH' || raw === 'THA') return 'THA';
    try {
      var nav = (navigator.language || '').toLowerCase();
      if (nav.indexOf('ko') === 0) return 'KOR';
      if (nav.indexOf('ja') === 0) return 'JPN';

  function getCompId() {
    var raw = (q.get('m') || q.get('compId') || q.get('merchant') || '').trim();
    if (raw) return raw;
    try {
      var path = (location.pathname || '').replace(/\/+$/, '');
      var seg = path.split('/').filter(Boolean);
      var roots = { checkout: 1, 'omspay-pay': 1, pay: 1 };
      if (seg.length >= 2 && roots[String(seg[0]).toLowerCase()] && String(seg[1]).indexOf('.') < 0) {
        return String(seg[1]).trim();
      }
    } catch (e) {}
    return '';

    var composed = '';
    if (b && (b.firstName || b.lastName)) {

    return {

    if (itemEl && !itemEl.readOnly) {
      var defName = ctx.defaultProductName || ctx.productName || '';
      if (defName) itemEl.value = String(defName).trim();
    }
    urlPayDisplayFxActive = ctx.urlPayDisplayFxActive === true;
    urlPayPricingMode = String(ctx.urlPayPricingMode || 'CHECKOUT_CURRENCY').toUpperCase();
    /* DP: 금액 옆 = 표시통화 설정값. STANDARD: 체크아웃/정산통화 */
    if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyPayAmountCurrencyHint) {
      PG_URL_PAY_SHELL.applyPayAmountCurrencyHint(ctx);
    } else {
      var cur0 = urlPayDisplayFxActive
        ? (ctx.urlPayDisplayFxDefaultDisplayCurrency || '')
        : (ctx.checkoutCurrencyCode || ctx.currency || '');
      var hint0 = document.getElementById('payAmountCurrencyHint');
      if (hint0 && cur0) hint0.textContent = '(' + String(cur0).trim().toUpperCase() + ')';
    }

    /* 일반형(STANDARD)이어도 항상 init — 비활성 시 Display currency/Estimated charge 행을 숨김 */
    if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.initDisplayFx) {
      fxShellState.checkoutCtx = ctx;
      fxShellState.compId = document.getElementById('compIdHidden').value || getCompId();
      fxShellState.urlPayDisplayFxActive = urlPayDisplayFxActive;
      fxShellState.operationalPgCd = String(
        ctx.urlPayOperationalPgCd || ctx.urlPayDisplayFxQuotePgCd || ''
      ).trim();
      fxShellState.apiUrl = function (path, qs) {
        var u = path || '';
        if (qs) u += (u.indexOf('?') >= 0 ? '&' : '?') + qs;
        return u;
      };
      fxShellState.t = t;
      try { PG_URL_PAY_SHELL.initDisplayFx(fxShellState); } catch (eFx) { /* ignore */ }
    } else {
      var rowC = document.getElementById('payFxDisplayCurrencyRow');
      var rowQ = document.getElementById('payFxQuoteRow');
      if (rowC) rowC.classList.toggle('d-none', !urlPayDisplayFxActive);
      if (rowQ) rowQ.classList.toggle('d-none', !urlPayDisplayFxActive);
    }
  }

  function applySessionOrQuery(data) {
    if (!data) return;
    sessionData = data;
    if (data.compId) document.getElementById('compIdHidden').value = String(data.compId).trim();
    if (data.sessionToken) document.getElementById('sessionTokenHidden').value = String(data.sessionToken);
    var name = data.productName || data.item || data.defaultProductName || '';
    if (name) {
      document.getElementById('item').value = String(name);
      if (data.productName || data.item) {
        document.getElementById('item').readOnly = true;
      }
    }
    if (data.amount != null && String(data.amount).trim() !== '') {
      document.getElementById('amount').value = String(data.amount);
      document.getElementById('amount').readOnly = true;
      lockedAmount = true;
    }
    var order = data.orderNo || q.get('orderNo') || '';
    if (order) {
      document.getElementById('orderNo').value = String(order);
      document.getElementById('orderNo').readOnly = true;
      lockedOrder = true;
    }
    /* DP: 표시통화 설정(또는 세션 displayCurrency). 정산통화로 덮어쓰지 않음 */
    if (urlPayDisplayFxActive) {
      var dcur = String(data.displayCurrency || '').trim().toUpperCase();
      if (dcur) {
        document.getElementById('payAmountCurrencyHint').textContent = '(' + dcur + ')';
      } else if (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.applyPayAmountCurrencyHint && fxShellState.checkoutCtx) {
        PG_URL_PAY_SHELL.applyPayAmountCurrencyHint(fxShellState.checkoutCtx);
      }
    } else {
      var cur = data.displayCurrency || data.currency || data.checkoutCurrencyCode || '';
      if (cur) document.getElementById('payAmountCurrencyHint').textContent = '(' + String(cur).toUpperCase() + ')';
    }
    var b = pickBuyer(data);
    if (b.name) {
      document.getElementById('buyerName').value = String(b.name).trim().replace(/[^A-Za-z '\-]/g, '');
    }
    if (b.email) {
      document.getElementById('buyerEmail').value = String(b.email).trim().replace(/[^a-zA-Z0-9._%+\-@]/g, '');
    }
    if (b.tel) {
      var telRaw = String(b.tel).trim();
      var telOut = '';
      for (var ti = 0; ti < telRaw.length; ti++) {
        var tc = telRaw.charAt(ti);
        if (tc === '+' && telOut.length === 0) telOut += '+';
        else if (tc >= '0' && tc <= '9') telOut += tc;
      }
      document.getElementById('buyerTel').value = telOut;
    }
    if ((q.get('session') || '').trim() && b.name) {
      document.getElementById('buyerBlock').classList.add('d-none');
    }
  }

  function ensureOrderNo() {
    var el = document.getElementById('orderNo');
    if (!el.value.trim()) el.value = buildOrderNo(document.getElementById('compIdHidden').value || getCompId());
    el.readOnly = true;
    lockedOrder = true;
  }

  var isReturnMode = q.get('done') === '1' || q.get('omspayReturn') === '1'
    || String(q.get('outcome') || '').toLowerCase() === 'return';
  var returnOrderNo = (q.get('orderNo') || q.get('OrderNo') || '').trim();
  try {
    if (!returnOrderNo) {
      var pend = sessionStorage.getItem('pg_omspay_pending');
      if (pend) {
        var pj = JSON.parse(pend);
        if (pj && pj.orderNo) returnOrderNo = String(pj.orderNo).trim();
        if (pj && pj.compId && !getCompId()) {
          document.getElementById('compIdHidden').value = String(pj.compId).trim();
        }
      }
    }
  } catch (ePend) { /* ignore */ }

  function renderOmsResult(state) {
    state = state || {};
    document.getElementById('omsForm').style.display = 'none';
    var lead = document.getElementById('omsLead');
    if (lead) lead.style.display = 'none';
    var sub = document.getElementById('omsBrandSub');
    if (sub) {
      sub.textContent = t('brandSub');
      sub.setAttribute('data-locked', '1');
    }
    var el = document.getElementById('payResult');
    el.style.display = 'block';
    var ok = !!state.ok;
    var awaiting = !!state.awaiting;
    el.className = awaiting ? 'wait pay-result-final' : (ok ? 'ok pay-result-final' : 'err pay-result-final');
    var title = awaiting ? t('payAwaiting') : (ok ? t('payComplete') : t('payFailed'));
    var body = awaiting ? t('payAwaitingDetail') : (ok ? t('paid') : t('err'));
    var orderLine = state.orderNo
      ? ('<p class="small text-muted mb-2">' + t('order') + ': <strong>' + String(state.orderNo).replace(/</g, '') + '</strong></p>')
      : '';
    var actions = '<div class="pay-result-btn-row mt-3">'
      + '<button type="button" class="btn btn-primary btn-pay pay-result-confirm-btn" id="omsResultRetryBtn">' + t('resultRetry') + '</button>'
      + '<button type="button" class="btn btn-outline-secondary btn-pay pay-result-confirm-btn" id="omsResultCloseBtn">' + t('resultClose') + '</button>'
      + '</div>';
    el.innerHTML = '<div class="pay-result-title">' + title + '</div>' + orderLine + '<p>' + body + '</p>' + actions;
    var retry = document.getElementById('omsResultRetryBtn');
    var closeBtn = document.getElementById('omsResultCloseBtn');
    if (retry) {
      retry.addEventListener('click', function () {
        var cid = (document.getElementById('compIdHidden').value || getCompId() || '').trim();
        location.href = cid ? ('/checkout/' + encodeURIComponent(cid)) : '/omspay-pay.html';
      });
    }
    if (closeBtn) {
      closeBtn.addEventListener('click', function () {
        try { window.close(); } catch (eC) { /* ignore */ }
        var cid = (document.getElementById('compIdHidden').value || getCompId() || '').trim();
        if (cid) location.href = '/checkout/' + encodeURIComponent(cid);
      });
    }
  }

  function pollOmsReturnResult() {
    var cid = (document.getElementById('compIdHidden').value || getCompId() || '').trim();
    var on = returnOrderNo;
    if (!cid || !on) {
      renderOmsResult({ ok: false, awaiting: false, orderNo: on });
      return;
    }
    renderOmsResult({ ok: false, awaiting: true, orderNo: on });
    var tries = 0;
    var maxTries = 24;
    function tick() {
      tries += 1;
      var qs = 'compId=' + encodeURIComponent(cid) + '&orderNo=' + encodeURIComponent(on);
      fetch('/api/pay/omspay/result-status?' + qs, { credentials: 'same-origin', cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (body) {
          var d = body && body.data ? body.data : null;
          if (body && body.success && d && d.paid === true) {
            try { sessionStorage.removeItem('pg_omspay_pending'); } catch (eR) { /* ignore */ }
            renderOmsResult({ ok: true, awaiting: false, orderNo: d.orderNo || on });
            return;
          }
          if (body && body.success && d && d.paymentStatus === 'FAIL') {
            renderOmsResult({ ok: false, awaiting: false, orderNo: d.orderNo || on });
            return;
          }
          if (tries < maxTries) {
            setTimeout(tick, 2500);
          } else {
            /* 웹훅 지연 — 복귀 직후이므로 완료로 안내(Beam 성공 후 return) */
            renderOmsResult({ ok: true, awaiting: false, orderNo: on });
          }
        })
        .catch(function () {
          if (tries < maxTries) setTimeout(tick, 2500);
          else renderOmsResult({ ok: true, awaiting: false, orderNo: on });
        });
    }
    tick();
  }

  var session = (q.get('session') || '').trim();
  var comp = getCompId();
  if (comp) document.getElementById('compIdHidden').value = comp;

  if (isReturnMode) {
    pollOmsReturnResult();
  }

  function loadContext() {
    if (isReturnMode) return Promise.resolve();
    if (session) {
      return fetch('/api/middleware/v1/merchant/checkout/session?token=' + encodeURIComponent(session), { credentials: 'same-origin' })
        .then(function (r) { return r.json(); })
        .then(function (body) {
          if (body && body.success && body.data) {
            applySessionOrQuery(body.data);
            var cid = body.data.compId || getCompId();
            if (cid) {
              return fetch('/api/pay/omspay/checkout-context?compId=' + encodeURIComponent(cid), { credentials: 'same-origin' })
                .then(function (r2) { return r2.json(); })
                .then(function (ctxBody) {
                  if (ctxBody && (ctxBody.errorCode === 'ORG_DISABLED' || ctxBody.errorCode === 'WEB_PAYMENT_DISABLED')) {
                    showConfigError(ctxBody.message || t('webOff'));
                    return;
                  }
                  if (ctxBody && ctxBody.success && ctxBody.data) applyCheckoutContext(ctxBody.data);
                });
            }
          }
        });
    }
    if (!comp) {
      showConfigError(t('needMerchant'));
      return Promise.resolve();
    }
    return fetch('/api/pay/omspay/checkout-context?compId=' + encodeURIComponent(comp), { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (body) {
        if (body && (body.errorCode === 'ORG_DISABLED' || body.errorCode === 'WEB_PAYMENT_DISABLED')) {
          showConfigError(body.message || t('webOff'));
          return;
        }
        if (!(body && body.success && body.data)) {
          showConfigError((body && body.message) || t('configErr'));
          return;
        }
        applyCheckoutContext(body.data);
        applySessionOrQuery({
          compId: body.data.compId || comp,
          productName: body.data.defaultProductName || '',
          currency: body.data.checkoutCurrencyCode || '',
          displayCurrency: body.data.urlPayDisplayFxActive === true
            ? String(body.data.urlPayDisplayFxDefaultDisplayCurrency || '').trim()
            : '',
          orderNo: q.get('orderNo') || '',
          amount: q.get('amount') || '',
          buyer: body.data.buyerPrefill || body.data.buyer || null
        });
        ensureOrderNo();
      })
      .catch(function () { showConfigError(t('configErr')); });
  }

  loadContext().then(function () {
    if (session && !isReturnMode) {
      var hasName = !!(document.getElementById('buyerName').value || '').trim()
        || document.getElementById('buyerBlock').classList.contains('d-none');
      if (hasName && lockedAmount) {
        setTimeout(function () {
          document.getElementById('omsForm').requestSubmit
            ? document.getElementById('omsForm').requestSubmit()
            : document.getElementById('submitBtn').click();
        }, 400);
      }
    }
  });

  document.getElementById('omsForm').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (q.get('done') === '1') return;
    var cid = (document.getElementById('compIdHidden').value || getCompId() || '').trim();
    if (!cid) { showConfigError(t('needMerchant')); return; }
    ensureOrderNo();
    var amount = document.getElementById('amount').value;
    var pfg = window.PG_PAY_FORM_INPUT_GUARD;
    if (pfg && pfg.validateAmount) {
      if (!pfg.validateAmount(amount)) { alert(t('needAmt')); return; }
    } else if (amount == null || String(amount).trim() === '' || Number(amount) <= 0) {
      alert(t('needAmt'));
      return;
    }
    var buyerHidden = document.getElementById('buyerBlock').classList.contains('d-none');
    var buyerName = document.getElementById('buyerName').value.trim();
    if (!buyerHidden) {
      if (!buyerName) { alert(t('needName')); return; }
      if (pfg && pfg.validateEnglishName && !pfg.validateEnglishName(buyerName)) {
        alert(t('errNameEn'));
        return;
      }
      if (USE_EMAIL) {
        var emVal = document.getElementById('buyerEmail').value.trim();
        if (emVal && pfg && pfg.validateEmail && !pfg.validateEmail(emVal)) {
          alert(t('errEmailFormat'));
          return;
        }
      }
      if (USE_PHONE) {
        var telVal = document.getElementById('buyerTel').value.trim();
        if (telVal && pfg && pfg.validatePhonePlusDigits && !pfg.validatePhonePlusDigits(telVal)) {
          alert(t('errPhoneFormat'));
          return;
        }
      }
    }
    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = t('wait');
    var settleCur = (sessionData.settlementCurrency
      || (checkoutCtx && (checkoutCtx.urlPaySettlementCurrencyCode || checkoutCtx.checkoutCurrencyCode))
      || 'THB');
    settleCur = String(settleCur).trim().toUpperCase() || 'THB';
    var payload = {
      compId: cid,
      orderNo: document.getElementById('orderNo').value.trim(),
      amount: amount,
      currency: settleCur,
      productName: document.getElementById('item').value.trim(),
      customerNm: buyerName || (sessionData.customerNm || ''),
      payEmailAddress: USE_EMAIL ? document.getElementById('buyerEmail').value.trim() : '',
      payTelephone: USE_PHONE ? document.getElementById('buyerTel').value.trim() : '',
      sessionToken: document.getElementById('sessionTokenHidden').value || session || '',
      /* 직접 결제결과 화면 — /checkout forward 시 done·orderNo 유실 방지 */
      returnUrl: location.origin + '/omspay-pay.html'
        + '?m=' + encodeURIComponent(cid)
        + '&orderNo=' + encodeURIComponent(document.getElementById('orderNo').value.trim())
        + '&omspay=1&omspayReturn=1&done=1'
    };
    /* DP: 표시금액 + 견적 토큰 필수(미전송 시 INVALID_FX_QUOTE) */
    if (urlPayDisplayFxActive && urlPayPricingMode === 'DISPLAY_FX_THB') {
      var fxQ = fxShellState.urlPayFxQuote;
      if (!fxQ || (!fxQ.fxQuoteToken && fxQ.oneToOneDisplaySettlement !== true)) {
        alert(t('needFxQuote') || '환율 견적을 불러오지 못했습니다. 페이지를 새로고침한 뒤 다시 시도하세요.');
        btn.disabled = false;
        btn.textContent = t('pay');
        return;
      }
      payload.urlPayPricingMode = 'DISPLAY_FX_THB';
      payload.displayAmount = String(amount).replace(/,/g, '').trim();
      payload.amount = payload.displayAmount;
      payload.displayCurrency = (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.payFxResolvedDisplayCurrency && checkoutCtx)
        ? PG_URL_PAY_SHELL.payFxResolvedDisplayCurrency(checkoutCtx)
        : String((fxQ && fxQ.displayCurrency) || (checkoutCtx && checkoutCtx.urlPayDisplayFxDefaultDisplayCurrency) || 'USD').trim().toUpperCase();
      if (fxQ.fxQuoteToken) payload.fxQuoteToken = String(fxQ.fxQuoteToken);
      if (fxQ.settlementCurrency) {
        payload.currency = String(fxQ.settlementCurrency).trim().toUpperCase();
      }
      if (fxShellState.operationalPgCd) {
        payload.operationalPgCd = String(fxShellState.operationalPgCd).trim();
      } else if (checkoutCtx && checkoutCtx.urlPayOperationalPgCd) {
        payload.operationalPgCd = String(checkoutCtx.urlPayOperationalPgCd).trim();
      }
    }
    fetch('/api/pay/omspay/start', {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (body) {
      if (body && (body.errorCode === 'ORG_DISABLED' || body.errorCode === 'WEB_PAYMENT_DISABLED')) {
        showConfigError(body.message || t('webOff'));
        return;
      }
      var data = body && (body.data || body);
      if (body && body.success && data && (data.redirectUrl || data.paymentUrl)) {
        try {
          sessionStorage.setItem('pg_omspay_pending', JSON.stringify({
            orderNo: document.getElementById('orderNo').value.trim(),
            compId: cid,
            omsOrderCode: data.omsOrderCode || ''
          }));
        } catch (eSs) { /* ignore */ }
        location.href = data.redirectUrl || data.paymentUrl;
        return;
      }
      alert((body && (body.message || body.error)) || t('err'));
      btn.disabled = false;
      btn.textContent = t('pay');
    }).catch(function () {
      alert(t('err'));
      btn.disabled = false;
      btn.textContent = t('pay');
    });
  });
})();
</script>
</body>
</html>
