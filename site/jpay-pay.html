<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>JPAY Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/pay-inline.css?v=32" rel="stylesheet">
  <script>
    (function () {
      try {
        var q = new URLSearchParams(window.location.search || '');
        if (q.get('embed') === '1' || q.get('embed') === 'true') {
          document.documentElement.setAttribute('data-pay-embed', '1');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand" id="jpayBrandBlock">
        <div class="pay-brand-logo">ICOPAY</div>
        <div class="pay-brand-sub">JPAY Secure checkout</div>
      </div>
      <div id="configError" class="alert alert-warning pay-alert-config" style="display:none;"></div>
      <div id="payResult" class="pay-result" style="display:none;"></div>
      <form id="jpayForm" autocomplete="off">
        <input type="hidden" id="compIdHidden" name="compId">
        <input type="hidden" id="orderNo" name="orderNo">
        <div class="pay-form-grid mb-3">
          <div class="pay-row pay-row-static">
            <div class="pay-row-label">Merchant</div>
            <div class="pay-row-value"><span id="merchantNameDisplay">—</span></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="item">Item</label>
            <div class="pay-row-value"><input type="text" class="form-control form-control-sm pay-input-round" id="item" required></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="amount">Amount</label>
            <div class="pay-row-value">
              <input type="number" class="form-control form-control-sm pay-input-round" id="amount" required min="0.01" step="0.01">
              <span class="small text-muted ms-1" id="currencyHint">USD</span>
            </div>
          </div>
        </div>
        <div class="pay-label mb-2">Card</div>
        <div class="row g-2 mb-2">
          <div class="col-12"><input type="text" class="form-control form-control-sm pay-input-round" id="payCardno" inputmode="numeric" autocomplete="cc-number" placeholder="Card number" required></div>
          <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round" id="payCardmonth" maxlength="2" placeholder="MM" required></div>
          <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round" id="payCardyear" maxlength="4" placeholder="YYYY" required></div>
          <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round" id="payCardcvv" maxlength="4" placeholder="CVV" required></div>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round" id="payFirstname" placeholder="First name" required></div>
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round" id="payLastname" placeholder="Last name" required></div>
          <div class="col-12"><input type="email" class="form-control form-control-sm pay-input-round" id="payEmailAddress" placeholder="Email" required></div>
        </div>
        <button type="submit" class="btn btn-primary btn-pay w-100" id="submitBtn">Pay</button>
      </form>
    </div>
  </div>
  <script>
    (function () {
      var PAY_ENTRY_MERCHANT_API = (function () {
        try { return String(new URLSearchParams(location.search).get('entry') || '').toLowerCase() === 'merchant_api'; } catch (e) { return false; }
      })();
      var PAY_EMBED_MODE = (function () {
        try { var q = new URLSearchParams(location.search); return q.get('embed') === '1' || q.get('embed') === 'true'; } catch (e) { return false; }
      })();
      var API_BASE = (function () {
        try {
          if (location.hostname === 'api.icopay.co.kr') return location.origin.replace(/\/$/, '');
        } catch (e0) {}
        return (window.PG_API_BASE || location.origin || '').replace(/\/$/, '');
      })();

      function mapBrowserLocaleToUrlPayLang(tag) {
        if (!tag) return null;
        var s = String(tag).trim().toLowerCase();
        if (s.indexOf('ko') === 0) return 'KOR';
        if (s.indexOf('ja') === 0) return 'JPN';
        if (s.indexOf('zh') === 0) return 'CHN';
        if (s.indexOf('th') === 0) return 'THA';
        if (s.indexOf('en') === 0) return 'ENG';
        return null;
      }
      function resolveInitialUrlPayLang() {
        try {
          var p = new URLSearchParams(window.location.search);
          var raw = (p.get('lang') || p.get('LANG') || '').trim().toUpperCase();
          if (raw === 'KO' || raw === 'KR') raw = 'KOR';
          if (raw === 'JA' || raw === 'JP') raw = 'JPN';
          if (raw === 'ZH' || raw === 'CN') raw = 'CHN';
          if (raw === 'TH') raw = 'THA';
          if (raw === 'EN') raw = 'ENG';
          if (raw === 'KOR' || raw === 'ENG' || raw === 'CHN' || raw === 'JPN' || raw === 'THA') return raw;
        } catch (eQ) { /* ignore */ }
        var list = [];
        try {
          if (navigator.languages && navigator.languages.length) {
            for (var li = 0; li < navigator.languages.length; li++) list.push(navigator.languages[li]);
          }
        } catch (e1) { /* ignore */ }
        try { if (navigator.language) list.push(navigator.language); } catch (e2) { /* ignore */ }
        for (var i = 0; i < list.length; i++) {
          var hit = mapBrowserLocaleToUrlPayLang(list[i]);
          if (hit) return hit;
        }
        return 'ENG';
      }
      var LANG = resolveInitialUrlPayLang();
      var I18N = {
        KOR: {
          title: 'JPAY 결제', brandSub: 'JPAY 안전 결제', merchant: '가맹점', item: '상품명', amount: '금액', card: '카드',
          cardNo: '카드번호', firstName: '이름', lastName: '성', email: '이메일', pay: '결제',
          errMerchant: '가맹점 코드(m)가 필요합니다.', errLoad: '결제 화면을 불러오지 못했습니다.',
          payComplete: '결제 완료', payFailed: '결제 실패', paid: '결제되었습니다.', networkErr: '네트워크 오류'
        },
        ENG: {
          title: 'JPAY Payment', brandSub: 'JPAY Secure checkout', merchant: 'Merchant', item: 'Item', amount: 'Amount', card: 'Card',
          cardNo: 'Card number', firstName: 'First name', lastName: 'Last name', email: 'Email', pay: 'Pay',
          errMerchant: 'Merchant code (m) is required.', errLoad: 'Failed to load checkout.',
          payComplete: 'Payment complete', payFailed: 'Payment failed', paid: 'Paid', networkErr: 'Network error'
        },
        JPN: {
          title: 'JPAY 決済', brandSub: 'JPAY セキュア決済', merchant: '加盟店', item: '商品名', amount: '金額', card: 'カード',
          cardNo: 'カード番号', firstName: '名', lastName: '姓', email: 'メール', pay: '支払う',
          errMerchant: '加盟店コード(m)が必要です。', errLoad: '決済画面の読み込みに失敗しました。',
          payComplete: '決済完了', payFailed: '決済失敗', paid: '決済完了', networkErr: 'ネットワークエラー'
        },
        CHN: {
          title: 'JPAY 支付', brandSub: 'JPAY 安全支付', merchant: '商户', item: '商品', amount: '金额', card: '银行卡',
          cardNo: '卡号', firstName: '名', lastName: '姓', email: '邮箱', pay: '支付',
          errMerchant: '需要商户代码(m)。', errLoad: '无法加载支付页面。',
          payComplete: '支付完成', payFailed: '支付失败', paid: '已支付', networkErr: '网络错误'
        },
        THA: {
          title: 'JPAY ชำระเงิน', brandSub: 'JPAY ชำระเงินปลอดภัย', merchant: 'ร้านค้า', item: 'สินค้า', amount: 'จำนวนเงิน', card: 'บัตร',
          cardNo: 'หมายเลขบัตร', firstName: 'ชื่อ', lastName: 'นามสกุล', email: 'อีเมล', pay: 'ชำระเงิน',
          errMerchant: 'ต้องระบุรหัสร้านค้า (m)', errLoad: 'โหลดหน้าชำระเงินไม่สำเร็จ',
          payComplete: 'ชำระเงินสำเร็จ', payFailed: 'ชำระเงินล้มเหลว', paid: 'ชำระแล้ว', networkErr: 'ข้อผิดพลาดเครือข่าย'
        }
      };
      function t(key) {
        var pack = I18N[LANG] || I18N.ENG;
        return pack[key] != null ? pack[key] : (I18N.ENG[key] || key);
      }
      function applyI18n() {
        document.title = t('title');
        var sub = document.querySelector('#jpayBrandBlock .pay-brand-sub');
        if (sub) sub.textContent = t('brandSub');
        var labels = document.querySelectorAll('.pay-row-label');
        if (labels[0]) labels[0].textContent = t('merchant');
        var itemLbl = document.querySelector('label[for="item"]');
        if (itemLbl) itemLbl.textContent = t('item');
        var amtLbl = document.querySelector('label[for="amount"]');
        if (amtLbl) amtLbl.textContent = t('amount');
        var cardLbl = document.querySelector('.pay-label');
        if (cardLbl) cardLbl.textContent = t('card');
        var cardNo = document.getElementById('payCardno');
        if (cardNo) cardNo.placeholder = t('cardNo');
        var fn = document.getElementById('payFirstname');
        if (fn) fn.placeholder = t('firstName');
        var ln = document.getElementById('payLastname');
        if (ln) ln.placeholder = t('lastName');
        var em = document.getElementById('payEmailAddress');
        if (em) em.placeholder = t('email');
        var btn = document.getElementById('submitBtn');
        if (btn) btn.textContent = t('pay');
        try {
          var hl = { KOR: 'ko', ENG: 'en', JPN: 'ja', CHN: 'zh', THA: 'th' };
          document.documentElement.setAttribute('lang', hl[LANG] || 'en');
        } catch (eH) { /* ignore */ }
      }

      function getCompId() {
        try {
          var p = new URLSearchParams(location.search);
          return (p.get('m') || p.get('compId') || '').trim();
        } catch (e) { return ''; }
      }

      function apiUrl(path, qs) {
        return API_BASE + path + (qs ? ('?' + qs) : '');
      }

      function fetchJson(url) {
        return fetch(url, { credentials: 'omit', cache: 'no-store' }).then(function (r) {
          return r.text().then(function (text) {
            if (!r.ok) throw new Error(text || ('HTTP ' + r.status));
            return text ? JSON.parse(text) : {};
          });
        });
      }

      function notifyParent(detail) {
        if (!PAY_ENTRY_MERCHANT_API && !PAY_EMBED_MODE) return;
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'ICOPAY_INLINE_CHECKOUT', detail: detail || {} }, location.origin);
          }
        } catch (e) {}
      }

      function lockField(id, val) {
        var el = document.getElementById(id);
        if (!el || val == null || String(val).trim() === '') return;
        el.value = String(val);
        el.readOnly = true;
      }

      function showErr(msg) {
        var el = document.getElementById('configError');
        el.style.display = 'block';
        el.textContent = msg;
        document.getElementById('jpayForm').style.display = 'none';
      }

      function showFinished(ok, msg, orderNo, extra) {
        document.getElementById('jpayForm').style.display = 'none';
        var el = document.getElementById('payResult');
        el.style.display = 'block';
        el.className = ok ? 'ok pay-result-final' : 'err pay-result-final';
        el.innerHTML = '<div class="pay-result-title">' + (ok ? t('payComplete') : t('payFailed')) + '</div><p>' + msg + '</p>';
        notifyParent(Object.assign({ phase: 'finished', success: ok, orderNo: orderNo || '', message: msg, pgVendor: 'JPAY' }, extra || {}));
      }

      function applyQueryPrefills() {
        try {
          var p = new URLSearchParams(location.search);
          lockField('item', p.get('item') || p.get('desc'));
          lockField('amount', p.get('amount') || p.get('amt'));
          lockField('orderNo', p.get('orderNo') || p.get('OrderNo'));
          var cur = (p.get('currency') || p.get('cur') || 'USD').trim().toUpperCase();
          document.getElementById('currencyHint').textContent = cur;
        } catch (e) {}
      }

      function validateSession() {
        if (!PAY_ENTRY_MERCHANT_API) return Promise.resolve();
        var tok = '';
        try { tok = (new URLSearchParams(location.search).get('session') || '').trim(); } catch (e) {}
        if (!tok) return Promise.resolve();
        return fetchJson(apiUrl('/api/middleware/v1/merchant/jpay/inline-checkout/session', 'token=' + encodeURIComponent(tok)))
          .then(function (res) {
            if (!res.success || !res.data) throw new Error(res.message || 'Invalid session');
            var d = res.data;
            lockField('orderNo', d.orderNo);
            lockField('amount', d.amount);
            lockField('item', d.productName);
            if (d.currency) document.getElementById('currencyHint').textContent = String(d.currency).toUpperCase();
          });
      }

      function boot() {
        applyI18n();
        var compId = getCompId();
        if (!compId) { showErr(t('errMerchant')); return; }
        document.getElementById('compIdHidden').value = compId;
        if (PAY_EMBED_MODE) {
          var brand = document.getElementById('jpayBrandBlock');
          if (brand && PAY_ENTRY_MERCHANT_API) brand.style.display = 'none';
        }
        applyQueryPrefills();
        fetchJson(apiUrl('/api/pay/jpay/checkout-context', 'compId=' + encodeURIComponent(compId)))
          .then(function (ctxRes) {
            if (!ctxRes.success || !ctxRes.data) throw new Error(ctxRes.message || 'Config error');
            var ctx = ctxRes.data;
            if (ctx.merchantName) document.getElementById('merchantNameDisplay').textContent = ctx.merchantName;
            return validateSession();
          })
          .catch(function (e) { showErr(e.message || t('errLoad')); });
      }

      document.getElementById('jpayForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        btn.disabled = true;
        var compId = document.getElementById('compIdHidden').value.trim();
        var cur = document.getElementById('currencyHint').textContent.trim() || 'USD';
        var body = {
          compId: compId,
          orderNo: document.getElementById('orderNo').value.trim(),
          amount: document.getElementById('amount').value.trim(),
          currency: cur,
          item: document.getElementById('item').value.trim(),
          payCardno: document.getElementById('payCardno').value.replace(/\s/g, ''),
          payCardmonth: document.getElementById('payCardmonth').value.trim(),
          payCardyear: document.getElementById('payCardyear').value.trim(),
          payCardcvv: document.getElementById('payCardcvv').value.trim(),
          payFirstname: document.getElementById('payFirstname').value.trim(),
          payLastname: document.getElementById('payLastname').value.trim(),
          payEmailAddress: document.getElementById('payEmailAddress').value.trim(),
          txnOrigin: PAY_ENTRY_MERCHANT_API ? 'MERCHANT_API' : 'URL'
        };
        fetch(API_BASE + '/api/pay/jpay/sale', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (!res.success) {
            showFinished(false, res.message || t('payFailed'), body.orderNo, {});
            return;
          }
          var d = res.data || {};
          var st = d.status;
          var msg = d.msg || '';
          if (st === 1 && d.redirectUrl) {
            notifyParent({ phase: 'wait_authorize', success: true, orderNo: body.orderNo, paymentUrl: d.redirectUrl, pgVendor: 'JPAY' });
            location.href = d.redirectUrl;
            return;
          }
          if (st === 0) {
            showFinished(true, msg || t('paid'), body.orderNo, { jpayStatus: st });
            return;
          }
          showFinished(false, msg || t('payFailed'), body.orderNo, { jpayStatus: st });
        }).catch(function (err) {
          showFinished(false, (err && err.message) || t('networkErr'), body.orderNo, {});
        }).finally(function () { btn.disabled = false; });
      });

      boot();
    })();
  </script>
</body>
</html>
