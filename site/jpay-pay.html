<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <title>JPAY Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/pay-inline.css?v=36" rel="stylesheet">

  <script>
    (function () {
      try {
        var q = new URLSearchParams(window.location.search || '');
        if (q.get('embed') === '1' || q.get('embed') === 'true') {
          document.documentElement.setAttribute('data-pay-embed', '1');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>

<body class="pay-inline-body">
  <div class="pay-shell">
    <div class="pay-card">
      <div class="pay-brand" id="jpayBrandBlock">
        <div class="pay-brand-logo">ICOPAY</div>
        <div class="pay-brand-sub" data-i18n="brandSub">JPAY Secure checkout</div>
      </div>
      <div class="pay-lang" role="group" aria-label="Language" data-i18n-aria="langGroup">
        <button type="button" data-lang="JPN">JPN</button>
        <button type="button" data-lang="KOR">KOR</button>
        <button type="button" data-lang="ENG">ENG</button>
        <button type="button" data-lang="CHN">CHN</button>
        <button type="button" data-lang="THA">THA</button>
      </div>
      <div id="configError" class="alert alert-warning pay-alert-config" style="display:none;"></div>
      <div id="payResult" class="pay-result" style="display:none;"></div>
      <form id="jpayForm" autocomplete="off">
        <input type="hidden" id="compIdHidden" name="compId">
        <input type="hidden" id="orderNo" name="orderNo">
        <div class="pay-form-grid mb-3">
          <div class="pay-row pay-row-static">
            <div class="pay-row-label"><span data-i18n="merchant">Merchant</span></div>
            <div class="pay-row-value"><span id="merchantNameDisplay">—</span></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="item"><span data-i18n="item">Item</span></label>
            <div class="pay-row-value"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="item" required></div>
          </div>
          <div class="pay-row">
            <label class="pay-row-label mb-0" for="amount"><span data-i18n="amount">Amount</span> <span class="pay-currency-hint text-muted fw-normal" id="payAmountCurrencyHint">(JPY)</span></label>
            <div class="pay-row-value">
              <input type="number" class="form-control form-control-sm pay-input-round jpay-field-input" id="amount" required min="0.01" step="0.01">
              <p class="small text-muted mb-0 mt-1 d-none" id="payAmountScaleNotice"></p>
            </div>
          </div>
          <div class="pay-row d-none" id="payFxDisplayCurrencyRow">
            <label class="pay-row-label mb-0" for="payDisplayCurrencySelect"><span data-i18n="fxDisplayCurrency">Display currency</span></label>
            <div class="pay-row-value d-flex align-items-center gap-2 flex-wrap">
              <select class="form-select form-select-sm pay-input-round jpay-field-input" id="payDisplayCurrencySelect" style="max-width:8rem"></select>
              <span class="small text-muted" id="payFxDisplayCurrencyStatic"></span>
            </div>
          </div>
          <div class="pay-row d-none" id="payFxQuoteRow">
            <div class="pay-row-label"><span data-i18n="fxThbEstimate">Estimated charge</span></div>
            <div class="pay-row-value"><span id="payFxThbEstimateText" class="small fw-semibold">—</span></div>
          </div>
        </div>
        <div class="pay-label mb-1"><span id="payCardSectionLabel" data-i18n="card">Card</span></div>
        <p class="small text-muted mb-2 d-none" id="payCardNoteText"></p>
        <div class="mb-2" id="payCardBrandRow">
          <label class="pay-label mb-1" for="payCardBrandSelect" data-i18n="cardBrand">Card type</label>
          <select class="form-select form-select-sm pay-input-round jpay-field-input" id="payCardBrandSelect" aria-label="Card type">
            <option value="AUTO" data-i18n="cardBrandAuto">Auto detect</option>
            <option value="VISA">Visa</option>
            <option value="MASTERCARD">Mastercard</option>
            <option value="JCB">JCB</option>
            <option value="UNIONPAY">UnionPay (62…)</option>
            <option value="AMEX">American Express</option>
          </select>
        </div>
        <div id="payCardPolicyAlert" class="alert alert-danger py-2 small d-none mb-2" role="alert"></div>
        <div class="row g-2 mb-2">
          <div class="col-12"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payCardno" inputmode="numeric" autocomplete="cc-number" data-i18n-placeholder="cardNo" required></div>
          <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payCardmonth" maxlength="2" data-i18n-placeholder="mm" required></div>
          <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payCardyear" maxlength="4" data-i18n-placeholder="yyyy" required></div>
          <div class="col-4"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payCardcvv" maxlength="4" data-i18n-placeholder="cvv" required></div>
        </div>
        <div class="row g-2 mb-2" id="nameRow">
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payFirstname" data-i18n-placeholder="firstName" required></div>
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payLastname" data-i18n-placeholder="lastName" required></div>
        </div>
        <div class="row g-2 mb-2" id="contactRow">
          <div class="col-12"><input type="email" class="form-control form-control-sm pay-input-round jpay-field-input" id="payEmailAddress" data-i18n-placeholder="email" required></div>
          <div class="col-12">
            <label class="pay-label mb-1 d-block" for="payContactCountryCode" data-i18n="countryCode">Country code</label>
            <select class="form-select form-select-sm pay-input-round jpay-field-input" id="payContactCountryCode" required data-i18n-aria="countryCode" aria-label="Country code"></select>
          </div>
          <div class="col-12">
            <label class="pay-label mb-1 d-block" for="payTelephone" data-i18n="phone">Phone</label>
            <input type="tel" class="form-control form-control-sm pay-input-round jpay-field-input" id="payTelephone" data-i18n-placeholder="phoneHint" required inputmode="tel" autocomplete="tel-national">
          </div>
          <input type="hidden" id="payCountryIsoCode2">
        </div>
        <div class="pay-label mb-2" id="billingLabel" data-i18n="shipping">Shipping address</div>
        <div class="row g-2 mb-3" id="billingAddressRow">
          <div class="col-12"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payStreetAddress1" data-i18n-placeholder="address" required></div>
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payCity" data-i18n-placeholder="city" required></div>
          <div class="col-6"><input type="text" class="form-control form-control-sm pay-input-round jpay-field-input" id="payPostcode" data-i18n-placeholder="postcode" required></div>
        </div>
        <button type="submit" class="btn btn-primary btn-pay w-100" id="submitBtn" data-i18n="pay">Pay</button>
      </form>
    </div>
  </div>

        if (c === 'KO' || c === 'KR') c = 'KOR';

        if (c === 'ZH' || c === 'CN') c = 'CHN';
        if (c === 'TH') c = 'THA';
        if (c === 'EN') c = 'ENG';
        if (c !== 'KOR' && c !== 'ENG' && c !== 'CHN' && c !== 'JPN' && c !== 'THA') return;

          PG_URL_PAY_SHELL.applyCardCopyPresentation({

      function applyI18n() {

        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {

            if (!r.ok) throw new Error(text || ('HTTP ' + r.status));
            return text ? JSON.parse(text) : {};

        });

        if (!PAY_ENTRY_MERCHANT_API && !PAY_EMBED_MODE) return;
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: 'ICOPAY_INLINE_CHECKOUT', detail: detail || {} }, location.origin);
          }
        } catch (e) {}
      }

      function lockField(id, val) {
        var el = document.getElementById(id);
        if (!el || val == null || String(val).trim() === '') return;
        el.value = String(val);
        el.readOnly = true;
      }

      // JPAY 필수: (1)카드·CVV (2)성명 (3)이메일 (4)전화. (5)배송 주소.
      // FULL=전체 | CARD_ONLY=1~4 고객입력 | CARD_PREFILL=1·2만 입력, 3~6은 prepare prefill
      var CHECKOUT_FIELD_MODE = 'FULL';
      var ADDRESS_FIELD_IDS = ['payStreetAddress1', 'payCity', 'payPostcode'];
      var CONTACT_FIELD_IDS = ['payEmailAddress', 'payContactCountryCode', 'payTelephone'];

      function setFieldsRequired(ids, required) {
        ids.forEach(function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          if (required) el.setAttribute('required', 'required');
          else { el.required = false; el.removeAttribute('required'); }
        });
      }

      function applyCheckoutFieldMode(mode) {
        var m = String(mode || 'FULL').trim().toUpperCase();
        if (m !== 'CARD_ONLY' && m !== 'CARD_PREFILL') m = 'FULL';
        CHECKOUT_FIELD_MODE = m;
        applyUrlPayFormMode();
      }

      function applyUrlPayFormMode() {
        var m = CHECKOUT_FIELD_MODE;
        var hideAddress = (m === 'CARD_ONLY' || m === 'CARD_PREFILL');
        var hideContact = (m === 'CARD_PREFILL');
        /* urlPayFormMode(SIMPLE)는 ChillPay pay.html 전용. jpay-pay는 checkoutFieldMode(1·2·3형)만 적용 */
        setFieldsRequired(CONTACT_FIELD_IDS, !hideContact);
        setFieldsRequired(ADDRESS_FIELD_IDS, m === 'FULL');
        var contactRow = document.getElementById('contactRow');
        if (contactRow) contactRow.style.display = hideContact ? 'none' : '';
        ['billingLabel', 'billingAddressRow'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.style.display = hideAddress ? 'none' : '';
        });
        applyI18n();
      }

      function applyBillingPrefill(prefill) {
        if (!prefill) return;
        var p = typeof prefill === 'object' ? prefill : {};
        var contactMap = {
          payEmailAddress: p.email || p.payEmailAddress,
          payTelephone: p.phone || p.payTelephone,
          payCountryIsoCode2: p.countryIso2 || p.payCountryIsoCode2
        };
        Object.keys(contactMap).forEach(function (id) {
          var v = contactMap[id];
          var el = document.getElementById(id);
          if (el && v != null && String(v).trim() !== '') el.value = String(v).trim();
        });
        if (window.PG_JPAY_CONTACT) {
          PG_JPAY_CONTACT.applyPrefill(document.getElementById('jpayForm'), checkoutCtx, p, LANG, jpayContactSelectLabel());
        }
        if (CHECKOUT_FIELD_MODE !== 'CARD_PREFILL') return;
        var addrMap = {
          payStreetAddress1: p.address || p.payStreetAddress1,
          payCity: p.city || p.payCity,
          payPostcode: p.postcode || p.payPostcode
        };
        Object.keys(addrMap).forEach(function (id) {
          var v = addrMap[id];
          var el = document.getElementById(id);
          if (el && v != null && String(v).trim() !== '') el.value = String(v).trim();
        });
        window.__jpayShippingPrefill = {
          shippingStreetAddress1: p.shippingAddress || p.shippingStreetAddress1,
          shippingCity: p.shippingCity,
          shippingPostcode: p.shippingPostcode,
          shippingCountryIsoCode2: p.shippingCountryIso2 || p.shippingCountryIsoCode2,
          shippingTelephone: p.shippingPhone || p.shippingTelephone
        };
      }

      function assertPrefillReadyForSubmit() {
        if (CHECKOUT_FIELD_MODE !== 'CARD_PREFILL') return true;
        var form = document.getElementById('jpayForm');
        if (window.PG_JPAY_CONTACT) PG_JPAY_CONTACT.syncBeforeSubmit(form);
        var em = (document.getElementById('payEmailAddress').value || '').trim();
        var ph = (document.getElementById('payTelephone').value || '').trim();
        var cc = window.PG_JPAY_CONTACT ? PG_JPAY_CONTACT.readCountryIso2(form) : (document.getElementById('payCountryIsoCode2').value || '').trim();
        return em.length > 0 && ph.length > 0 && cc.length === 2;
      }

      function showErr(msg) {
        var el = document.getElementById('configError');
        el.style.display = 'block';
        el.textContent = msg;
        document.getElementById('jpayForm').style.display = 'none';
      }

      function showFinished(ok, msg, orderNo, extra) {
        document.getElementById('jpayForm').style.display = 'none';
        var el = document.getElementById('payResult');
        el.style.display = 'block';
        el.className = ok ? 'ok pay-result-final' : 'err pay-result-final';
        el.innerHTML = '<div class="pay-result-title">' + (ok ? t('payComplete') : t('payFailed')) + '</div><p>' + msg + '</p>';
        notifyParent(Object.assign({ phase: 'finished', success: ok, orderNo: orderNo || '', message: msg, pgVendor: 'JPAY' }, extra || {}));
      }

      function buildJpayOrderNo(compId) {
        var t = String(Date.now());
        var c = String(compId || 'X').replace(/[^0-9A-Za-z]/g, '');
        if (c.length > 6) c = c.slice(0, 6);
        var raw = 'P' + c + t;
        if (raw.length > 20) raw = raw.slice(0, 20);
        return raw;
      }

      function applyQueryPrefills() {
        try {
          var p = new URLSearchParams(location.search);
          lockField('item', p.get('item') || p.get('desc'));
          lockField('amount', p.get('amount') || p.get('amt'));
          lockField('orderNo', p.get('orderNo') || p.get('OrderNo'));
          var curParam = p.get('currency') || p.get('cur');
          if (curParam) {
            var h = document.getElementById('payAmountCurrencyHint');
            if (h) h.textContent = '(' + curParam.trim().toUpperCase() + ')';
          }
        } catch (e) {}
      }

      var checkoutCtx = null;
      var cardPolicyCtrl = null;
      var sessionPayload = null;

      function validateSession() {
        if (!PAY_ENTRY_MERCHANT_API) return Promise.resolve();
        var tok = '';
        try { tok = (new URLSearchParams(location.search).get('session') || '').trim(); } catch (e) {}
        if (!tok) return Promise.resolve();
        return fetchJson(apiUrl('/api/middleware/v1/merchant/checkout/session', 'token=' + encodeURIComponent(tok)))
          .then(function (res) {
            if (!res.success || !res.data) throw new Error(t('errInvalidSession'));
            sessionPayload = res.data;
            var d = res.data;
            lockField('orderNo', d.orderNo);
            lockField('amount', d.amount);
            lockField('item', d.productName);
            if (d.currency) {
              var h0 = document.getElementById('payAmountCurrencyHint');
              if (h0) h0.textContent = '(' + String(d.currency).toUpperCase() + ')';
            }
            applyBillingPrefill(d.buyerPrefill || d.prefill);
            applyI18n();
            if (window.PG_JPAY_CONTACT) {
              var f = document.getElementById('jpayForm');
              if (f && !PG_JPAY_CONTACT.readCountryIso2(f)) {
                PG_JPAY_CONTACT.init(f, checkoutCtx || {}, LANG, jpayContactSelectLabel());
              }
            }
          });
      }

      function assertSessionMatchesForm() {
        if (!sessionPayload) return true;
        var on = (document.getElementById('orderNo').value || '').trim();
        var amt = (document.getElementById('amount').value || '').trim();
        var spOn = sessionPayload.orderNo != null ? String(sessionPayload.orderNo).trim() : '';
        var spAmt = sessionPayload.amount != null ? String(sessionPayload.amount).trim() : '';
        if (spOn && on && spOn !== on) return false;
        if (spAmt && amt && spAmt !== amt) return false;
        return true;
      }

      function jpayPayLanguageCode() {
        var m = { KOR: 'ko', ENG: 'en', JPN: 'ja', CHN: 'zh', THA: 'th' };
        return m[LANG] || 'en';
      }

      function initJpayContactFields(ctx) {
        var form = document.getElementById('jpayForm');
        if (!form || !window.PG_JPAY_CONTACT) return;
        PG_JPAY_CONTACT.init(form, ctx || {}, LANG, jpayContactSelectLabel());
      }

      function applyCheckoutContext(ctx) {
        checkoutCtx = ctx;
        urlPayFormMode = ctx.urlPayFormMode != null ? String(ctx.urlPayFormMode) : 'FULL';
        urlPayAmountScaleMode = ctx.urlPayAmountScaleMode != null ? String(ctx.urlPayAmountScaleMode) : 'SAME';
        urlPayPricingMode = String(ctx.urlPayPricingMode || 'CHECKOUT_CURRENCY').toUpperCase();
        urlPayDisplayFxActive = ctx.urlPayDisplayFxActive === true;
        window.__payUrlCardCopy = ctx.urlPayCardCopy || null;
        applyCheckoutFieldMode(ctx.checkoutFieldMode);
        if (window.PG_CARD_PAY_POLICY && ctx.cardPayPolicy) {
          cardPolicyCtrl = PG_CARD_PAY_POLICY.init({
            policy: ctx.cardPayPolicy,
            panInput: document.getElementById('payCardno'),
            brandSelect: document.getElementById('payCardBrandSelect'),
            alertEl: document.getElementById('payCardPolicyAlert'),
            cvvInput: document.getElementById('payCardcvv'),
            lang: LANG,
            onLangChange: function () { return LANG; }
          });
        }
        if (ctx.merchantName) document.getElementById('merchantNameDisplay').textContent = ctx.merchantName;
        if (ctx.checkoutHeaderLogoUrl) {
          var logoWrap = document.querySelector('#jpayBrandBlock .pay-brand-logo');
          if (logoWrap) {
            logoWrap.innerHTML = '';
            var img = document.createElement('img');
            img.src = (window.PG_URL_PAY_SHELL && PG_URL_PAY_SHELL.absPayAssetUrl)
              ? PG_URL_PAY_SHELL.absPayAssetUrl(ctx.checkoutHeaderLogoUrl) : ctx.checkoutHeaderLogoUrl;
            img.alt = ctx.merchantName || 'ICOPAY';
            img.className = 'pay-brand-logo-img';
            logoWrap.appendChild(img);
          }
        }
        var itemEl = document.getElementById('item');
        if (itemEl && !itemEl.readOnly && ctx.defaultProductName) itemEl.value = String(ctx.defaultProductName).trim();
        var amtEl = document.getElementById('amount');
        if (amtEl && !amtEl.readOnly) {
          var defAmt = ctx.defaultAmount != null ? ctx.defaultAmount : ctx.defaultCheckoutAmount;
          if (defAmt != null && defAmt !== '') amtEl.value = String(defAmt).trim();
        }
        var curHint = document.getElementById('payAmountCurrencyHint');
        if (curHint && !urlPayDisplayFxActive && ctx.checkoutCurrencyCode) {
          var q = new URLSearchParams(location.search);
          if (!(q.get('currency') || q.get('cur'))) {
            curHint.textContent = '(' + String(ctx.checkoutCurrencyCode).trim().toUpperCase() + ')';
          }
        }
        applyI18n();
        if (window.PG_URL_PAY_SHELL) {
          PG_URL_PAY_SHELL.applyCardCopyPresentation({ lang: LANG, cardCopy: window.__payUrlCardCopy, t: t });
          PG_URL_PAY_SHELL.applyAmountScaleNotice({ lang: LANG, cardCopy: window.__payUrlCardCopy, scaleMode: urlPayAmountScaleMode });
        }
        initJpayContactFields(ctx);
      }

      function boot() {
        applyI18n();
        if (window.PG_URL_PAY_SHELL) {
          PG_URL_PAY_SHELL.wireLanguageButtons(function () { return LANG; }, setLang);
        }
        var compId = getCompId();
        if (!compId) { showErr(t('errMerchant')); return; }
        document.getElementById('compIdHidden').value = compId;
        if (PAY_EMBED_MODE) {
          var brand = document.getElementById('jpayBrandBlock');
          if (brand && PAY_ENTRY_MERCHANT_API) brand.style.display = 'none';
        }
        applyQueryPrefills();
        fetchJson(apiUrl('/api/pay/url/checkout-context', 'compId=' + encodeURIComponent(compId)))
          .then(function (ctxRes) {
            if (!ctxRes.success || !ctxRes.data) throw new Error(ctxRes.message || t('configErr'));
            applyCheckoutContext(ctxRes.data);
            fxShellState.checkoutCtx = checkoutCtx;
            fxShellState.compId = compId;
            fxShellState.apiUrl = apiUrl;
            fxShellState.t = t;
            fxShellState.urlPayDisplayFxActive = urlPayDisplayFxActive;
            var fxP = window.PG_URL_PAY_SHELL
              ? PG_URL_PAY_SHELL.initDisplayFx(fxShellState) : Promise.resolve();
            return fxP.then(function () { return validateSession(); });
          })
          .then(function () {
            var ordEl = document.getElementById('orderNo');
            if (ordEl && !String(ordEl.value || '').trim()) {
              ordEl.value = buildJpayOrderNo(compId);
            }
          })
          .catch(function (e) { showErr(e.message || t('errLoad')); });
      }

      document.getElementById('jpayForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        if (!assertSessionMatchesForm()) {
          showErr(t('errSessionMismatch'));
          return;
        }
        if (!assertPrefillReadyForSubmit()) {
          showErr(t('errPrefillRequired'));
          return;
        }
        if (cardPolicyCtrl && typeof cardPolicyCtrl.validateFinal === 'function') {
          var cardChk = cardPolicyCtrl.validateFinal();
          if (!cardChk.valid) {
            showErr(cardChk.message || t('errLoad'));
            return;
          }
        }
        var formEl = document.getElementById('jpayForm');
        if (window.PG_JPAY_CONTACT) PG_JPAY_CONTACT.syncBeforeSubmit(formEl);
        var ccVal = window.PG_JPAY_CONTACT ? PG_JPAY_CONTACT.readCountryIso2(formEl) : (document.getElementById('payCountryIsoCode2').value || '').trim().toUpperCase();
        if (ccVal.length !== 2) {
          showErr(t('errCountryCode'));
          return;
        }
        btn.disabled = true;
        var compId = document.getElementById('compIdHidden').value.trim();
        var amtStr = String(document.getElementById('amount').value || '').replace(/,/g, '').trim();
        var amtRaw = parseFloat(amtStr);
        if (!(amtRaw > 0)) {
          showFinished(false, t('needAmount'), '', {});
          btn.disabled = false;
          return;
        }
        if (urlPayDisplayFxActive && urlPayPricingMode === 'DISPLAY_FX_THB') {
          var q = fxShellState.urlPayFxQuote;
          if (!q || !q.fxQuoteToken) {
            showFinished(false, t('needFxQuote'), document.getElementById('orderNo').value.trim(), {});
            btn.disabled = false;
            return;
          }
        }
        var cur = (checkoutCtx && checkoutCtx.checkoutCurrencyCode)
          ? String(checkoutCtx.checkoutCurrencyCode).trim().toUpperCase()
          : 'JPY';
        if (urlPayDisplayFxActive && urlPayPricingMode === 'DISPLAY_FX_THB') {
          var setCode = checkoutCtx && checkoutCtx.urlPaySettlementCurrencyCode
            ? String(checkoutCtx.urlPaySettlementCurrencyCode).trim().toUpperCase() : '';
          if (!setCode || ['THB', 'USD', 'JPY', 'KRW', 'SGD', 'HKD', 'CNY'].indexOf(setCode) < 0) {
            setCode = (fxShellState.urlPayFxQuote && fxShellState.urlPayFxQuote.settlementCurrency)
              ? String(fxShellState.urlPayFxQuote.settlementCurrency).trim().toUpperCase() : 'THB';
          }
          cur = setCode || 'THB';
        }
        var body = {
          compId: compId,
          orderNo: document.getElementById('orderNo').value.trim(),
          amount: amtStr,
          currency: cur,
          item: document.getElementById('item').value.trim(),
          payCardno: document.getElementById('payCardno').value.replace(/\s/g, ''),
          payCardBrand: (function () {
            var sel = document.getElementById('payCardBrandSelect');
            var v = sel && sel.value ? String(sel.value).trim() : 'AUTO';
            return v === 'AUTO' && window.PG_CARD_PAY_POLICY
              ? PG_CARD_PAY_POLICY.detectBrand(PG_CARD_PAY_POLICY.digitsOnly(document.getElementById('payCardno').value))
              : v;
          })(),
          payCardmonth: document.getElementById('payCardmonth').value.trim(),
          payCardyear: document.getElementById('payCardyear').value.trim(),
          payCardcvv: document.getElementById('payCardcvv').value.trim(),
          payFirstname: document.getElementById('payFirstname').value.trim(),
          payLastname: document.getElementById('payLastname').value.trim(),
          payEmailAddress: document.getElementById('payEmailAddress').value.trim(),
          payTelephone: document.getElementById('payTelephone').value.trim(),
          payCountryIsoCode2: ccVal,
          payStreetAddress1: document.getElementById('payStreetAddress1').value.trim(),
          payCity: document.getElementById('payCity').value.trim(),
          payPostcode: document.getElementById('payPostcode').value.trim(),
          payLanguage: jpayPayLanguageCode(),
          langCode: LANG,
          system: 'icopay',
          txnOrigin: PAY_ENTRY_CHATBOT ? 'CHATBOT' : (PAY_ENTRY_MERCHANT_API ? 'MERCHANT_API' : 'URL')
        };
        if (urlPayDisplayFxActive && urlPayPricingMode === 'DISPLAY_FX_THB') {
          body.urlPayPricingMode = 'DISPLAY_FX_THB';
          body.displayCurrency = window.PG_URL_PAY_SHELL
            ? PG_URL_PAY_SHELL.payFxResolvedDisplayCurrency(checkoutCtx) : 'JPY';
          body.displayAmount = amtStr;
          body.fxQuoteToken = (fxShellState.urlPayFxQuote && fxShellState.urlPayFxQuote.fxQuoteToken)
            ? String(fxShellState.urlPayFxQuote.fxQuoteToken) : '';
        }
        var ship = window.__jpayShippingPrefill || {};
        if (ship.shippingStreetAddress1) body.shippingStreetAddress1 = String(ship.shippingStreetAddress1).trim();
        if (ship.shippingCity) body.shippingCity = String(ship.shippingCity).trim();
        if (ship.shippingPostcode) body.shippingPostcode = String(ship.shippingPostcode).trim();
        if (ship.shippingCountryIsoCode2) body.shippingCountryIsoCode2 = String(ship.shippingCountryIsoCode2).trim().toUpperCase();
        if (ship.shippingTelephone) body.shippingTelephone = String(ship.shippingTelephone).trim();
        fetch(API_BASE + '/api/pay/url/sale', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        }).then(function (r) { return r.json(); }).then(function (res) {
          if (!res.success) {
            showFinished(false, res.message || t('payFailed'), body.orderNo, {});
            return;
          }
          var d = res.data || {};
          var st = d.status;
          var msg = d.msg || '';
          if (st === 1 && d.redirectUrl) {
            notifyParent({ phase: 'wait_authorize', success: true, orderNo: body.orderNo, paymentUrl: d.redirectUrl, pgVendor: 'JPAY' });
            location.href = d.redirectUrl;
            return;
          }
          if (st === 0) {
            showFinished(true, msg || t('paid'), body.orderNo, { jpayStatus: st });
            return;
          }
          showFinished(false, msg || t('payFailed'), body.orderNo, { jpayStatus: st });
        }).catch(function (err) {
          showFinished(false, (err && err.message) || t('networkErr'), body.orderNo, {});
        }).finally(function () { btn.disabled = false; });
      });

      boot();
    })();
  </script>
</body>
</html>
