# api.icopay.co.kr — Nginx 전체 설정 (한 번에 복사·붙여넣기용)
#
# 사용법 (VPS, conf.d 예시 — otlpay 등):
#   1) 백업
#        sudo cp /etc/nginx/conf.d/api-icopay.conf /etc/nginx/conf.d/api-icopay.conf.bak
#   2) 아래 전체를 /etc/nginx/conf.d/api-icopay.conf 에 덮어쓰기
#        sudo nano /etc/nginx/conf.d/api-icopay.conf
#   3) 다른 파일에 server_name api.icopay.co.kr 이 중복이면 제거
#   4) 적용
#        sudo nginx -t && sudo systemctl reload nginx
#
# Cloudflare Flexible: 방문자 HTTPS, 원본 80만 쓸 때 무한 301 방지 (X-Forwarded-Proto: https 이면 프록시)

map $http_x_forwarded_proto $api_80_need_redirect {
    default 1;
    https   0;
}

server {
    server_name api.icopay.co.kr;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/api.icopay.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.icopay.co.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name api.icopay.co.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
        try_files $uri =404;
    }

    location / {
        if ($api_80_need_redirect) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
