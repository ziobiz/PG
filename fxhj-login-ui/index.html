<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1 class="logo">ONTHELINE FXHJ</h1>
    </header>

    <main class="main">
      <section class="login-section">
        <h2 class="blind">로그인</h2>
        <p class="wait-msg" id="waitMsg">잠시만 기다려주십시오</p>

        <form class="login-form" id="loginForm" action="#" method="post">
          <div class="form-group">
            <label for="userId">아이디</label>
            <input type="text" id="userId" name="userId" autocomplete="username" placeholder="">
          </div>
          <div class="form-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="">
          </div>
          <div class="form-group">
            <label for="changePassword">변경 비밀번호</label>
            <input type="password" id="changePassword" name="changePassword" placeholder="">
          </div>
          <div class="form-group">
            <label for="authNumber">인증번호</label>
            <input type="text" id="authNumber" name="authNumber" placeholder="">
          </div>
          <div class="form-group">
            <label for="otpNumber">OTP번호</label>
            <input type="text" id="otpNumber" name="otpNumber" placeholder="" inputmode="numeric" maxlength="6">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-login">로그인</button>
            <p class="form-footer-link"><button type="button" class="link-btn" id="openChangePwModal">초기비밀번호 변경</button></p>
          </div>
        </form>
      </section>

      <section class="notice-section" role="note" aria-labelledby="loginFraudNoticeTitle">
        <h3 class="notice-title" id="loginFraudNoticeTitle">사칭 피해 주의 안내</h3>
        <p>최근 본사나 PG사를 사칭해 금전적 요구를 하는 사례가 발생하고 있습니다.</p>
        <p>저희는 결제와 관련한 금전을 별도로 요청하지 않습니다. 의심스러운 연락을 받으셨다면 <strong>고객센터</strong> 또는 <strong>계약된 영업지사</strong>로 사실 여부를 반드시 확인해 주시기 바랍니다.</p>
      </section>
    </main>

    <footer class="footer">
      <!-- 푸터 필요시 -->
    </footer>
  </div>

  <!-- 초기비밀번호 변경 모달 -->
  <div class="modal" id="modalChangePassword" aria-hidden="true">
    <div class="modal-backdrop" data-close="modalChangePassword"></div>
    <div class="modal-dialog">
      <div class="modal-header">
        <h4 class="modal-title">초기비밀번호 변경</h4>
        <button type="button" class="modal-close" data-close="modalChangePassword" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-validation-msg">4자미만 , 아이디+1!, 초기화된 비밀번호와 동일한 비밀번호는 사용불가</p>
        <div class="form-group">
          <label for="modalOldPassword">기존비밀번호</label>
          <input type="password" id="modalOldPassword" name="oldPassword">
        </div>
        <div class="form-group">
          <label for="modalNewPassword">변경 비밀번호</label>
          <input type="password" id="modalNewPassword" name="newPassword">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" data-close="modalChangePassword">닫기</button>
        <button type="button" class="btn-primary" id="btnSavePassword">저장</button>
      </div>
    </div>
  </div>

  <!-- 확인 모달 -->
  <div class="modal" id="modalConfirm" aria-hidden="true">
    <div class="modal-backdrop" data-close="modalConfirm"></div>
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h4 class="modal-title">Modal Heading</h4>
        <button type="button" class="modal-close" data-close="modalConfirm" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-message">확인</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-primary" data-close="modalConfirm">확인</button>
      </div>
    </div>
  </div>

  <!-- 알림 모달 -->
  <div class="modal" id="modalAlert" aria-hidden="true">
    <div class="modal-backdrop" data-close="modalAlert"></div>
    <div class="modal-dialog modal-sm">
      <div class="modal-header">
        <h4 class="modal-title">알림</h4>
        <button type="button" class="modal-close" data-close="modalAlert" aria-label="닫기">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-message">닫기 확인</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" data-close="modalAlert">닫기</button>
        <button type="button" class="btn-primary" data-close="modalAlert">확인</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
