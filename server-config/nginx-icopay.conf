# icopay.co.kr - 사이트 전용 (API는 api.icopay.co.kr)
# 서버에 넣을 위치: /etc/nginx/sites-available/icopay.conf
#
# ★ SSL 인증서: Let's Encrypt (certbot) 사용 시
#    sudo certbot certonly --nginx -d icopay.co.kr -d www.icopay.co.kr
#
# ★ Nginx 문서 루트 = FTP 업로드 경로: /home/ftpuser/site

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name icopay.co.kr www.icopay.co.kr;
    return 301 https://icopay.co.kr$request_uri;
}

# HTTPS (SSL) - 사이트만 (API 없음, 홈페이지 분리 가능)
server {
    listen 443 ssl http2;
    server_name icopay.co.kr www.icopay.co.kr;

    ssl_certificate /etc/letsencrypt/live/icopay.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icopay.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    root /home/ftpuser/site;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept "application/json";

        # ★ 결제내역/수수료내역 장기간 조회·엑셀 모두다운로드 504 방지(기본 60초 → 300초).
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
