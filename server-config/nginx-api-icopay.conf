# api.icopay.co.kr - API 전용 (pg-app 8080)
# 서버에 넣을 위치: /etc/nginx/sites-available/api-icopay.conf
#
# ★ SSL 인증서: Let's Encrypt (certbot) 사용 시
#    sudo certbot certonly --nginx -d api.icopay.co.kr
#
# ★ icopay.co.kr 사이트에서 이 API로 요청 (CORS 허용됨)

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name api.icopay.co.kr;
    return 301 https://api.icopay.co.kr$request_uri;
}

# HTTPS (SSL) - API만
server {
    listen 443 ssl http2;
    server_name api.icopay.co.kr;

    ssl_certificate /etc/letsencrypt/live/api.icopay.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.icopay.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ★ 반드시 백엔드에 https 를 알려야 함. $http_x_forwarded_proto 만 쓰면 클라이언트가 헤더를 안 보낼 때 비어
        #    Tomcat이 http 로 착각 → Spring 302 Location 이 http → Nginx 301 https → ERR_TOO_MANY_REDIRECTS
        # 이 server 블록이 443 에서 TLS 종단이면 $scheme == https 가 맞음.
        # 이중 프록시(앞단이 CF 등)면 nginx-forwarded-proto-map.snippet 의 $pg_forwarded_proto 사용.
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ 결제내역/수수료내역 장기간(전월·한달치) 조회·엑셀 모두다운로드 504 방지.
        #    기본 proxy_read_timeout 60초로는 대용량 집계·다운로드가 끊겨 504 Gateway Time-out 발생.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        # 대용량 엑셀 다운로드 응답을 디스크 임시버퍼링 없이 흘려보냄(메모리/지연 완화).
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
