# api.icopay.co.kr - API 전용 (pg-app 8080)
# 서버에 넣을 위치: /etc/nginx/sites-available/api-icopay.conf
#
# ★ SSL 인증서: Let's Encrypt (certbot) 사용 시
#    sudo certbot certonly --nginx -d api.icopay.co.kr
#
# ★ icopay.co.kr 사이트에서 이 API로 요청 (CORS 허용됨)

# HTTP → HTTPS 리다이렉트
server {
    listen 80;
    server_name api.icopay.co.kr;
    return 301 https://api.icopay.co.kr$request_uri;
}

# HTTPS (SSL) - API만
server {
    listen 443 ssl http2;
    server_name api.icopay.co.kr;

    ssl_certificate /etc/letsencrypt/live/api.icopay.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.icopay.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Cloudflare 뒤 오리진이면 방문자 원본 스킴은 CF 의 X-Forwarded-Proto 사용
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
