# api.icopay.co.kr — Apache(httpd)에서 전체 경로를 pg-app(8080)으로 넘김
#
# 증상: 브라우저/curl 로 https://api.icopay.co.kr/ 또는 /login.html / /api/... 가
#       "Forbidden — You don't have permission to access ... on this server" (Apache 403)
# 원인: DocumentRoot 에 파일이 없거나, /api 만 프록시하고 나머지는 막힌 기본 vhost
#
# 적용 (CentOS/RHEL 예):
#   sudo cp apache-api-icopay-reverse-proxy.conf /etc/httpd/conf.d/api-icopay.conf
#   # SSL 경로는 certbot 실제 경로에 맞게 수정
#   sudo systemctl restart httpd
#
# Debian/Ubuntu 예:
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo cp ... /etc/apache2/sites-available/api-icopay.conf
#   sudo a2ensite api-icopay
#   sudo systemctl reload apache2
#
# SELinux 사용 시( CentOS 등 ):
#   sudo setsebool -P httpd_can_network_connect 1
#
# ★ Nginx 가 이미 443 을 쓰고 있으면 Apache 와 충돌합니다. 둘 중 하나만 443 사용.

<VirtualHost *:80>
    ServerName api.icopay.co.kr
    Redirect permanent / https://api.icopay.co.kr/
</VirtualHost>

<VirtualHost *:443>
    ServerName api.icopay.co.kr

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.icopay.co.kr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.icopay.co.kr/privkey.pem

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    # 전체를 Spring Boot 로 ( /, /login.html, /api/... 동일 )
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/
</VirtualHost>
