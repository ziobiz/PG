# icopay.co.kr + www — 정적 site(/home/ftpuser/site) + /api → pg-app 8080 + 무료 SSL(Let's Encrypt)
# NOTI/일반 운영과 동일 패턴: certbot 발급 후 이 파일을 sites-enabled 에 연결
#
# 사전: DNS A 레코드 icopay.co.kr, www.icopay.co.kr → 이 서버 IP
# 인증서:
#   sudo certbot certonly --nginx -d icopay.co.kr -d www.icopay.co.kr
#   또는 webroot 방식은 docs/무료_SSL_NOTI와_동일_LetsEncrypt.md 참고
#
# 적용:
#   sudo cp nginx-icopay-site-ssl.conf /etc/nginx/sites-available/icopay-site-ssl.conf
#   sudo ln -sf /etc/nginx/sites-available/icopay-site-ssl.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name icopay.co.kr www.icopay.co.kr;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name icopay.co.kr www.icopay.co.kr;

    ssl_certificate /etc/letsencrypt/live/icopay.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icopay.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /home/ftpuser/site;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept "application/json";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
