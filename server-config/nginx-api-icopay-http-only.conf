# api.icopay.co.kr - API 전용 (HTTP만, SSL 없음)
# 서버 경로: /etc/nginx/conf.d/api-icopay.conf
# SSL 적용: setup-api-nginx-ssl.sh 실행

server {
    listen 80;
    server_name api.icopay.co.kr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Cloudflare(주황 프록시) 뒤: 방문자는 HTTPS, 오리진은 80 → $scheme 은 http.
    # CF가 넘기는 X-Forwarded-Proto(https)를 그대로 백엔드에 전달해야 Spring 리다이렉트·절대 URL이 https 로 나감.
    # (비어 있으면 직접 접속으로 간주: 아래 map 을 nginx.conf http{} 에 추가 권장)
    # map $http_x_forwarded_proto $pg_forwarded_proto { "" $scheme; default $http_x_forwarded_proto; }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
