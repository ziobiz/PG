# otlpay.cafe24.com + icopay.co.kr - 사이트(정적) + API 8080
# 서버에 넣을 위치: /etc/nginx/sites-available/otlpay.conf
#
# ★ icopay.co.kr 도메인 추가 → Cloudflare 통해 접속 시 동일 사이트 서빙
# ★ root: /home/ftpuser/site (FTP 업로드 경로)

server {
    listen 80;
    server_name otlpay.cafe24.com icopay.co.kr www.icopay.co.kr;

    root /home/ftpuser/site;
    index index.html;

    # ★ proxy_set_header Accept "application/json" 금지 — 브라우저/HTML은 text/html 필요, 406 유발
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
