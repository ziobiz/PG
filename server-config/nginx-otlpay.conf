# otlpay.cafe24.com - 우리가 개발한 사이트(정적) + API는 8080으로
# 서버에 넣을 위치: /etc/nginx/sites-available/otlpay.conf
#
# ★ Nginx 문서 루트 = FTP 업로드 경로 (같은 경로로 통일)
#    경로: /home/ftpuser/site
#    - FTP(ftpuser)로 올리면 이 폴더에 저장됨
#    - Nginx는 이 폴더를 그대로 서빙함 → 한 곳만 맞추면 됨
#    - 로컬 site 폴더 "안의 내용"만 이 경로에 올리기 (site 폴더 자체 X)

server {
    listen 80;
    server_name otlpay.cafe24.com;

    # 우리 사이트 파일 위치 = FTP로 올리는 위치 (동일)
    root /home/ftpuser/site;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API만 8080 백엔드로 전달
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
