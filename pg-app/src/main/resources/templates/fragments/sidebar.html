<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- fxhj.soonpay.co.kr/main 기준 전 메뉴 구조 + 접기/펼치기 -->
  <div class="sidebar-inner" th:fragment="sidebar(activeMenu='')">
    <nav class="dashboard-nav">
      <div class="nav-label">주요 메뉴</div>
      <a th:href="@{/main}" th:classappend="${activeMenu == 'main'} ? 'active' : ''" title="대시보드"><span class="nav-icon">▤</span><span class="nav-text">대시보드</span></a>
      <a th:href="@{/transactions}" th:classappend="${activeMenu == 'transactions'} ? 'active' : ''" title="거래 조회"><span class="nav-icon">▥</span><span class="nav-text">거래 조회</span></a>
      <div class="nav-label">영업 조직</div>
      <a th:href="@{/org/1}" th:classappend="${activeMenu == 'org1'} ? 'active' : ''" title="총본사"><span class="nav-icon">1</span><span class="nav-text">총본사</span></a>
      <a th:href="@{/org/2}" th:classappend="${activeMenu == 'org2'} ? 'active' : ''" title="지역본사"><span class="nav-icon">2</span><span class="nav-text">지역본사</span></a>
      <a th:href="@{/org/3}" th:classappend="${activeMenu == 'org3'} ? 'active' : ''" title="총판"><span class="nav-icon">3</span><span class="nav-text">총판</span></a>
      <a th:href="@{/org/4}" th:classappend="${activeMenu == 'org4'} ? 'active' : ''" title="지사"><span class="nav-icon">4</span><span class="nav-text">지사</span></a>
      <a th:href="@{/org/5}" th:classappend="${activeMenu == 'org5'} ? 'active' : ''" title="대리점"><span class="nav-icon">5</span><span class="nav-text">대리점</span></a>
      <a th:href="@{/org/6}" th:classappend="${activeMenu == 'org6'} ? 'active' : ''" title="가맹점"><span class="nav-icon">6</span><span class="nav-text">가맹점</span></a>
      <div class="nav-label">운영 메뉴</div>
      <a th:href="@{/merchant/list}" th:classappend="${activeMenu == 'merchant'} ? 'active' : ''" title="가맹점 관리"><span class="nav-icon">M</span><span class="nav-text">가맹점 관리</span></a>
      <a th:href="@{/group/list}" th:classappend="${activeMenu == 'group'} ? 'active' : ''" title="총판 관리"><span class="nav-icon">G</span><span class="nav-text">총판 관리</span></a>
      <a th:href="@{/member/list}" th:classappend="${activeMenu == 'member'} ? 'active' : ''" title="멤버 관리"><span class="nav-icon">U</span><span class="nav-text">멤버 관리</span></a>
      <div class="nav-label">정산</div>
      <a th:href="@{/settle/list}" th:classappend="${activeMenu == 'settle'} ? 'active' : ''" title="가맹점 정산"><span class="nav-icon">$</span><span class="nav-text">가맹점 정산</span></a>
      <a th:href="@{/settle/groupList}" th:classappend="${activeMenu == 'settleGroup'} ? 'active' : ''" title="총판 정산"><span class="nav-icon">$</span><span class="nav-text">총판 정산</span></a>
      <a th:href="@{/settle/report}" th:classappend="${activeMenu == 'settleReport'} ? 'active' : ''" title="정산 리포트"><span class="nav-icon">R</span><span class="nav-text">정산 리포트</span></a>
      <div class="nav-label">시스템</div>
      <a th:href="@{/terminal/list}" th:classappend="${activeMenu == 'terminal'} ? 'active' : ''" title="터미널"><span class="nav-icon">T</span><span class="nav-text">터미널</span></a>
      <a th:href="@{/van/list}" th:classappend="${activeMenu == 'van'} ? 'active' : ''" title="VAN"><span class="nav-icon">V</span><span class="nav-text">VAN</span></a>
      <a th:href="@{/code/list}" th:classappend="${activeMenu == 'code'} ? 'active' : ''" title="코드"><span class="nav-icon">C</span><span class="nav-text">코드</span></a>
      <a th:href="@{/memberRole/list}" th:classappend="${activeMenu == 'memberRole'} ? 'active' : ''" title="권한"><span class="nav-icon">A</span><span class="nav-text">권한</span></a>
    </nav>
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="메뉴 접기/펼치기" title="메뉴 접기">
      <span class="toggle-icon" aria-hidden="true">◀</span>
    </button>
  </div>
</body>
</html>
