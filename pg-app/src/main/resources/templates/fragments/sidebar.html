<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <!-- Legacy menu structure (English fallback) -->
  <div class="sidebar-inner" th:fragment="sidebar">
    <nav class="dashboard-nav">
      <div class="nav-label">Main</div>
      <a th:href="@{/main}" th:classappend="${activeMenu == 'main'} ? 'active' : ''" title="Dashboard"><span class="nav-icon">▤</span><span class="nav-text">Dashboard</span></a>
      <a th:href="@{/transactions}" th:classappend="${activeMenu == 'transactions'} ? 'active' : ''" title="Transactions"><span class="nav-icon">▥</span><span class="nav-text">Transactions</span></a>
      <div class="nav-label">Org</div>
      <a th:href="@{/org/1}" th:classappend="${activeMenu == 'org1'} ? 'active' : ''" title="OTL HQ"><span class="nav-icon">1</span><span class="nav-text">OTL HQ</span></a>
      <a th:href="@{/org/2}" th:classappend="${activeMenu == 'org2'} ? 'active' : ''" title="Regional HQ"><span class="nav-icon">2</span><span class="nav-text">Regional HQ</span></a>
      <a th:href="@{/org/3}" th:classappend="${activeMenu == 'org3'} ? 'active' : ''" title="Master distributor"><span class="nav-icon">3</span><span class="nav-text">Master distributor</span></a>
      <a th:href="@{/org/4}" th:classappend="${activeMenu == 'org4'} ? 'active' : ''" title="Branch"><span class="nav-icon">4</span><span class="nav-text">Branch</span></a>
      <a th:href="@{/org/5}" th:classappend="${activeMenu == 'org5'} ? 'active' : ''" title="Agency"><span class="nav-icon">5</span><span class="nav-text">Agency</span></a>
      <a th:href="@{/org/6}" th:classappend="${activeMenu == 'org6'} ? 'active' : ''" title="Merchant"><span class="nav-icon">6</span><span class="nav-text">Merchant</span></a>
      <div class="nav-label">Ops</div>
      <a th:href="@{/merchant/list}" th:classappend="${activeMenu == 'merchant'} ? 'active' : ''" title="Merchants"><span class="nav-icon">M</span><span class="nav-text">Merchants</span></a>
      <a th:href="@{/group/list}" th:classappend="${activeMenu == 'group'} ? 'active' : ''" title="Distributors"><span class="nav-icon">G</span><span class="nav-text">Distributors</span></a>
      <a th:href="@{/member/list}" th:classappend="${activeMenu == 'member'} ? 'active' : ''" title="Members"><span class="nav-icon">U</span><span class="nav-text">Members</span></a>
      <div class="nav-label">Settlement</div>
      <a th:href="@{/settle/list}" th:classappend="${activeMenu == 'settle'} ? 'active' : ''" title="Merchant settlement"><span class="nav-icon">$</span><span class="nav-text">Merchant settlement</span></a>
      <a th:href="@{/settle/groupList}" th:classappend="${activeMenu == 'settleGroup'} ? 'active' : ''" title="Distributor settlement"><span class="nav-icon">$</span><span class="nav-text">Distributor settlement</span></a>
      <a th:href="@{/settle/report}" th:classappend="${activeMenu == 'settleReport'} ? 'active' : ''" title="Settlement report"><span class="nav-icon">R</span><span class="nav-text">Settlement report</span></a>
      <div class="nav-label">System</div>
      <a th:href="@{/terminal/list}" th:classappend="${activeMenu == 'terminal'} ? 'active' : ''" title="Terminals"><span class="nav-icon">T</span><span class="nav-text">Terminals</span></a>
      <a th:href="@{/van/list}" th:classappend="${activeMenu == 'van'} ? 'active' : ''" title="VAN"><span class="nav-icon">V</span><span class="nav-text">VAN</span></a>
      <a th:href="@{/code/list}" th:classappend="${activeMenu == 'code'} ? 'active' : ''" title="Codes"><span class="nav-icon">C</span><span class="nav-text">Codes</span></a>
      <a th:href="@{/memberRole/list}" th:classappend="${activeMenu == 'memberRole'} ? 'active' : ''" title="Permissions"><span class="nav-icon">A</span><span class="nav-text">Permissions</span></a>
    </nav>
    <button type="button" class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle menu" title="Toggle menu">
      <span class="toggle-icon" aria-hidden="true">◀</span>
    </button>
  </div>
</body>
</html>
