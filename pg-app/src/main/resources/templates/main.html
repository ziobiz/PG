<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — PG Admin</title>
  <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
</head>
<body>
  <div class="dashboard-wrap">
    <aside class="dashboard-sidebar">
      <div class="logo"><span class="logo-text">PG Admin</span><span class="logo-short">PG</span></div>
      <div th:replace="~{fragments/sidebar :: sidebar}" th:with="activeMenu='main'"></div>
    </aside>
    <div class="dashboard-main">
      <header class="dashboard-header">
        <h1>Dashboard</h1>
        <form th:action="@{/logout}" method="post" style="display:inline;">
          <button type="submit" class="btn-logout">Log out</button>
        </form>
      </header>
      <main class="dashboard-content">
        <div class="dashboard-card">
          <h2>Welcome</h2>
          <p>Signed in successfully. Use the left menu to navigate.</p>
        </div>
      </main>
    </div>
  </div>
  <script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
