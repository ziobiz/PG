<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대시보드 — PG 통합관리자</title>
  <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
</head>
<body>
  <div class="dashboard-wrap">
    <aside class="dashboard-sidebar">
      <div class="logo"><span class="logo-text">PG 통합관리자</span><span class="logo-short">PG</span></div>
      <div th:replace="~{fragments/sidebar :: sidebar(activeMenu='main')}"></div>
    </aside>
    <div class="dashboard-main">
      <header class="dashboard-header">
        <h1>대시보드</h1>
        <form th:action="@{/logout}" method="post" style="display:inline;">
          <button type="submit" class="btn-logout">로그아웃</button>
        </form>
      </header>
      <main class="dashboard-content">
        <div class="dashboard-card">
          <h2>환영합니다</h2>
          <p>로그인에 성공했습니다. 왼쪽 메뉴에서 대시보드, 거래 조회, 영업 조직(총본사~가맹점), 가맹점/총판/멤버 관리, 정산, 터미널/VAN/코드/권한을 이용할 수 있습니다.</p>
        </div>
      </main>
    </div>
  </div>
  <script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
