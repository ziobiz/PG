<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${level.nameKo + ' — PG 통합관리자'}">영업 조직 — PG 통합관리자</title>
  <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}" href="/css/dashboard.css">
</head>
<body>
  <div class="dashboard-wrap">
    <aside class="dashboard-sidebar">
      <div class="logo"><span class="logo-text">PG 통합관리자</span><span class="logo-short">PG</span></div>
      <div th:replace="~{fragments/sidebar :: sidebar(activeMenu=${activeMenu})}"></div>
    </aside>
    <div class="dashboard-main">
      <header class="dashboard-header">
        <h1 th:text="${level.nameKo}">영업 조직</h1>
        <form th:action="@{/logout}" method="post" style="display:inline;">
          <button type="submit" class="btn-logout">로그아웃</button>
        </form>
      </header>
      <main class="dashboard-content">
        <div class="dashboard-card">
          <h2 th:text="${level.nameKo + ' 목록'}">목록</h2>
          <div class="table-wrap">
            <table th:if="${!#lists.isEmpty(list)}">
              <thead>
                <tr>
                  <th>코드</th>
                  <th>명칭</th>
                  <th>상태</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="unit : ${list}">
                  <td th:text="${unit.code}">-</td>
                  <td th:text="${unit.name}">-</td>
                  <td th:text="${unit.status}">-</td>
                </tr>
              </tbody>
            </table>
            <p th:if="${#lists.isEmpty(list)}" class="empty-msg">등록된 데이터가 없습니다.</p>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script th:src="@{/js/sidebar.js}"></script>
</body>
</html>
