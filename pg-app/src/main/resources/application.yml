server:
  port: 8080
  # Nginx 등 리버스 프록시 뒤: X-Forwarded-Proto 반영. 잘못된 헤더면 https↔http 리다이렉트 루프(ERR_TOO_MANY_REDIRECTS) 가능 → 필요 시 FORWARD_HEADERS_STRATEGY=none
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

# 로컬 한 서버 테스트: pg-app 실행 디렉터리가 pg-app 일 때, 상위의 site 폴더를 정적 리소스로 서빙
# (프로젝트 루트에서 ./pg-app/gradlew bootRun 이면 working dir 에 따라 경로 조정 필요)
spring:
  aop:
    proxy-target-class: false  # final 클래스 프록시 오류 방지 (JDK 인터페이스 프록시 사용)
  web:
    resources:
      static-locations: classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/,classpath:/public/,file:../site/
  application:
    name: pg-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/pgdev
    username: ${DB_USER:pgadmin}
    password: ${DB_PASSWORD:}
    # 실행 전: DB_PASSWORD 환경변수 설정 또는 application-local.yml 에 password 설정 후 --spring.profiles.active=local
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
      initialization-fail-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate  # update는 대용량 DB에서 스키마 비교 시 멈출 수 있음. 스키마는 SQL로 관리.
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    # PostgreSQL dialect는 JDBC URL로 자동 선택 (명시 시 HHH90000025 경고). H2는 application-dev.yml 에서 지정.

# 로컬에서 서버 DB 접속 시 아래처럼 주소만 바꿔서 사용 (application-local.yml 또는 환경변수)
# spring.datasource.url: jdbc:postgresql://서버IP:5432/pgdev

# SPA( site ) 연동 시 CORS 허용 오리진 (쉼표 구분)
app:
  # TEMP_REMOVE_AFTER_DEV — 아래 두 플래그·대응 API·업체관리 버튼(삭제개발/업체전체초기화)·OrgHierarchyResetService 는 개발 임시. 정식 완료 후 일괄 삭제.
  features:
    # TEMP_REMOVE_AFTER_DEV — true: [삭제(개발)] POST /api/comp/dev-tree-remove (use_yn=N 만, 물리삭제 없음). ADMIN.
    comp-dev-tree-remove: false
    # TEMP_REMOVE_AFTER_DEV — true: [업체전체초기화] POST /api/comp/admin-reset-org-hierarchy. ADMIN.
    allow-org-hierarchy-reset: false
  data:
    # true 시 기동 직후 업체·연관 데이터 전부 삭제 후 OTL HQ(HQ01)만 유지 (보통 1회 후 false)
    reset-org-hierarchy-on-startup: false
    # true 시 레거시 데모 계층(A01/M100 등) CommandLineRunner 시드 실행
    seed-legacy-demo-hierarchy: false
  # 본사설정 > 서버관리: 요약 자동 새로고침(초), Nginx stub_status URL(선택)
  serverManage:
    uiAutoRefreshSeconds: 120
    nginxStubStatusUrl: ${NGINX_STUB_STATUS_URL:}
  # 일별 트래픽·메모리 피크 수집 (OSHI). NOTI 시스템 모니터 유사 차트용.
  serverUsage:
    enabled: true
    collectIntervalMs: 600000
  # 관리자 SPA 도메인이 카페24·별도 도메인 등 제각각일 수 있어 기본은 전 Origin 허용(*). API는 Bearer만 사용(쿠키 없음).
  # 보수적으로 쓰려면 allow-all-origins: false 후 allowed-origin-patterns 만 나열.
  cors:
    allow-all-origins: true
    allowed-origin-patterns: https://*.icopay.co.kr,https://icopay.co.kr,https://www.icopay.co.kr,http://localhost:*,http://127.0.0.1:*,https://*.cafe24.com,http://*.cafe24.com,https://otlpay.cafe24.com,http://otlpay.cafe24.com,https://www.otlpay.cafe24.com,http://www.otlpay.cafe24.com
  # ChillPay (칠리페이) DirectCredit API 연동
  chillpay:
    merchant-code: ${CHILLPAY_MERCHANT_CODE:M035594}
    api-key: ${CHILLPAY_API_KEY:}
    md5-key: ${CHILLPAY_MD5_KEY:}
    route-no: ${CHILLPAY_ROUTE_NO:4}
    sandbox: ${CHILLPAY_SANDBOX:true}
  # PG 노티 수신(/api/open/pg-notify/{token}) — ziobiz/NOTI 미들웨어 송신원 보완
  # allowed-client-cidrs 비우면 IP 제한 없음. hmac-secret 비우면 HMAC 검증 없음.
  pg-notify:
    allowed-client-cidrs: ${PG_NOTIFY_ALLOWED_CIDRS:}
    hmac-secret: ${PG_NOTIFY_HMAC_SECRET:}
    hmac-header: ${PG_NOTIFY_HMAC_HEADER:X-PG-Notify-Hmac}
