# 운영(prod) 프로파일 — spring.profiles.active=prod 일 때 병합됩니다.
# TEMP_REMOVE_AFTER_DEV — comp-dev-tree-remove / allow-org-hierarchy-reset 및 대응 API·화면 버튼은 개발 임시. 정식 완료 후 코드·이 플래그들 일괄 제거.
# ERR_TOO_MANY_REDIRECTS 시: 루트 application.yml 의 FORWARD_HEADERS_STRATEGY(none)·Nginx X-Forwarded-Proto 점검.
app:
  features:
    comp-dev-tree-remove: true
    # TEMP_REMOVE_AFTER_DEV — 저장소 기본은 false. 서버에서 초기화할 때만 일시 true
    allow-org-hierarchy-reset: false

spring:
  # 운영 기동 약간 단축(불필요 JMX). 오탐·미설정은 기동 시점에 그대로 드러나도록 lazy-init 은 쓰지 않음.
  jmx:
    enabled: false
  datasource:
    hikari:
      # 수동 재시작(export …=20)과 맞춤. 환경변수로 덮어쓰기 가능.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB


