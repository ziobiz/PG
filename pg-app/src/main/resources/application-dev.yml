# H2 인메모리 DB - PostgreSQL 없이 로컬 개발/테스트용
# 실행: --spring.profiles.active=dev
# 또는 환경변수: SPRING_PROFILES_ACTIVE=dev

app:
  cors:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000

spring:
  datasource:
    url: jdbc:h2:mem:pgdev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
