# H2 인메모리 DB - PostgreSQL 없이 로컬 개발/테스트용
# 실행: --spring.profiles.active=dev
# 또는 환경변수: SPRING_PROFILES_ACTIVE=dev

app:
  data:
    # true: 매 기동마다 업체 전부 삭제 후 HQ01만 유지(등록 테스트 시 주의). 1회만 초기화할 때는 false 두고
    #       브라우저에서 GET http://localhost:8080/api/dev/reset-org-hierarchy (dev 프로파일) 호출 권장
    reset-org-hierarchy-on-startup: false
    seed-legacy-demo-hierarchy: false
  cors:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000

spring:
  datasource:
    url: jdbc:h2:mem:pgdev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
