# H2 파일 DB - PostgreSQL 없이 로컬 개발용 (재시작 후에도 데이터 유지)
# DB 파일: pg-app/data/pgdev.mv.db (작업 디렉터리가 pg-app 일 때)
# 실행: --spring.profiles.active=dev
# 또는 환경변수: SPRING_PROFILES_ACTIVE=dev
#
# TEMP_REMOVE_AFTER_DEV — 아래 두 플래그는 [삭제(개발)]·[업체전체초기화] 임시 기능용. 정식 완료 후 yml·코드 일괄 제거.

app:
  features:
    comp-dev-tree-remove: true
    allow-org-hierarchy-reset: true
  data:
    # true: 매 기동마다 업체 전부 삭제 후 HQ01만 유지(등록 테스트 시 주의). 1회만 초기화할 때는 false 두고
    #       브라우저에서 GET http://localhost:8080/api/dev/reset-org-hierarchy (dev 프로파일) 호출 권장
    reset-org-hierarchy-on-startup: false
    seed-legacy-demo-hierarchy: false
  cors:
    allowed-origin-patterns: http://localhost:*,http://127.0.0.1:*,http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000

spring:
  datasource:
    # mem → file: 서버 재시작·종료 후에도 설정·업체 등 DB 데이터 유지
    # create-drop 은 종료 시 스키마 삭제로 동일 증상 발생 → update 사용
    url: jdbc:h2:file:./data/pgdev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
